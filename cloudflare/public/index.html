  resetPerm: () => { if (S.rol !== 'dueno') return; S.perm = permInit(); S.mods = clone(MODS_DEF); saveMatriz(); toast('Matriz y módulos restaurados a la propuesta inicial.'); renderAll(); },
  /* catálogos */
  archProv: el => run('arch', () => Svc.archivar('proveedores', el.dataset.id, true), 'Proveedor archivado. El Dueño puede restaurarlo.'),
  restProv: el => run('arch', () => Svc.archivar('proveedores', el.dataset.id, false), 'Proveedor restaurado.'),
  addProv: () => {
    const f = S.catForm.prov; S.catErr = {};
    if (!f.nombre.trim() || !f.rif.trim()) { S.catErr.prov = 'Escribe el nombre y el RIF del proveedor.'; return render(); }
    run('prov', () => Svc.addProv({...f, rubro: f.rubro.trim() || 'Sin rubro'}), id => { S.catForm.prov = {nombre: '', rif: '', rubro: '', tipo: 'insumo', cond: 'Contado', dias: 30, abonos: false}; return `Proveedor ${id} agregado.`; });
  },
  addRec: () => {
    const n = S.catForm.rec.trim(); S.catErr = {};
    if (!n) { S.catErr.rec = 'Escribe el nombre.'; return render(); }
    run('arec', () => Svc.addRec(n), () => { S.catForm.rec = ''; return 'Agregado a quien recibe.'; });
  },
  delRec: el => run('drec', () => Svc.delRec(el.dataset.v), 'Quitado.'),
  addVeh: () => {
    const f = S.catForm.veh; S.catErr = {};
    if (!f.nombre.trim()) { S.catErr.veh = 'Escribe el nombre o la placa.'; return render(); }
    if (!/[A-Za-z0-9]/.test(f.nombre)) { S.catErr.veh = 'El nombre necesita letras o números.'; return render(); }
    run('aveh', () => Svc.addVeh(f), () => { S.catForm.veh = {nombre: '', tipo: 'truck', chofer: ''}; return 'Vehículo agregado.'; });
  },
  delVeh: el => run('dveh', () => Svc.delVeh(el.dataset.id), 'Vehículo quitado.'),
  /* datos: ejemplo / limpio (doble confirmación) */
  datosPaso: el => { if (S.rol !== 'dueno') return; S.datosAct = el.dataset.v; S.datosStep = 1; S.datosConf = ''; S.datosMsg = ''; render(); },
  datosSig: () => { S.datosStep = 2; S.datosConf = ''; render(); const i = $('#dat-conf'); i && i.focus(); },
  datosCancel: () => { S.datosStep = 0; S.datosConf = ''; render(); },
  datosEjecutar: () => {
    if (S.rol !== 'dueno' || S.datosStep !== 2 || S.datosConf.trim().toUpperCase() !== 'BORRAR') return;
    const act = S.datosAct;
    S.datosMsg = act === 'limpiar' ? 'Borrando el ejemplo… no cierres la página.' : 'Cargando el ejemplo… no cierres la página.'; render();
    run('datos', async () => { await (act === 'limpiar' ? Svc.limpiar() : Svc.cargarEjemplo()); S.datosStep = 0; S.datosConf = ''; S.cgInit = false; hydrate(); fixForms(); S.datosMsg = act === 'limpiar' ? 'Listo: empezaste en limpio. Los catálogos base se conservaron.' : 'Listo: el ejemplo se volvió a cargar.'; }, act === 'limpiar' ? 'Datos de ejemplo borrados. Empiezas en limpio.' : 'Datos de ejemplo cargados de nuevo.');
  }
};
Object.assign(ACT, MR_ACT, WA_ACT, PERS_ACT, EXP_ACT, CAL_ACT, ENT_ACT, INV_ACT);

function reciboModal(id) {
  const p = S.prestamos.find(x => x.id === id); if (!p) return toast('No se encontró el préstamo.', 'warn');
  const e = emp(p.emp), cuota = p.monto / p.cuotas;
  // Cuotas en las quincenas siguientes a la entrega (días 15 y último del mes)
  const fechas = []; let y = D(p.fecha).getFullYear(), mo = D(p.fecha).getMonth(), q = D(p.fecha).getDate() < 15 ? 0 : 1;
  for (let i = 0; i < p.cuotas; i++) { const day = q === 0 ? 15 : new Date(y, mo + 1, 0).getDate(); fechas.push(`${y}-${String(mo + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`); if (q === 1) { mo++; if (mo > 11) { mo = 0; y++; } } q = 1 - q; }
  modal('Recibo de préstamo ' + p.id, `<div class="doc"><div class="dh"><div class="dh-id">${logoImg("doc-logo")}<div><h3>El Maná JL</h3><p>Recibo de préstamo a empleado</p></div></div><div style="text-align:right"><p class="mono">${p.id}</p><p>${fdl(p.fecha)}</p></div></div>
    <p>Recibí de la caja chica de El Maná JL la cantidad de <b>${usd(p.monto)}</b> (${bs(p.monto * p.tasa)} a la tasa de ${N2.format(p.tasa)} Bs/US$) en calidad de préstamo, por concepto de: ${p.motivo}.</p>
    <p style="margin-top:8px">Autorizo que se descuente de mi nómina en <b>${p.cuotas} cuotas quincenales de ${bs(cuota * p.tasa)}</b>.</p>
    <div class="meta" style="margin-top:12px"><div><b>Empleado</b>${e.n}</div><div><b>Área</b>${e.area}</div><div><b>Cédula</b>________________</div><div><b>Entregado por</b>Custodio de caja chica</div></div>
    ${table([{h:'Cuota', f:x => x.i}, {h:'Quincena', f:x => fdl(x.f)}, {h:'Descuento', r:1, f:x => bs(cuota * p.tasa)}], fechas.map((f, i) => ({i:i + 1, f})))}
    <div class="firmas"><div>Firma del empleado</div><div>Firma del custodio</div></div></div>
    ${docBar("Recibo de préstamo " + p.id)}`);
}
function notaModal(id) {
  const n = S.notas.find(x => x.id === id); if (!n) return toast('No se encontró la nota.', 'warn');
  modal((n.tipo === 'Interno' ? 'Transferencia ' : 'Nota de entrega ') + n.id, `<div class="doc"><div class="dh"><div class="dh-id">${logoImg("doc-logo")}<div><h3>El Maná JL</h3><p>${n.tipo === 'Interno' ? 'Transferencia interna a línea salsera' : 'Nota de entrega'}</p></div></div><div style="text-align:right"><p class="mono" style="font-size:18px">${n.id}</p><p>${fdl(n.fecha)}</p></div></div>
    <div class="meta"><div><b>Destino</b>${n.dest}</div><div><b>RIF</b>${n.rif}</div><div><b>Vehículo</b>${n.veh}</div><div><b>Chofer</b>${n.chofer}</div></div>
    ${table([{h:'Cant.', r:1, f:i => N0.format(i.c)}, {h:'Unidad', f:i => i.u}, {h:'Descripción', f:i => i.d}, {h:'Lote / trazabilidad', f:i => `<span class="mono">${i.l}</span>`}], n.items)}
    <div class="firmas"><div>Despachado por</div><div>Recibido conforme</div></div></div>
    ${docBar((n.tipo === "Interno" ? "Transferencia " : "Nota de entrega ") + n.id)}`);
}

/* ---------- Eventos globales ---------- */
const WRITE_ACTS = new Set([...Object.keys(ACT_REQ), 'perm', 'modsToggle', 'resetPerm', 'datosEjecutar']);
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]');
  if (a && !a.disabled && ACT[a.dataset.act] && a.tagName !== 'SELECT' && a.tagName !== 'INPUT') {
    e.preventDefault();
    const k = a.dataset.act, req = ACT_REQ[k];
    if (WRITE_ACTS.has(k) && !Layer.canWrite) { toast('Estás en modo solo lectura: con tu acceso no puedes guardar cambios.', 'warn'); return; }
    if (req && lvl(req[0]) < req[1]) { toast(`Tu rol no puede ${ACT_LBL[k]}.`, 'warn'); return; }
    ACT[k](a, e);
  }
});
document.addEventListener('input', e => {
  const el = e.target, k = el.dataset && el.dataset.k; if (!k || el.type === 'checkbox' || el.tagName === 'SELECT') return;
  const v = el.type === 'number' ? (el.value === '' ? '' : +el.value) : el.value;
  setPath(k, v);
  if (k.startsWith('pol.')) S.polDirty = true;
  if (el.dataset.rerender) return; // se re-dibuja al confirmar (change)
  const sc = SCREENS[S.route]; sc && sc.live && sc.live();
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.actChange && ACT[el.dataset.actChange]) {
    if (WRITE_ACTS.has(el.dataset.actChange) && !Layer.canWrite) { toast('Estás en modo solo lectura: no puedes guardar cambios.', 'warn'); render(); return; }
    if (el.dataset.k) setPath(el.dataset.k, el.value); ACT[el.dataset.actChange](el); return;
  }
  const k = el.dataset && el.dataset.k; if (!k) return;
  if (el.type === 'checkbox') setPath(k, el.checked);
  else if (el.tagName === 'SELECT') setPath(k, el.value);
  else if (el.type === 'number') setPath(k, el.value === '' ? '' : +el.value);
  else setPath(k, el.value);
  if (k.startsWith('pol.')) S.polDirty = true;
  if (el.tagName === 'SELECT' || el.dataset.rerender) render();
  if (k.startsWith('pol.')) renderNav();
});
// Tooltip para gráficos (puntero); los valores también se leen en pantalla
const tip = $('#tip');
document.addEventListener('pointerover', e => { const t = e.target.closest('[data-tip]'); if (!t || e.pointerType === 'touch') return; tip.textContent = t.dataset.tip; tip.hidden = false; });
document.addEventListener('pointermove', e => { if (tip.hidden) return; const x = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8); tip.style.left = x + 'px'; tip.style.top = (e.clientY + 16) + 'px'; });
document.addEventListener('pointerout', e => { if (e.target.closest('[data-tip]')) tip.hidden = true; });

/* ---------- Inicio: carga de datos con estados de cargando, error y vacío ---------- */
function finishBoot() {
  if (Boot.state === 'ready') return;
  Boot.state = 'ready'; hydrate(); fixForms(); restorePref(); try { if (window.Borrador) Borrador.sesion(); } catch (e) { /* sin borrador */ }
  if (S.entry === 'in') { const h = location.hash.slice(1); S.route = SCREENS[h] && can(h) ? h : homeRoute(); if (location.hash.slice(1) !== S.route) history.replaceState(null, '', '#' + S.route); S.last[S.mod] = S.route; }
  renderAll();
}
let chT = null;
function onChange() {
  clearTimeout(chT);
  chT = setTimeout(() => {
    if (Boot.state === 'ready') { hydrate(); fixForms(); softRender(); }
    else if ((Boot.state === 'seeding' || Boot.state === 'empty') && Layer.estado()) finishBoot();
    else renderAll();
  }, 90);
}
async function onReady() {
  if (!Layer.estado()) {
    if (!Layer.canWrite) { Boot.state = 'empty'; renderAll(); return; }
    Boot.state = 'seeding'; renderAll();
    try { await Svc.sembrarInicial(); }
    catch (e) { if (e && e.code !== 'busy') { console.error(e); Boot.state = 'error'; Boot.err = e; renderAll(); return; } }
    if (!(await waitFor(() => Layer.estado(), 40000))) { Boot.state = 'error'; Boot.err = new Error('La carga de los datos iniciales no terminó.'); renderAll(); return; }
  }
  finishBoot();
  if (Layer.canWrite && Layer.modo() === 'ejemplo' && ((Layer.estado() || {}).hv || 0) < HIST_V) Svc.migrarHist().catch(e => { if (e && e.code !== 'busy') console.error(e); });
}
function onErr(col, e) { console.error(col, e); if (Boot.state !== 'ready') { Boot.state = 'error'; Boot.err = e; renderAll(); } else { Store.err = e; softRender(); } }
(function init() {
  renderAll();
  startLayer({onReady, onChange, onError: onErr}).catch(e => { console.error(e); Boot.state = 'error'; Boot.err = e; renderAll(); });
})();
</script>

<script>
/* BORRADOR: guarda lo que la persona está escribiendo (y la pestaña/pantalla donde estaba) para recuperarlo si la página se actualiza.
   Solo este navegador (localStorage), por pantalla y por rol, 24 h. Nunca guarda contraseñas, PIN, claves, cuentas ni tarjetas.
   Si localStorage falla, la pantalla funciona igual. Va ANTES de todo lo demás en la página.
   API: Borrador.registrar(clave, getEstado, setEstado)  estado propio de una pantalla (carrito, filtros...) que vive en JS
        Borrador.tab(ruta[, i])   pestaña abierta        Borrador.exito()  «se guardó bien»: borra lo que ya se envió
        Borrador.limpiar()        borra todo (cambiar rol / salir)    Borrador.sesion()  devuelve al rol/módulo donde estaba
        Borrador.config({ctx, aviso, raices, sesion}) lo usa el portal del cliente */
(function () {
"use strict";
const PRE = 'elmana:borr:', VIDA = 24 * 36e5, DEB = 400, VENTANA = 20000, MAXV = 5000;

let ctxAct = null, modalAbierto = false, restaurando = false, aplicando = false, avisado = false, propio = false, ultimo = null, sesCache = '', tFlush = 0, tObs = 0;

/* ---------- almacenamiento (todo con try/catch) ---------- */
const ls = {
  get(k) { try { const t = localStorage.getItem(k); return t ? JSON.parse(t) : null; } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { /* sin almacenamiento */ } },

async function vApi(metodo, ruta, cuerpo) {
  const r = await fetch('/api/v' + ruta, {method: metodo, headers: {'content-type': 'application/json', 'x-rol': S.rol}, body: cuerpo ? JSON.stringify(cuerpo) : undefined});
  let j = {}; try { j = await r.json(); } catch (e) { /* sin cuerpo */ }

const vSet = (obj, path, val) => { const p = path.split('.'); let o = obj; for (let i = 0; i < p.length - 1; i++) o = o[p[i]] ||= {}; o[p[p.length - 1]] = val; };

  try { const r = await fn(); if (ok) toast(typeof ok === 'function' ? ok(r) : ok); return r; }

  finally { delete V.busy[clave]; render(); }

const vPed = () => V.ped ||= {cid: null, cli: null, precios: {}, cant: {}, metodo: '', obs: '', cat: 'TODAS', verSin: false, cond: 'CREDITO', banco: '', ref: '', pag: 0};

/* Pedido en curso: se guarda en este navegador para no perderlo si se recarga la página */
const V_PED_LS = 'elmana:pedido-en-curso';
function vPedGuardar() {
  try {
    const P = V.ped; if (!P || !P.cid || !Object.keys(P.cant || {}).length) { localStorage.removeItem(V_PED_LS); return; }
    localStorage.setItem(V_PED_LS, JSON.stringify({cid: P.cid, cant: P.cant, metodo: P.metodo || '', obs: P.obs || '', rol: S.rol, ts: Date.now()}));
  } catch (e) { /* sin almacenamiento */ }
}
const vPedBorrarGuardado = () => { try { localStorage.removeItem(V_PED_LS); } catch (e) { /* sin almacenamiento */ } };
async function vPedRecuperar() {
  if (V.pedRec) return; V.pedRec = true;
  try {
    const g = JSON.parse(localStorage.getItem(V_PED_LS) || 'null'), P = vPed();
    if (!g || !g.cid || g.rol !== S.rol || !g.cant || Date.now() - g.ts > 86400e3 || P.cid) return;
    P.cant = g.cant; P.metodo = g.metodo || ''; P.obs = g.obs || '';
    await vPedElegir(g.cid);

/* ---- v-cobro.js ---- */
/* Pantalla de cobro (Fase 2: liquidación). Rachell escribe el pago una sola vez; el sistema calcula el caso por días,
   la ruta (A: nota de entrega a factura · B: factura a nota de crédito o débito), el neto a cobrar y el recibo. */
const vCob = () => V.cob ||= {cid: null, cli: null, q: '', fecha: '', monto: '', banco: '', ref: '', obs: '', exonerar: false, prev: null, apl: {}};
const vNum = s => { s = String(s ?? '').trim().replace(/\s/g, ''); if (!s) return NaN; if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.'); return Number(s); };
const vRutaTxt = r => r === 'A' ? 'Ruta A: nota de entrega, se factura al cobrar' : r === 'B' ? 'Ruta B: factura ya emitida, se ajusta con nota' : 'Importada del Excel: se cobra el monto, sin repreciar';
const vCasoChip = d => d.error ? `<span class="chip c-crit">${vtxt(d.error)}</span>` : `<span class="chip c-${d.caso === 1 ? 'ok' : d.caso === 2 ? 'n' : 'warn'}">${vtxt(d.caso_texto)}</span>`;

/* La tasa la pone el servidor (BCV vigente en la fecha del pago): llega con las notas pendientes y aquí solo se lee. */
const vCobTasa = () => { const t = vCob().prev && vCob().prev.tasa; return t && t.valor > 0 ? t.valor : NaN; };
function vTasaAviso(t, fecha) {
  if (!t) return `<p class="v-alerta">${ic('alert', 16)}No hay tasa BCV guardada para el ${vfecha(fecha)}: no se puede registrar el pago hasta que el Dueño o Administración consulten la tasa.</p>`;
  return `<p class="v-tasa"><b>Tasa BCV: ${N2.format(t.valor)} Bs por US$ 1</b> <span class="muted">· rige para el ${vfecha(t.fecha)}${t.fecha < fecha ? ' (la última publicada hasta esa fecha)' : t.fecha > fecha ? ' (no hay tasa guardada del ' + vfecha(fecha) + ': se usa la más cercana)' : ''}</span></p>${t.respaldo ? `<p class="v-alerta v-aviso">${ic('alert', 16)}Usando la última tasa guardada, del día ${vfecha(t.fecha)}: la consulta al BCV falló.</p>` : ''}`;
}
function vCobUsd() {
  const C = vCob(), bs = vNum(C.monto), t = vCobTasa();
  if (!(bs > 0) || !(t > 0)) return 0;
  return Math.round(Math.round(bs * 100) / t) / 100;
}
const vCobAplicado = () => Object.values(vCob().apl).reduce((a, x) => a + (vNum(x) > 0 ? Math.round(vNum(x) * 100) : 0), 0) / 100;
function vCobResumenHTML() {
  const usdp = vCobUsd(), apl = vCobAplicado(), resto = Math.round((usdp - apl) * 100) / 100;
  return `<dl class="v-dl v-res"><div><dt>Pago en dólares</dt><dd id="v-usd"><b>${vusd(usdp)}</b></dd></div><div><dt>Aplicado a notas</dt><dd><b>${vusd(apl)}</b></dd></div>
    <div><dt>${resto < 0 ? 'Se pasa por' : 'Sin aplicar'}</dt><dd><b class="${resto < 0 ? 'v-neg' : ''}">${vusd(Math.abs(resto))}</b></dd></div></dl>${resto < 0 ? `<p class="v-alerta">${ic('alert', 16)}Lo aplicado supera el pago. Baja el monto de alguna nota.</p>` : ''}`;
}
function vCobDocs() {
  const C = vCob(), pv = C.prev; if (!pv) return '<p class="hint">Cargando notas pendientes…</p>';
  if (!pv.documentos.length) return '<p class="hint">Este cliente no tiene notas ni facturas pendientes de cobro.</p>';
  const hayMora = pv.documentos.some(d => d.caso === 3);
  const tabla = table([
    {h: 'Nota / factura', f: d => `<button type="button" class="btn sm ghost" data-act="vVerDoc" data-id="${d.id_documento}">${vtxt(d.nro || '')}</button>`},
    {h: 'Emisión', f: d => vfecha(d.fecha_emision)}, {h: 'Días', r: 1, f: d => d.dias ?? '—'},
    {h: 'Caso', f: d => vCasoChip(d)}, {h: 'Ruta', f: d => `<span class="v-ruta" title="${esc(vRutaTxt(d.ruta))}">${vtxt(d.ruta === 'SIN_DETALLE' ? 'Excel' : d.ruta || '')}</span>`},
    {h: 'Documento emitido al cobrar', f: d => d.error ? '' : d.ruta === 'A' ? `Factura por ${vusd(d.final.total)}` : d.nota ? `${d.nota.tipo === 'NOTA_CREDITO' ? 'Nota de crédito' : 'Nota de débito'} por ${vusd(d.nota.total)}` : d.ruta === 'B' ? 'Sin ajuste' : '—'},
    {h: 'Neto a cobrar', r: 1, f: d => d.error ? '' : vusd(d.neto)}, {h: 'Ya abonado', r: 1, f: d => d.error ? '' : vusd(d.pagado)}, {h: 'Falta', r: 1, f: d => d.error ? '' : `<b>${vusd(d.restante)}</b>`},
    {h: 'Aplicar este pago (US$)', f: d => d.error ? '' : `<div class="v-apl"><input type="text" inputmode="decimal" class="v-dec" data-apl="${d.id_documento}" value="${esc(C.apl[d.id_documento] ?? '')}" aria-label="Monto a aplicar a ${esc(d.nro || '')}" ${d.restante <= 0 ? 'disabled' : ''}><button type="button" class="btn sm ghost" data-act="vAplTodo" data-id="${d.id_documento}" ${d.restante <= 0 ? 'disabled' : ''}>Todo</button></div>`}
  ], pv.documentos, {empty: 'Sin notas pendientes.'});
  return `${tabla}${hayMora ? `<label class="toggle v-exo"><input type="checkbox" data-act-change="vCobExo" ${C.exonerar ? 'checked' : ''}><span>Exonerar el recargo por mora (exige el PIN de gerencia y queda en la auditoría)</span></label>` : ''}
    <div class="btnrow"><button type="button" class="btn" data-act="vAplRepartir">${ic('compare', 16)}Repartir el pago (más antigua primero)</button><button type="button" class="btn ghost" data-act="vAplLimpiar">Limpiar</button></div>`;
}
async function vCobCargar() {
  const C = vCob(); if (!C.cid) return;
  try { C.prev = await vApi('GET', '/clientes/' + C.cid + '/pendientes' + vQS({fecha: C.fecha || vHoy(), exonerar: C.exonerar ? 1 : ''})); } catch (e) { vErr(e); C.prev = {documentos: []}; }
  render();
}
async function vCobElegir(id) {
  const C = vCob();
  try { const r = await vApi('GET', '/clientes/' + id + '/precios'); C.cli = r.cliente; } catch (e) { return vErr(e); }

}
function scrCobro() {
  return vPantalla(() => {
    const C = vCob(), hoy = vHoy(), retro = C.fecha && C.fecha < hoy;
    const form = !C.cli ? '' : `<div class="form v-pago"><div class="row3"><label class="fld">Fecha del pago<input type="date" data-act-change="vCobFecha" value="${esc(C.fecha || hoy)}" max="${hoy}"></label>
      <label class="fld">Monto recibido (Bs)<input type="text" inputmode="decimal" class="v-dec" data-vk="cob.monto" value="${esc(C.monto)}" placeholder="0,00"></label>
      <div class="fld" id="v-tasa" aria-live="polite">${C.prev ? vTasaAviso(C.prev.tasa, C.fecha || hoy) : '<p class="hint">Consultando la tasa…</p>'}</div></div>
      <div class="row3">${vBancoCampo('cob', C, 'Banco de origen')}
      <label class="fld">Número de referencia<input type="text" data-vk="cob.ref" value="${esc(C.ref)}" maxlength="40" autocomplete="off"></label>
      <label class="fld">Observación<input type="text" data-vk="cob.obs" value="${esc(C.obs)}" maxlength="200" placeholder="Opcional"></label></div>
      ${retro ? `<p class="v-alerta v-pin">${ic('lock', 16)}La fecha es anterior a hoy: para registrar este pago el sistema pedirá el <b>PIN de gerencia</b> y quedará en la auditoría.</p>` : ''}
      <div id="v-res">${vCobResumenHTML()}</div>
      <div class="btnrow"><button type="button" class="btn pri" data-act="vCobrar" ${V.busy.cobrar ? 'disabled' : ''}>${ic('coins', 18)}Registrar pago</button></div></div>`;
    return `${vph('Ventas y liquidación · Fase 2', 'Cobrar y liquidar', 'Escribe el pago una sola vez. Verás qué caso corresponde por los días transcurridos y qué documento se emite.')}
    ${card('1 · Cliente', C.cli ? `<div class="v-cli-b"><div><p class="v-cli-n">${vtxt(C.cli.razon_social)}</p><p class="mono">${vtxt(C.cli.rif_id || 'sin RIF')} · debe ${vusd(C.cli.deuda_cents / 100)}</p></div><button type="button" class="btn sm ghost" data-act="vCobOtro">Cambiar cliente</button></div>` : vPicker('cob', null, C.q))}
    ${C.cli ? card('2 · Notas y facturas pendientes (al ' + vfecha(C.fecha || hoy) + ')', `<div id="v-docs">${vCobDocs()}</div>`, {}) : ''}
    ${C.cli ? card('3 · Datos del pago', form) : ''}`;
  });
}
function vCobRefrescarRes() { const r = $('#v-res'); if (r) r.innerHTML = vCobResumenHTML(); }

/* ---------- Registrar ---------- */
function vCobArmar() {
  const C = vCob(), apl = Object.entries(C.apl).map(([id, v]) => ({id_documento: +id, usd: vNum(v)})).filter(a => a.usd > 0);
  return {id_cliente: C.cid, fecha_pago: C.fecha || vHoy(), monto_bs: vNum(C.monto), banco: C.banco, id_banco: C.id_banco || undefined, referencia: C.ref, observacion: C.obs, exonerar_mora: !!C.exonerar, aplicaciones: apl};
}
function vCobPedirPin(motivo, siguiente) {
  modal('PIN de gerencia', `<div class="form"><p>${vtxt(motivo)}</p><label class="fld">PIN de gerencia<input type="password" inputmode="numeric" id="v-pin" autocomplete="off" maxlength="12"></label><p class="err" id="v-pin-e" role="alert" hidden></p>
    <div class="btnrow"><button type="button" class="btn pri" id="v-pin-ok">Confirmar</button><button type="button" class="btn" data-act="closeModal">Cancelar</button></div></div>`);
  const inp = $('#v-pin'); inp.focus();
  const ok = async () => { const e = $('#v-pin-e'); e.hidden = true; try { await siguiente(inp.value); } catch (er) { e.textContent = er.message; e.hidden = false; } };
  $('#v-pin-ok').addEventListener('click', ok); inp.addEventListener('keydown', ev => { if (ev.key === 'Enter') ok(); });
}
async function vCobEnviar(pin) {
  const C = vCob(), cuerpo = vCobArmar(); if (pin) cuerpo.pin = pin;
  V.busy.cobrar = true;
  try {
    const r = await vApi('POST', '/cobros', cuerpo); closeModal();
    toast('Pago ' + esc(r.recibo) + ' registrado: ' + vusd(r.usd) + '.');
    Object.assign(C, {monto: '', banco: '', id_banco: '', ref: '', obs: '', apl: {}, exonerar: false, fecha: vHoy()}); const cid = C.cid;
    V.clientes = null; V.deuda.data = null; V.deuda.base = null; await vBoot(true); await vCobElegir(cid);
    vCobExito(r);
  } catch (e) {
    if (e.info && e.info.codigo === 'DUPLICADO') { closeModal(); vCobDuplicado(e); }
    else if (e.info && (e.info.codigo === 'PIN' || e.info.codigo === 'PIN_REQUERIDO') && pin) throw e;
    else if (e.info && (e.info.codigo === 'PIN' || e.info.codigo === 'PIN_REQUERIDO')) vCobPedirPin(e.message, p => vCobEnviar(p));
    else if (pin) throw e; else vErr(e);
  } finally { delete V.busy.cobrar; render(); }
}
function vCobDuplicado(e) {
  const x = e.info.existente || {};
  modal('Referencia repetida: no se guardó', `<div class="v-dup"><p class="v-alerta">${ic('alert', 16)}${vtxt(e.message)}</p>
    <dl class="v-dl"><div><dt>Recibo existente</dt><dd><b>${vtxt(x.recibo)}</b></dd></div><div><dt>Cliente</dt><dd>${vtxt(x.cliente)}</dd></div><div><dt>Fecha</dt><dd>${vfecha(x.fecha_pago)}</dd></div>
    <div><dt>Banco y referencia</dt><dd>${vtxt(x.banco)} · ${vtxt(x.referencia)}</dd></div><div><dt>Monto</dt><dd>${vbs(x.monto_bs)} (${vusd(x.usd)})</dd></div></dl>
    <div class="btnrow"><button type="button" class="btn pri" data-act="vVerPago" data-id="${x.id_pago}">Ver el pago existente</button><button type="button" class="btn" data-act="closeModal">Cerrar</button></div></div>`);
}
function vCobExito(r) {
  const liq = r.liquidaciones.map(l => `<li><b>${vtxt(l.nro)}</b>: ${vtxt(l.caso_texto)} (${l.dias} días) · ${l.ruta === 'A' ? 'se emitió la factura ' + vtxt(l.factura.nro_factura_fiscal || l.factura.nro_control_interno) + ' por ' + vusd(l.factura.total) + ', sin descontar inventario otra vez' : l.ruta === 'B' ? (l.nota ? (l.nota.tipo === 'NOTA_CREDITO' ? 'nota de crédito ' : 'nota de débito ') + vtxt(l.nota.nro_fiscal) + ' por ' + vusd(l.nota.total) : 'sin nota de ajuste') : 'liquidada por el monto del Excel'}${l.comision ? ` · comisión: base ${vusd(l.comision.base_neta)}${l.comision.monto != null ? ', ' + vusd(l.comision.monto) + ' (' + N2.format(l.comision.pct) + ' %)' : ', porcentaje del vendedor sin definir'}` : ''}</li>`).join('');
  const av = r.avisos.map(a => `<p class="v-alerta">${ic('alert', 16)}${vtxt(a.mensaje)} (recibo ${vtxt(a.existente.recibo)}, ${vbs(a.existente.monto_bs)})</p>`).join('');
  modal('Pago registrado', `<div class="form"><p><b>${vtxt(r.recibo)}</b> · ${vusd(r.usd)} · aplicado ${vusd(r.aplicado)}${r.sin_aplicar > 0 ? ` · saldo a favor sin aplicar ${vusd(r.sin_aplicar)}` : ''}</p>${av}${liq ? `<ul class="list">${liq}</ul>` : ''}
    <div class="btnrow"><button type="button" class="btn pri" data-act="vVerPago" data-id="${r.id_pago}">${ic('print', 16)}Ver e imprimir el recibo</button><button type="button" class="btn" data-act="closeModal">Seguir cobrando</button></div></div>`);
}

/* ---------- Registro de ventas: lo que de verdad se vendió (datos reales de la base) ---------- */
async function vRegVCargar() {
  const R = V.regv ||= {docs: null, deuda: null, ts: 0, cargando: false}; if (R.cargando) return; R.cargando = true;
  try {
    const [docs, deu, peds] = await Promise.all([vApi('GET', '/documentos' + vQS({desde: vRestar(vHoy(), 29), limite: 1000})), vApi('GET', '/deuda'), vApi('GET', '/pedidos-recientes').catch(() => [])]);
    R.docs = docs; R.deuda = deu; R.peds = peds; R.err = null;
  } catch (e) { R.err = e; R.docs = R.docs || []; }
  R.ts = Date.now(); R.cargando = false; render();
}
function scrRegVentas() {
  return vPantalla(() => {
    const R = V.regv ||= {docs: null, deuda: null, ts: 0, cargando: false};
    if (!R.cargando && (!R.docs || Date.now() - R.ts > 5000)) vRegVCargar(); /* se actualiza al volver a entrar */
    if (!R.docs) return card('', emptyState('Cargando…', 'Un momento.'));
    /* una nota que ya se facturó cuenta una sola vez (como factura); las anuladas no cuentan */
    const docs = R.docs.filter(d => !/^ANULAD/.test(d.estado || '') && d.estado !== 'FACTURADO_DESDE_NE');
    const hoy = vHoy(), lunes = vLunes(hoy), suma = f => docs.filter(f).reduce((a, d) => a + d.total_cents, 0) / 100;
    const por = {}; docs.forEach(d => { const k = d.vendedor_nombre || 'Sin vendedor', o = por[k] ||= {n: k, dia: 0, sem: 0, mes: 0, cli: new Set()}; const u = d.total_cents / 100; o.mes += u; o.cli.add(d.id_cliente); if (d.fecha_emision >= lunes) o.sem += u; if (d.fecha_emision === hoy) o.dia += u; });
    const vend = Object.values(por).sort((a, b) => b.mes - a.mes).slice(0, 5);
    const ult = docs.slice(0, 5), deu = R.deuda || {clientes: [], total: 0};
    const peds = (R.peds || []).slice(0, 8);
    return `${vph('Ventas y liquidación', 'Registro de ventas', 'Lo vendido en los últimos 30 días, con los datos reales del sistema.')}
    ${R.err ? `<p class="v-alerta">${ic('alert', 16)}No se pudo leer todo. Vuelve a entrar en un momento.</p>` : ''}
    <div class="v-stats">${stat('Ventas de hoy', vusd(suma(d => d.fecha_emision === hoy)), 'Total del día')}${stat('Ventas de la semana', vusd(suma(d => d.fecha_emision >= lunes)), 'Desde el lunes')}${stat('Ventas de 30 días', vusd(suma(() => true)), docs.length + (docs.length === 1 ? ' venta' : ' ventas'))}${stat('Por cobrar', vusd(deu.total || 0), (deu.clientes || []).length + ' cliente(s)')}</div>
    <div class="v-2c">${card('Por vendedor', table([{h: 'Vendedor', f: v => `<b>${vtxt(v.n)}</b>`}, {h: 'Hoy', r: 1, f: v => vusd(v.dia)}, {h: 'Semana', r: 1, f: v => vusd(v.sem)}, {h: '30 días', r: 1, f: v => vusd(v.mes)}, {h: 'Clientes', r: 1, f: v => v.cli.size}], vend, {empty: 'Todavía no hay ventas en estos días.'}))}
    ${card('Últimas ventas', table([{h: 'Fecha', f: d => vfecha(d.fecha_emision)}, {h: 'Documento', f: d => `<button type="button" class="btn sm ghost" data-act="vVerDoc" data-id="${d.id_documento}">${vtxt(d.numero_externo || d.nro_control_interno)}</button>`}, {h: 'Cliente', f: d => vtxt(d.razon_social)}, {h: 'Total', r: 1, f: d => `<b>${vusd(d.total_cents / 100)}</b>`}], ult, {empty: 'Todavía no hay ventas en estos días.'}))}</div>
    ${card('Pedidos recientes (PDF al vender)', table([{h: 'Pedido', f: p => `<b>${vtxt(p.nro)}</b>`}, {h: 'Fecha', f: p => vfecha(p.fecha)}, {h: 'Cliente', f: p => vtxt(p.razon_social)}, {h: 'Bultos', r: 1, f: p => N0.format(p.bultos)}, {h: 'Estado', f: p => vtxt(p.estado.toLowerCase())}, {h: '', f: p => `<button type="button" class="btn sm acc" data-act="vPdfPed" data-id="${p.id_pedido}">${ic('download', 14)}PDF de la ${p.tipo === 'FACTURA' ? 'factura' : 'nota'}</button>`}], peds, {empty: 'Todavía no hay pedidos.'}))}`;
  });
}

/* Importación única desde el Excel de cobranza. Se lee en el navegador (SheetJS), se muestra una vista previa, la persona confirma
   la limpieza de nombres (nunca se fusiona solo) y se envía por lotes pequeños. El archivo no se modifica ni se sube entero. */
const VI_COLS = {vend: 0, zona: 1, fecha: 2, ne: 3, cliente: 4, total: 5, fechaPago: 8, bs: 9, tasa: 10, banco: 12, ref: 13};
const vImp = () => V.imp ||= {estado: 'vacio', archivo: '', notas: [], avisos: [], hojas: 0, sinRef: 0, grupos: [], gsel: {}, ejemplo: false, prog: 0, res: null};
function vCargarXLSX() {
  if (window.XLSX) return Promise.resolve();
  return new Promise((ok, ko) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload = ok; s.onerror = () => ko(new Error('No se pudo cargar el lector de Excel. Revisa la conexión a internet.')); document.head.appendChild(s); });
}
function vFechaCelda(v) {
  if (v == null || v === '') return null;
  if (typeof v === 'number') { const d = XLSX.SSF.parse_date_code(v); return d ? `${d.y}-${String(d.m).padStart(2, '0')}-${String(d.d).padStart(2, '0')}` : null; }
  if (v instanceof Date) return v.getFullYear() + '-' + String(v.getMonth() + 1).padStart(2, '0') + '-' + String(v.getDate()).padStart(2, '0');
  const s = String(v).trim(); let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/); if (m) return `${m[1]}-${m[2]}-${m[3]}`;
  m = s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})$/); if (m) { const y = m[3].length === 2 ? '20' + m[3] : m[3]; return `${y}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`; }
  return null;
}
const vNumCelda = v => { if (v == null || v === '') return NaN; if (typeof v === 'number') return v; return vNum(v); };
const vTextoCelda = v => v == null ? '' : String(v).trim().replace(/\s+/g, ' ');

/* Lee todas las hojas con el formato de 15 columnas. Las filas sin N/E con pagos son abonos adicionales de la nota anterior. */
function vImpLeer(wb) {
  const notas = [], avisos = [], vistos = new Map(); let hojas = 0;
  for (const nombre of wb.SheetNames) {
    const filas = XLSX.utils.sheet_to_json(wb.Sheets[nombre], {header: 1, raw: true, defval: null});
    const h = filas.findIndex(r => vTextoCelda(r[0]).toUpperCase() === 'VENDEDOR' && r.length >= 10);
    if (h < 0) { avisos.push(`La hoja «${nombre.trim()}» no tiene la fila de títulos (VENDEDOR…): se omitió.`); continue; }
    hojas++; let actual = null;
    for (let i = h + 1; i < filas.length; i++) {
      const r = filas[i]; if (!r || r.every(c => c == null || c === '')) continue;
      const ne = vTextoCelda(r[VI_COLS.ne]), cli = vTextoCelda(r[VI_COLS.cliente]), bs = vNumCelda(r[VI_COLS.bs]);
      if (ne && cli) {
        const monto = Math.round(vNumCelda(r[VI_COLS.total]) * 100) / 100, fecha = vFechaCelda(r[VI_COLS.fecha]);
        if (!(monto > 0) || !fecha) { avisos.push(`Hoja «${nombre.trim()}», fila ${i + 1}: la nota ${ne} no tiene monto o fecha válidos: se omitió.`); actual = null; continue; }
        if (vistos.has(ne)) { avisos.push(`La nota ${ne} aparece más de una vez (hoja «${nombre.trim()}»): se usa la primera.`); actual = null; continue; }
        actual = {numero: ne, fecha, cliente: cli, vendedor: vTextoCelda(r[VI_COLS.vend]), zona: vTextoCelda(r[VI_COLS.zona]), monto, pagos: [], hoja: nombre.trim()}; vistos.set(ne, true); notas.push(actual);
      } else if (!ne && bs > 0) {
        if (!actual) { avisos.push(`Hoja «${nombre.trim()}», fila ${i + 1}: hay un pago sin nota anterior: se omitió.`); continue; }
      } else if (ne && !cli) { avisos.push(`Hoja «${nombre.trim()}», fila ${i + 1}: la nota ${ne} no tiene cliente: se omitió.`); actual = null; continue; }
      else continue;
      if (!actual) continue;
      if (bs > 0) {
        const tasa = vNumCelda(r[VI_COLS.tasa]), fp = vFechaCelda(r[VI_COLS.fechaPago]);
        if (!(tasa > 0) || !fp) { avisos.push(`Hoja «${nombre.trim()}», fila ${i + 1}: un pago de la nota ${actual.numero} no tiene tasa o fecha: se omitió.`); continue; }
        actual.pagos.push({fecha: fp, bs: Math.round(bs * 100) / 100, tasa, banco: vTextoCelda(r[VI_COLS.banco]), ref: vTextoCelda(r[VI_COLS.ref])});
      }
    }
  }
  return {notas, avisos, hojas};
}

  while (eBytesB64(foto) > E_TOPE_BYTES && q > 0.31) { q = Math.round((q - 0.1) * 10) / 10; foto = eDibujar(img, lado, q); }
  while (eBytesB64(foto) > E_TOPE_BYTES && lado > 640) { lado -= 128; foto = eDibujar(img, lado, q); }
  if (eBytesB64(foto) > E_TOPE_BYTES * 1.3) throw new Error('No se pudo reducir esa foto a un tamaño razonable. Prueba con otra.');
  const mini = eDibujar(img, 160, 0.5);
  if (img.close) img.close();
  return {foto, mini, antes: file.size, despues: eBytesB64(foto), lado, calidad: q};
}

/* ---- e-entregas.js ---- */
/* Pantalla «Entregas con foto» (Despachos): subir la foto que manda el transporte, ver miniaturas, ampliar, confirmar o rechazar,
   y la lista de facturas y notas con «entrega sin verificar». */
const E_TABS = [['SUBIDA', 'Por confirmar'], ['SIN', 'Sin verificar'], ['CONFIRMADA', 'Confirmadas'], ['RECHAZADA', 'Rechazadas'], ['LLEG', 'Del cliente']];
const E_CHIP = {SUBIDA: ['warn', 'Por confirmar'], CONFIRMADA: ['ok', 'Confirmada'], RECHAZADA: ['crit', 'Rechazada']};

async function eCargar() {
  if (EN.cargando) return; EN.cargando = true;
  try { [EN.lista, EN.sin, EN.lleg] = await Promise.all([eApi('GET', '/'), eApi('GET', '/sin-verificar'), eApi('GET', '/llegadas')]); EN.err = null; }
  catch (e) { EN.err = e; EN.lista = EN.lista || []; EN.sin = EN.sin || []; EN.lleg = EN.lleg || []; }
  finally { EN.cargando = false; }
  render();
}
const eConteo = k => k === 'LLEG' ? (EN.lleg || []).length : k === 'SIN' ? (EN.sin || []).length : (EN.lista || []).filter(x => x.estado === k).length;
const E_DEF_ENT = [{tipo: 'Documento', valores: x => x.nro, detalle: x => x.cliente}, {tipo: 'Cliente', valores: x => x.cliente, detalle: x => x.nro}, {tipo: 'RIF', valores: x => x.rif, detalle: x => x.cliente}];
const eFilas = () => Busca.filtrar(EN.tab === 'LLEG' ? (EN.lleg || []) : EN.tab === 'SIN' ? (EN.sin || []) : (EN.lista || []).filter(x => x.estado === EN.tab), EN.q, Busca.textosDe(E_DEF_ENT));
const ePorPagina = () => innerWidth >= 1000 ? Math.max(3, Math.min(8, Math.floor((innerHeight - 360) / 70))) : 5;

/* Miniaturas: solo las de la página visible, en una petición liviana (~5 KB cada una) */
async function eMinis(ids) {
  const faltan = ids.filter(i => !(i in EN.minis)); if (!faltan.length) return;
  faltan.forEach(i => { EN.minis[i] = null; });
  try { const r = await eApi('GET', '/minis' + eQS({ids: faltan.join(',')})); for (const i of faltan) EN.minis[i] = r[i] || ''; } catch (e) { faltan.forEach(i => { delete EN.minis[i]; }); return; }
  for (const i of faltan) document.querySelectorAll(`.e-th[data-mini="${i}"]`).forEach(b => { if (EN.minis[i]) b.innerHTML = `<img alt="Miniatura de la entrega" src="data:image/jpeg;base64,${EN.minis[i]}">`; });
}
const eThumb = x => `<button type="button" class="e-th" data-act="eVerFoto" data-id="${x.id}" data-mini="${x.id}" aria-label="Ampliar la foto de ${etxt(x.nro)}">${EN.minis[x.id] ? `<img alt="Miniatura de la entrega" src="data:image/jpeg;base64,${EN.minis[x.id]}">` : ic('camera', 22)}</button>`;

const eTextoLlegada = l => 'El cliente recibió <b>' + l.recibidos + '</b>' + (l.despachados != null ? ' de ' + l.despachados : '') + ' bultos' + (l.coincide === false ? ' · <b>no coincide</b>' : '');
function eFilaLleg(x) {
  return `<li class="e-row"><button type="button" class="e-th" data-act="eVerLlegada" data-id="${x.id}" aria-label="Ver la foto que subió el cliente de ${etxt(x.nro)}">${ic('camera', 22)}</button><div class="e-b"><p class="e-n"><b>${etxt(x.nro)}</b> <span class="muted">${x.tipo === 'NOTA_ENTREGA' ? 'Nota de entrega' : 'Factura'}</span></p><p class="e-s">${etxt(x.cliente)}</p>
    <p class="e-s">${eTextoLlegada(x)} · ${eTs(x.foto_ts)}${x.arranco_reloj ? ' · su foto arrancó el plazo' : ''}</p></div>
    <div class="e-a">${x.coincide === false ? chip('No coincide', 'crit') : x.coincide ? chip('Coincide', 'ok') : chip('Sin comparar', 'warn')}<button type="button" class="btn sm" data-act="eVerLlegada" data-id="${x.id}">Ver foto</button></div></li>`;
}
function eFilaEntrega(x) {

    <div class="e-a">${chip(txt, tono)}${x.estado === 'SUBIDA' && puedeConf ? `<button type="button" class="btn sm pri" data-act="eConfirmar" data-id="${x.id}">Confirmar</button>` : ''}<button type="button" class="btn sm" data-act="eVerFoto" data-id="${x.id}">Ver</button></div></li>`;
}
function eFilaSin(x) {
  const puedeSubir = lvl('e-entregas') >= 2;
  return `<li class="e-row"><span class="e-th e-th0">${ic('truck', 22)}</span><div class="e-b"><p class="e-n"><b>${etxt(x.nro)}</b> <span class="muted">${x.tipo === 'NOTA_ENTREGA' ? 'Nota de entrega' : 'Factura'} · ${eUsd(x.total)}</span></p><p class="e-s">${etxt(x.cliente)}</p>
    <p class="e-s">Emitida ${fdl(x.fecha_emision)} (hace ${x.dias_sin_foto} d)${x.ultima === 'RECHAZADA' ? ` · foto rechazada: ${etxt(x.motivo || '')}` : ''}</p></div>
    <div class="e-a">${chip('Entrega sin verificar', 'warn')}${puedeSubir ? `<button type="button" class="btn sm pri" data-act="eElegirDoc" data-id="${x.id_documento}">Subir foto</button>` : ''}</div></li>`;
}
function eSubirCard() {
  const U = EN.up, puede = lvl('e-entregas') >= 2;
  if (!puede) return card('Subir foto de entrega', '<p class="hint">Tu rol solo consulta las entregas. La foto la sube Despachos, el Jefe de producción o el Dueño.</p>');

    cuerpo = `<div class="e-doc"><p><b>${etxt(d.nro)}</b> · ${etxt(d.cliente)}</p><p class="hint">${d.tipo === 'NOTA_ENTREGA' ? 'Nota de entrega' : 'Factura'} · ${eUsd(d.total)}</p><button type="button" class="btn sm ghost" data-act="eCambiarDoc">Cambiar documento</button></div>
      <label class="fld e-file">2. Foto que mandó el transporte<input type="file" accept="image/*" data-act-change="eFoto" aria-label="Elegir la foto de entrega"></label>
      ${U.ocupado ? '<p class="hint">Comprimiendo la foto…</p>' : ''}
      ${U.aviso ? `<p class="err" role="alert">${etxt(U.aviso)}</p>` : ''}
      ${U.foto ? `<div class="e-prev"><img alt="Vista previa de la foto ya comprimida" src="${U.vista}"><p class="e-size" aria-live="polite"><b>${eBytes(U.antes)} → ${eBytes(U.despues)}</b></p></div>
      <label class="fld">3. Hora real de la entrega (vacío = ahora)<input type="datetime-local" data-ek="up.hora" value="${esc(U.hora)}"></label>

  }

}
const eDocItems = lista => lista.length ? lista.map(x => `<li><button type="button" class="v-pk-b" data-act="eElegirDoc" data-id="${x.id_documento}"><b>${etxt(x.nro)}</b><span>${etxt(x.cliente)} · ${eUsd(x.total)} · ${x.tipo === 'NOTA_ENTREGA' ? 'nota' : 'factura'}</span></button></li>`).join('') : '<li class="hint" style="padding:8px">No hay documentos sin foto con ese texto.</li>';

function scrEntregas() {
  return ePantalla(() => {
    if (EN.lista === null) { eCargar(); return card('', emptyState('Cargando…', 'Un momento.')); }
    if (EN.err && !EN.lista.length && !EN.sin.length) return card('', emptyState('No se pudo cargar', etxt(EN.err.message), '<button type="button" class="btn pri" data-act="eRecargar">Reintentar</button>'));
    const filas = eFilas(), n = ePorPagina(), pags = Math.max(1, Math.ceil(filas.length / n)); EN.pag = Math.min(EN.pag, pags - 1);
    const vis = filas.slice(EN.pag * n, EN.pag * n + n), sin = (EN.sin || []).length;
    setTimeout(() => eMinis(EN.tab === 'SIN' || EN.tab === 'LLEG' ? [] : vis.map(x => x.id)), 0);
    const aviso = sin ? `<div class="v-alerta v-aviso" role="status">${ic('alert', 18)}<span><b>${sin} factura(s) o nota(s) con entrega sin verificar.</b> Sin la foto de entrega, el plazo de crédito del cliente no arranca. Despachos: pídele la foto al transporte.</span></div>` : '';
    const tabs = E_TABS.map(([k, t]) => `<button type="button" class="v-cat" data-act="eTab" data-v="${k}" aria-pressed="${EN.tab === k}">${t} (${eConteo(k)})</button>`).join('');
    const lista = vis.length ? `<ul class="e-lista">${vis.map(x => EN.tab === 'LLEG' ? eFilaLleg(x) : EN.tab === 'SIN' ? eFilaSin(x) : eFilaEntrega(x)).join('')}</ul>` : emptyState(EN.q ? 'Nada coincide' : EN.tab === 'SIN' ? 'Todo verificado' : EN.tab === 'LLEG' ? 'Sin avisos de clientes' : 'Sin entregas aquí', EN.q ? 'Prueba con otro texto.' : EN.tab === 'SIN' ? 'No hay facturas ni notas esperando foto.' : EN.tab === 'LLEG' ? 'Cuando un cliente avise que le llegó el pedido, verás aquí su foto y el total de bultos.' : 'Cuando suban fotos, aparecerán en esta lista.');
    const pie = filas.length > n ? `<div class="e-pag"><button type="button" class="btn sm" data-act="ePag" data-d="-1" ${EN.pag === 0 ? 'disabled' : ''}>Anterior</button><span>Página ${EN.pag + 1} de ${pags} · ${filas.length} en total</span><button type="button" class="btn sm" data-act="ePag" data-d="1" ${EN.pag >= pags - 1 ? 'disabled' : ''}>Siguiente</button></div>` : '';
    return `${ph('Planta · salida', 'Entregas con foto', '', '')}${aviso}
    <div class="e-2c">${eSubirCard()}${card('Entregas', `<div class="e-tabs">${tabs}</div><label class="fld bq-f">Buscar<input type="search" aria-label="Buscar entregas" ${Busca.atr('e-ent')} value="${esc(EN.q)}" placeholder="Número, cliente o RIF"></label>${lista}${pie}`)}</div>`;
  });
}

async function eVerFoto(id) {

  const cab = f => `<div class="e-big"><div class="e-bigi" id="e-bigi">${EN.fotos[id] ? `<img alt="Foto de la entrega de ${etxt(x.nro)}" src="data:image/jpeg;base64,${EN.fotos[id]}">` : (EN.minis[id] ? `<img class="e-borr" alt="Cargando foto" src="data:image/jpeg;base64,${EN.minis[id]}"><p class="hint e-carg">Cargando la foto…</p>` : '<p class="hint">Cargando la foto…</p>')}</div>
    <dl class="v-dl"><div><dt>Documento</dt><dd>${etxt(x.nro)}</dd></div><div><dt>Cliente</dt><dd>${etxt(x.cliente)}</dd></div><div><dt>Hora de la entrega</dt><dd>${eFechaHora(x.fecha_hora)}</dd></div><div><dt>Subida por</dt><dd>${etxt(x.subido_rol)} · ${eTs(x.subido_ts)}</dd></div>

      const box = $('#e-bigi'); if (box) box.innerHTML = `<img alt="Foto de la entrega de ${etxt(x.nro)}" src="data:image/jpeg;base64,${r.foto}">`;

function eRechazarModal(id) {

/* ---- e-cobranza.js ---- */

const E_EST = {TRAMO1: ['ok', 'Descuento A'], TRAMO2: ['warn', 'Descuento B'], VENCIDA: ['crit', 'Vencida'], PAUSADA: ['n', 'En pausa']};
const E_FILTROS = [['TODOS', 'Todos'], ['TRAMO1', 'Descuento A'], ['TRAMO2', 'Descuento B'], ['VENCIDA', 'Vencidas'], ['PAUSADA', 'En pausa']];

  catch (e) { EN.pl.err = e; EN.pl.data = EN.pl.data || {documentos: [], ajustes: {faltantes: []}, resumen: {}, sin_verificar: 0}; EN.pl.disputas = EN.pl.disputas || []; }
  finally { EN.pl.cargando = false; }

}
const E_DEF_PLZ = [{tipo: 'Documento', valores: x => x.nro, detalle: x => x.cliente}, {tipo: 'Cliente', valores: x => x.cliente, detalle: x => x.nro}, {tipo: 'RIF', valores: x => x.rif, detalle: x => x.cliente}];
const ePlzFilas = () => Busca.filtrar((EN.pl.data.documentos || []).filter(d => EN.pl.f === 'TODOS' || d.estado === EN.pl.f), EN.pl.q, Busca.textosDe(E_DEF_PLZ));
const eRestante = d => d.estado === 'VENCIDA' ? `vencida hace ${d.dias_vencida} d` : d.estado === 'PAUSADA' ? 'plazo detenido' : ED.textoRestante(d.restante_ms);
const ePct = d => d.descuento_pct != null ? '− ' + N2.format(d.descuento_pct) + ' %' : d.recargo_pct != null ? '+ ' + N2.format(d.recargo_pct) + ' %' : '<span class="muted">sin cargar</span>';

    }

function eResolverModal(id) {

/* ---------- Ajustes de crédito (solo Dueño) ---------- */
async function eAjustesCargar() { try { EN.aj.data = await eApi('GET', '/ajustes'); EN.aj.err = null; } catch (e) { EN.aj.err = e; EN.aj.data = {}; } render(); }
function scrAjustes() {
  return ePantalla(() => {
    const A = EN.aj; if (!A.data) { eAjustesCargar(); return card('', emptyState('Cargando…', 'Un momento.')); }
    const a = A.data, v = k => a[k] == null ? '' : a[k], puede = lvl('e-ajustes') >= 3, dis = puede ? '' : 'disabled';

    ${a.faltantes && a.faltantes.length ? `<div class="v-alerta v-aviso" role="status">${ic('alert', 18)}<span><b>Sin cargar: ${a.faltantes.join(', ')}.</b> Mientras estén vacíos no se aplica ningún descuento ni recargo; solo se muestran los días y «vencida».</span></div>` : ''}
    ${card('Plazos y porcentajes', `<div class="form">
      <div class="row2">${f('dias_tramo1', 'Días del tramo 1 (descuento A)')}${f('dias_tramo2', 'Días del tramo 2 (descuento B)')}</div>

      <p class="err" id="e-aj-e" role="alert" hidden></p>${puede ? `<div class="btnrow"><button type="button" class="btn pri" data-act="eAjustesGuardar" ${EN.busy.aj ? 'disabled' : ''}>${S.rol === 'dueno' ? 'Guardar ajustes' : 'Enviar al Dueño para aprobar'}</button></div>` : ''}</div>`)}`;
  });
}
async function eAjustesGuardar() {
  const g = k => $('#e-aj-' + k).value.trim().replace(',', '.'), err = $('#e-aj-e'); err.hidden = true;
  const b = {dias_tramo1: g('dias_tramo1'), dias_tramo2: g('dias_tramo2'), descuento1_pct: g('descuento1_pct'), descuento2_pct: g('descuento2_pct'), recargo_mora_pct: g('recargo_mora_pct')};
  const val = ED.validarAjustes(b); if (val.error) { err.textContent = val.error; err.hidden = false; return; }
  const r = await eRun('aj', () => eApi('PUT', '/ajustes', val.ajustes), x => esc(x.mensaje || 'Ajustes guardados.'));
  if (r) { EN.aj.data = null; EN.pl.data = null; }
}

/* ---------- Registro en la aplicación ---------- */
Object.assign(ICONS, {camera: '<path d="M4 8h3l1.6-2.4h6.8L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.6"/>'});
Object.assign(PERM_DEF, {'e-entregas': 'jefeprod:3 empaque:2', 'e-plazos': 'cobranza:2 adm:1 ventas:1', 'e-ajustes': 'adm:3'});
Object.assign(SCREENS, {
  'e-entregas': {mod: 'prod', g: 'Planta', t: 'Entregas con foto', s: 'Entregas', ic: 'camera', r: scrEntregas},
  'e-plazos':   {mod: 'adm', g: 'Ventas y liquidación', t: 'Plazos y reclamos de entrega', s: 'Plazos', ic: 'calendar', r: scrPlazos},

S.perm = permInit();
const EACT_REQ = {eSubir: ['e-entregas', 2], eFoto: ['e-entregas', 2], eConfirmar: ['e-entregas', 3], eRechazar: ['e-entregas', 3], eResolver: ['e-plazos', 2], eAjustesGuardar: ['e-ajustes', 3]};
const EACT_LBL = {eSubir: 'subir fotos de entrega', eFoto: 'subir fotos de entrega', eConfirmar: 'confirmar entregas', eRechazar: 'rechazar fotos de entrega', eResolver: 'resolver reclamos de entrega', eAjustesGuardar: 'cambiar los ajustes de crédito'};
Object.assign(ACT_REQ, EACT_REQ); Object.assign(ACT_LBL, EACT_LBL); Object.keys(EACT_REQ).forEach(k => WRITE_ACTS.add(k));

const EACT = {
  eRecargar: () => { EN.lista = null; render(); },
  eTab: el => { EN.tab = el.dataset.v; EN.pag = 0; render(); },
  ePag: el => { if (el.disabled) return; EN.pag = Math.max(0, EN.pag + (+el.dataset.d)); render(); },
  eVerFoto: el => eVerFoto(eId(el)),
  eVerLlegada: el => eVerLlegada(eId(el)),
  eElegirDoc: el => { const d = (EN.sin || []).find(x => x.id_documento === eId(el)); if (!d) return; EN.up = {...EN.up, doc: d, foto: null, mini: null, aviso: '', vista: '', hora: ''}; if (EN.tab !== 'SIN') EN.tab = EN.tab; render(); },

  eSubir: async () => {

<script>
(function () {
"use strict";
/* Pantallas internas del portal de clientes (para el equipo): ficha del cliente con su enlace, pedidos por confirmar y pagos por verificar.
   Todo pasa por cApi() -> /api/v/portal/* (el servidor vuelve a comprobar el rol). Listas paginadas: sin scroll en pantalla grande. */
const CP = {fich: {lista: null, sel: null, ficha: null, q: '', pag: 0, cargandoFicha: false, ultimo: null}, ped: {filas: null, pag: 0, q: ''}, pag: {filas: null, pag: 0, q: ''}, res: null, busy: {}};
const CP_FILAS_LISTA = 7, CP_FILAS = 4;
async function cApi(metodo, ruta, cuerpo) {
  const r = await fetch('/api/v/portal' + ruta, {method: metodo, headers: {'content-type': 'application/json', 'x-rol': S.rol}, body: cuerpo ? JSON.stringify(cuerpo) : undefined});
  let j = {}; try { j = await r.json(); } catch (e) { /* sin cuerpo */ }
  if (!r.ok) { const e = new Error(j.error || 'No se pudo completar la operación.'); e.status = r.status; e.info = j; throw e; }
  return j;
}
const cusd = x => x == null ? '—' : 'US$ ' + N2.format(x), cbs = x => x == null ? '—' : 'Bs ' + N2.format(x);
const cfec = ts => ts ? new Date(ts).toLocaleDateString('es-VE', {day: '2-digit', month: '2-digit', year: 'numeric'}) : '—';
const cPantalla = fn => window.__EM_HTTP ? fn() : ph('Portal de clientes', 'Portal de clientes', '', '') + card('', emptyState('Este módulo necesita el servidor', 'Funciona en la versión con base de datos (Cloudflare).'));
const cErr = e => toast(esc(e && e.message ? e.message : 'No se pudo completar la operación.'), 'err');
const cPag = (n, pag, tam, clave) => {
  const tot = Math.max(1, Math.ceil(n / tam));
  return n > tam ? `<div class="cp-pag"><button type="button" class="btn sm" data-act="cPag" data-k="${clave}" data-d="-1" ${pag <= 0 ? 'disabled' : ''} aria-label="Página anterior">‹ Anterior</button><span>Página ${pag + 1} de ${tot} · ${n} en total</span><button type="button" class="btn sm" data-act="cPag" data-k="${clave}" data-d="1" ${pag >= tot - 1 ? 'disabled' : ''} aria-label="Página siguiente">Siguiente ›</button></div>` : '';
};
async function cResumen() { try { CP.res = await cApi('GET', '/resumen'); } catch (e) { /* el resumen es solo un aviso */ } }
async function cRun(clave, fn, ok) {
  if (CP.busy[clave]) return; CP.busy[clave] = true; render();
  try { const r = await fn(); if (ok) toast(typeof ok === 'function' ? ok(r) : ok); return r; } catch (e) { console.error(e); cErr(e); } finally { delete CP.busy[clave]; render(); }
}

/* ---------- Ficha del cliente ---------- */
const C_DEF_CLI = [{tipo: 'Cliente', valores: c => c.razon_social, detalle: c => c.rif_id || ''}, {tipo: 'RIF', valores: c => c.rif_id, detalle: c => c.razon_social}, {tipo: 'Zona', valores: c => c.zona, detalle: c => c.razon_social}, {tipo: 'Vendedor', valores: c => c.vendedor, detalle: c => c.razon_social}];
async function cCargarLista() { try { CP.fich.lista = await cApi('GET', '/clientes?limite=500'); } catch (e) { cErr(e); CP.fich.lista = CP.fich.lista || []; } render(); }
async function cCargarFicha(id) {
  CP.fich.sel = id; CP.fich.ficha = null; CP.fich.codigo = null; render();
  try { const f = await cApi('GET', '/clientes/' + id); if (CP.fich.sel === id) { CP.fich.ficha = f; render(); } } catch (e) { cErr(e); }
}
function cEstadoEnlace(f) {
  const e = f.enlace_activo; if (!e) return '<span class="chip c-n">Sin enlace activo</span>';
  return `<span class="chip c-ok">Enlace activo</span> <span class="mini">termina en ${esc(e.token_fin)} · ${e.vence_ts ? 'vence el ' + cfec(e.vence_ts) : 'no vence'}</span>`;
}
function cFichaHTML() {
  const F = CP.fich, f = F.ficha;
  if (!F.sel) return `<div class="cp-vacio">${ic('users', 30)}<p>Elige un cliente de la lista para ver su ficha y manejar su enlace del portal.</p></div>`;
  if (!f) return '<p class="hint">Cargando la ficha…</p>';
  const c = f.cliente, puede = lvl('c-ficha') >= 2, cod = F.codigo;
  const linkCompleto = cod ? location.origin + cod.ruta : '';
  return `<div class="cp-ficha"><div class="cp-fh"><div><h2>${esc(c.razon_social)}</h2><p class="hint">${c.ejemplo ? '<span class="chip c-n">EJEMPLO</span> ' : ''}${esc(c.telefono || 'sin teléfono')}</p></div><div>${cEstadoEnlace(f)}</div></div>
    <dl class="cp-kv"><div><dt>RIF</dt><dd>${esc(c.rif_id || '—')}</dd></div><div><dt>Zona</dt><dd>${esc(c.zona || '—')}</dd></div><div><dt>Límite de crédito</dt><dd>${cusd(c.limite_credito_usd)}</dd></div><div><dt>Debe hoy</dt><dd>${cusd(c.deuda)}</dd></div>
      <div><dt>Nivel de precio</dt><dd>${esc(c.nivel_precio || '—')}</dd></div><div><dt>Vendedor</dt><dd>${esc(c.vendedor || '—')}</dd></div></dl>
    ${cod ? `<div class="cp-codigo" role="status"><p><b>Código nuevo.</b> ${esc(cod.aviso)}</p><label class="fld">Enlace para enviar al cliente<input type="text" readonly id="cp-link" value="${esc(linkCompleto)}" onfocus="this.select()"></label>
      <div class="btnrow"><button type="button" class="btn pri" data-act="cCopiar">${ic('clip', 16)}Copiar enlace</button><button type="button" class="btn" data-act="cOcultar">Ya lo envié</button></div></div>` : ''}
    ${puede ? `<div class="cp-acc"><label class="fld cp-dias">Vigencia en días (vacío = no vence)<input type="text" inputmode="numeric" id="cp-dias" maxlength="4" placeholder="Ej.: 30"></label>
      <button type="button" class="btn pri" data-act="cEnlaceGen" ${CP.busy.enl ? 'disabled' : ''}>${f.enlace_activo ? 'Generar uno nuevo (anula el anterior)' : 'Generar enlace'}</button>
      ${f.enlace_activo ? `<button type="button" class="btn" data-act="cEnlaceRev" ${CP.busy.enl ? 'disabled' : ''}>Revocar enlace</button>` : ''}</div>` : '<p class="hint">Tu rol puede ver la ficha pero no generar ni revocar enlaces.</p>'}
    <div class="cp-dos"><div><h3>Pedidos por confirmar (${f.pedidos.length})</h3>${f.pedidos.length ? f.pedidos.map(p => `<p class="cp-li"><b>${esc(p.codigo)}</b> · ${cusd(p.total)}<br><span class="mini">${p.lineas.map(l => esc(l.cantidad + ' × ' + l.nombre)).join(', ')}</span></p>`).join('') : '<p class="hint">Ninguno.</p>'}</div>
      <div><h3>Pagos por verificar (${f.pagos.length})</h3>${f.pagos.length ? f.pagos.map(p => `<p class="cp-li"><b>${esc(p.codigo)}</b> · ${cbs(p.monto_bs)}<br><span class="mini">${esc(p.banco)} · ref. ${esc(p.referencia)} · ${fdl(p.fecha_pago)}</span></p>`).join('') : '<p class="hint">Ninguno.</p>'}</div></div></div>`;
}
function scrCFicha() {
  return cPantalla(() => {
    const F = CP.fich; if (!F.lista) { cCargarLista(); return card('', emptyState('Cargando…', 'Un momento.')); }
    const l = Busca.filtrar(F.lista, F.q, Busca.textosDe(C_DEF_CLI)), tam = CP_FILAS_LISTA, n = l.length; F.pag = Math.min(F.pag, Math.max(0, Math.ceil(n / tam) - 1));
    const vista = l.slice(F.pag * tam, F.pag * tam + tam);
    const items = vista.length ? vista.map(c => `<li><button type="button" class="cp-it ${F.sel === c.id_cliente ? 'on' : ''}" data-act="cElegir" data-id="${c.id_cliente}"><span><b>${esc(c.razon_social)}</b><span class="mini">${esc(c.rif_id || 'sin RIF')} · ${esc(c.zona || 'sin zona')}</span></span>
      <span class="cp-tags">${c.enlace_activo ? '<span class="chip c-ok">Enlace</span>' : ''}${c.pedidos_por_confirmar ? `<span class="chip c-warn">${c.pedidos_por_confirmar} pedido${c.pedidos_por_confirmar > 1 ? 's' : ''}</span>` : ''}${c.pagos_por_verificar ? `<span class="chip c-warn">${c.pagos_por_verificar} pago${c.pagos_por_verificar > 1 ? 's' : ''}</span>` : ''}</span></button></li>`).join('') : '<li class="hint">Ningún cliente coincide.</li>';
    return `${ph('Portal de clientes', 'Ficha del cliente y su enlace', '', '')}<div class="cp-cols"><section class="card cp-izq"><div class="card-b"><label class="fld">Buscar cliente<input type="search" aria-label="Buscar cliente" ${Busca.atr('c-cli')} value="${esc(F.q)}" placeholder="Nombre, RIF, zona o vendedor"></label>
      <ul class="cp-lista">${items}</ul>${cPag(n, F.pag, tam, 'fich')}</div></section><section class="card cp-der"><div class="card-b">${cFichaHTML()}</div></section></div>`;
  });
}
Busca.registrar('c-cli', {sugerir: q => Busca.sugerir(q, CP.fich.lista || [], C_DEF_CLI), vivo: q => { CP.fich.q = q; CP.fich.pag = 0; render(); }, espera: 150});

/* ---------- Pedidos por confirmar ---------- */
const C_DEF_PED = [{tipo: 'Cliente', valores: p => p.cliente, detalle: p => p.codigo}, {tipo: 'Pedido', valores: p => p.codigo, detalle: p => p.cliente}, {tipo: 'RIF', valores: p => p.rif_id, detalle: p => p.cliente}, {tipo: 'Zona', valores: p => p.zona, detalle: p => p.cliente}];
async function cCargarPedidos() { try { CP.ped.filas = await cApi('GET', '/pedidos?estado=POR_CONFIRMAR'); } catch (e) { cErr(e); CP.ped.filas = CP.ped.filas || []; } render(); }
function scrCPedidos() {
  return cPantalla(() => {
    const P = CP.ped; if (!P.filas) { cCargarPedidos(); return card('', emptyState('Cargando…', 'Un momento.')); }
    const l = Busca.filtrar(P.filas, P.q, Busca.textosDe(C_DEF_PED)), tam = CP_FILAS, n = l.length; P.pag = Math.min(P.pag, Math.max(0, Math.ceil(n / tam) - 1));
    const puede = lvl('c-pedidos') >= 2;
    const cuerpo = l.slice(P.pag * tam, P.pag * tam + tam).map(p => `<article class="cp-tarj"><div class="cp-t1"><div><b>${esc(p.codigo)}</b> · ${esc(p.cliente)}<div class="mini">${esc(p.rif_id || '')} · ${esc(p.zona || 'sin zona')} · ${cfec(p.creado)}</div></div><div class="cp-monto">${cusd(p.total)}</div></div>
      <p class="cp-lin">${p.lineas.map(x => esc(x.cantidad + ' × ' + x.nombre)).join(' · ')}</p>${p.nota ? `<p class="mini"><b>Nota del cliente:</b> ${esc(p.nota)}</p>` : ''}
      <div class="cp-t2">${p.alcanza ? '<span class="chip c-ok">Hay inventario</span>' : '<span class="chip c-crit">Falta inventario</span>'}
      ${puede ? `${(() => { const L = vBancos(); return L && L.bancos && L.bancos.length ? `<label class="cp-sel">Banco<select id="cp-banco-${p.id}"><option value="">Elige el banco…</option>${L.bancos.map(b => `<option value="${esc(b.nombre)}">${esc(b.nombre)}</option>`).join('')}</select></label>` : ''; })()}<label class="cp-sel">Generar como<select id="cp-tipo-${p.id}"><option value="NOTA_ENTREGA" ${p.tipo_sugerido === 'NOTA_ENTREGA' ? 'selected' : ''}>Nota de entrega</option><option value="FACTURA" ${p.tipo_sugerido === 'FACTURA' ? 'selected' : ''}>Factura</option></select></label>
      <button type="button" class="btn pri sm" data-act="cPedAprobar" data-id="${p.id}" ${CP.busy['p' + p.id] ? 'disabled' : ''}>Aprobar</button><button type="button" class="btn sm" data-act="cPedRechazar" data-id="${p.id}">Rechazar</button>` : ''}</div></article>`).join('');
    return `${ph('Portal de clientes', 'Pedidos por confirmar', '', '')}${card('', `<label class="fld">Buscar pedido<input type="search" aria-label="Buscar pedido" ${Busca.atr('c-ped')} value="${esc(P.q)}" placeholder="Cliente, RIF, zona o código PP-"></label>
      <p class="hint">Al aprobar se genera la nota de entrega o factura normal y baja el inventario. Si algo falla (por ejemplo falta inventario), el pedido sigue aquí y se ve el motivo.</p>
      <div class="cp-tarjs">${cuerpo || '<p class="vacio">No hay pedidos por confirmar.</p>'}</div>${cPag(n, P.pag, tam, 'ped')}`)}`;
  });
}
Busca.registrar('c-ped', {sugerir: q => Busca.sugerir(q, CP.ped.filas || [], C_DEF_PED), vivo: q => { CP.ped.q = q; CP.ped.pag = 0; render(); }, espera: 150});

/* ---------- Pagos por verificar ---------- */
const C_DEF_PAG = [{tipo: 'Cliente', valores: p => p.cliente, detalle: p => p.codigo}, {tipo: 'Reporte', valores: p => p.codigo, detalle: p => p.cliente}, {tipo: 'Banco', valores: p => p.banco, detalle: p => p.cliente}, {tipo: 'Referencia', valores: p => p.referencia, detalle: p => p.cliente}, {tipo: 'RIF', valores: p => p.rif_id, detalle: p => p.cliente}];
async function cCargarPagos() { try { CP.pag.filas = await cApi('GET', '/pagos?estado=POR_VERIFICAR'); } catch (e) { cErr(e); CP.pag.filas = CP.pag.filas || []; } render(); }
function scrCPagos() {
  return cPantalla(() => {
    const P = CP.pag; if (!P.filas) { cCargarPagos(); return card('', emptyState('Cargando…', 'Un momento.')); }
    const l = Busca.filtrar(P.filas, P.q, Busca.textosDe(C_DEF_PAG)), tam = CP_FILAS, n = l.length; P.pag = Math.min(P.pag, Math.max(0, Math.ceil(n / tam) - 1));
    const puede = lvl('c-pagos') >= 2, hoy = new Date().toISOString().slice(0, 10);
    const cuerpo = l.slice(P.pag * tam, P.pag * tam + tam).map(p => `<article class="cp-tarj"><div class="cp-t1"><div><b>${esc(p.codigo)}</b> · ${esc(p.cliente)}<div class="mini">${esc(p.rif_id || '')} · ${esc(p.banco)} · ref. <span class="mono">${esc(p.referencia)}</span> · pagó el ${fdl(p.fecha_pago)}</div></div><div class="cp-monto">${cbs(p.monto_bs)}</div></div>
      ${p.nota ? `<p class="mini"><b>Nota del cliente:</b> ${esc(p.nota)}</p>` : ''}
      <div class="cp-t2">${p.tiene_comprobante ? `<button type="button" class="btn sm" data-act="cPagComprobante" data-id="${p.id}">Ver comprobante</button>` : '<span class="chip c-n">Sin comprobante</span>'}${p.fecha_pago < hoy ? '<span class="chip c-warn">Fecha pasada: pide el PIN de gerencia</span>' : '<span class="chip c-n">Del día</span>'}
      ${puede ? `${p.fecha_pago < hoy ? `<label class="cp-sel">PIN<input type="password" id="cp-pin-${p.id}" autocomplete="off" inputmode="numeric" maxlength="12" placeholder="PIN"></label>` : ''}<button type="button" class="btn pri sm" data-act="cPagConfirmar" data-id="${p.id}" ${CP.busy['g' + p.id] ? 'disabled' : ''}>Confirmar y aplicar</button><button type="button" class="btn sm" data-act="cPagRechazar" data-id="${p.id}">Rechazar</button>` : ''}</div></article>`).join('');
    return `${ph('Portal de clientes', 'Pagos por verificar', '', '')}${card('', `<label class="fld">Buscar pago<input type="search" aria-label="Buscar pago" ${Busca.atr('c-pag')} value="${esc(P.q)}" placeholder="Cliente, RIF, banco, referencia o código PR-"></label>
      <p class="hint">Revisa en el banco que el pago exista. Al confirmar se registra el pago y se aplica a las facturas más antiguas primero.</p>
      <div class="cp-tarjs">${cuerpo || '<p class="vacio">No hay pagos por verificar.</p>'}</div>${cPag(n, P.pag, tam, 'pag')}`)}`;
  });
}
Busca.registrar('c-pag', {sugerir: q => Busca.sugerir(q, CP.pag.filas || [], C_DEF_PAG), vivo: q => { CP.pag.q = q; CP.pag.pag = 0; render(); }, espera: 150});

/* ---------- Registro en la aplicación ---------- */
Object.assign(PERM_DEF, {'c-ficha': 'ventas:2 adm:2 cobranza:1', 'c-pedidos': 'ventas:2 adm:2 cobranza:1', 'c-pagos': 'adm:2 cobranza:2 ventas:1'});
Object.assign(SCREENS, {
  'c-ficha':   {mod: 'adm', g: 'Portal de clientes', t: 'Ficha del cliente y su enlace', s: 'Fichas', ic: 'users', r: scrCFicha},
  'c-pedidos': {mod: 'adm', g: 'Portal de clientes', t: 'Pedidos por confirmar', s: 'Pedidos', ic: 'cart', r: scrCPedidos},
  'c-pagos':   {mod: 'adm', g: 'Portal de clientes', t: 'Pagos por verificar', s: 'Pagos', ic: 'receipt', r: scrCPagos}
});
S.perm = permInit();
const CACT_REQ = {cEnlaceGen: ['c-ficha', 2], cEnlaceRev: ['c-ficha', 2], cPedAprobar: ['c-pedidos', 2], cPedRechazar: ['c-pedidos', 2], cPagConfirmar: ['c-pagos', 2], cPagRechazar: ['c-pagos', 2]};
const CACT_LBL = {cEnlaceGen: 'generar enlaces de clientes', cEnlaceRev: 'revocar enlaces de clientes', cPedAprobar: 'aprobar pedidos', cPedRechazar: 'rechazar pedidos', cPagConfirmar: 'confirmar pagos', cPagRechazar: 'rechazar pagos'};
Object.assign(ACT_REQ, CACT_REQ); Object.assign(ACT_LBL, CACT_LBL); Object.keys(CACT_REQ).forEach(k => WRITE_ACTS.add(k));

function cMotivo(titulo, texto, btn, cb) {
  modal(titulo, `<div class="form"><p>${texto}</p><label class="fld">Motivo (el cliente lo va a ver)<input type="text" id="cp-motivo" maxlength="200" placeholder="Por ejemplo: la referencia no aparece en el banco"></label><p class="err" id="cp-mot-e" role="alert" hidden></p>
    <div class="btnrow"><button type="button" class="btn pri" id="cp-mot-ok">${btn}</button><button type="button" class="btn" data-act="closeModal">Cancelar</button></div></div>`);
  $('#cp-motivo').focus();
  $('#cp-mot-ok').addEventListener('click', async () => { const e = $('#cp-mot-e'); e.hidden = true; try { await cb($('#cp-motivo').value); closeModal(); } catch (er) { e.textContent = er.message; e.hidden = false; } });
}
const cId = el => +el.dataset.id;
Object.assign(ACT, {
  cPag: el => { if (el.disabled) return; const k = el.dataset.k; CP[k].pag += +el.dataset.d; render(); },
  cElegir: el => cCargarFicha(cId(el)),
  cOcultar: () => { CP.fich.codigo = null; render(); },
  cCopiar: async () => { const i = $('#cp-link'); if (!i) return; try { await navigator.clipboard.writeText(i.value); toast('Enlace copiado.'); } catch (e) { i.select(); toast('Selecciona y copia el enlace con Ctrl+C.', 'warn'); } },
  cEnlaceGen: async el => {
    const id = CP.fich.sel, d = ($('#cp-dias') || {}).value || '';
    const r = await cRun('enl', () => cApi('POST', '/clientes/' + id + '/enlace', {dias: d.trim() === '' ? null : +d}), 'Enlace generado. Cópialo ahora: no se vuelve a mostrar.');
    if (r) { CP.fich.codigo = r; CP.fich.lista = null; cCargarFicha(id); CP.fich.codigo = r; render(); }
  },
  cEnlaceRev: () => { const id = CP.fich.sel; modal('Revocar el enlace', `<div class="form"><p>El cliente no podrá entrar con su código actual. Podrás generar uno nuevo cuando quieras.</p><div class="btnrow"><button type="button" class="btn pri" id="cp-rev-ok">Sí, revocar</button><button type="button" class="btn" data-act="closeModal">Cancelar</button></div></div>`);
    $('#cp-rev-ok').addEventListener('click', async () => { closeModal(); const r = await cRun('enl', () => cApi('POST', '/clientes/' + id + '/enlace/revocar', {}), 'Enlace revocado.'); if (r) { CP.fich.lista = null; CP.fich.codigo = null; cCargarFicha(id); } }); },
  cPedAprobar: async el => {
    const id = cId(el), t = ($('#cp-tipo-' + id) || {}).value, bs = $('#cp-banco-' + id), banco = bs ? bs.value : '';
    if (bs && !banco) return toast('Elige el banco antes de aprobar.', 'warn');
    const r = await cRun('p' + id, () => cApi('POST', '/pedidos/' + id + '/aprobar', {tipo: t, metodo_pago: banco || undefined}), r => 'Pedido aprobado: se generó ' + r.documento + '.');
    if (r) { CP.ped.filas = null; CP.fich.lista = null; }
  },
  cPedRechazar: el => { const id = cId(el); cMotivo('Rechazar el pedido', 'El pedido no se borra: queda como rechazado y el cliente ve el motivo.', 'Rechazar pedido', async m => { await cApi('POST', '/pedidos/' + id + '/rechazar', {motivo: m}); toast('Pedido rechazado.'); CP.ped.filas = null; CP.fich.lista = null; render(); }); },
  cPagComprobante: async el => {
    const id = cId(el), p = (CP.pag.filas || []).find(x => x.id === id); modal('Comprobante de ' + esc(p ? p.codigo : ''), '<div class="cp-comp" id="cp-comp"><p class="mini">Cargando la imagen…</p></div>');
    try { const r = await cApi('GET', '/pagos/' + id + '/comprobante'); const b = $('#cp-comp'); if (b) b.innerHTML = '<img alt="Comprobante de pago del cliente" src="data:image/jpeg;base64,' + r.comprobante + '">' + (p ? '<p class="mini">' + esc(p.cliente) + ' · ' + cbs(p.monto_bs) + ' · ref. ' + esc(p.referencia) + '</p>' : ''); }
    catch (e) { const b = $('#cp-comp'); if (b) b.innerHTML = '<p class="err">' + esc(e.message) + '</p>'; }
  },
  cPagConfirmar: async el => {
    const id = cId(el), pin = ($('#cp-pin-' + id) || {}).value || undefined;
    const r = await cRun('g' + id, () => cApi('POST', '/pagos/' + id + '/confirmar', {pin}), r => 'Pago confirmado. Recibo ' + r.recibo + ' por ' + cusd(r.usd) + '.');
    if (r) { CP.pag.filas = null; CP.fich.lista = null; V.clientes = null; if (V.deuda) V.deuda.data = null; if (V.pagos) V.pagos.filas = null; }
  },
  cPagRechazar: el => { const id = cId(el); cMotivo('Rechazar el pago reportado', 'No se registra ningún pago: queda como rechazado y el cliente ve el motivo.', 'Rechazar pago', async m => { await cApi('POST', '/pagos/' + id + '/rechazar', {motivo: m}); toast('Pago rechazado.'); CP.pag.filas = null; CP.fich.lista = null; render(); }); }
});

})();
</script>
<script>
(function () {
"use strict";
/* Cambios de precio · pantallas del equipo. Todos los precios son POR BULTO.
   Dueño: sus cambios rigen de una vez y aprueba o rechaza los de Administración (Gerencia → «Precios por aprobar»).
   Administración: sus cambios quedan pendientes hasta que el Dueño responda (Administración → «Precios»). */
const PP = {prod: null, cli: null, cambios: null, cargando: {}, pag: {}, filtro: 'PENDIENTE', busy: {}};
const pHTTP = () => !!window.__EM_HTTP;
const ptxt = s => esc(s == null ? '' : s);
const pDueno = () => S.rol === 'dueno';
const pFecha = ts => ts ? new Date(ts).toLocaleString('es-VE', {day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit'}) : '—';
const pUsdBulto = c => c == null ? '<span class="muted">sin precio</span>' : 'US$ ' + N2.format(c / 100) + ' por bulto';
const pNom = p => ptxt(p.nombre) + ' ' + ptxt(p.gramaje || '');
const P_POR_PAG = 6, P_TARJ_PAG = 3;

async function pApi(m, ruta, cuerpo) {
  const r = await fetch('/api/v/precios' + ruta, {method: m, headers: {'content-type': 'application/json', 'x-rol': S.rol}, body: cuerpo ? JSON.stringify(cuerpo) : undefined});
  let j = {}; try { j = await r.json(); } catch (e) { /* sin cuerpo */ }
  if (!r.ok) { const e = new Error(j.error || 'No se pudo completar la operación.'); e.status = r.status; throw e; }
  return j;
}
async function pGet(ruta) {
  const r = await fetch('/api/v' + ruta, {headers: {'x-rol': S.rol}}); const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'No se pudo leer.'); return j;
}
const pErr = e => toast(esc(e && e.message ? e.message : 'No se pudo completar la operación.'), 'err');
async function pCargar(clave, fn) {
  if (PP.cargando[clave]) return; PP.cargando[clave] = true;
  try { await fn(); } catch (e) { console.error(e); PP[clave] = PP[clave] || []; }
  delete PP.cargando[clave]; render();
}
const pCargarProd = () => pCargar('prod', async () => { PP.prod = (await pGet('/arranque')).productos; });
const pCargarCli = () => pCargar('cli', async () => { PP.cli = await pGet('/clientes?limite=500'); });
const pCargarCambios = () => pCargar('cambios', async () => { PP.cambios = (await pApi('GET', '/cambios')).cambios; PP.ts = Date.now(); });
const pRecargar = () => { PP.cambios = null; PP.prod = null; PP.listas = null; PP.lm = null; };
const pPendientes = () => (PP.cambios || []).filter(c => c.estado === 'PENDIENTE');
const pUltimo = clave => (PP.cambios || []).find(c => c.clave === clave);   // la lista viene de la más nueva a la más vieja

/* Si cambia el puesto o pasaron más de 20 segundos, se vuelve a leer del servidor */
function pFrescura() {
  if (PP.rol !== S.rol) { PP.rol = S.rol; PP.cambios = PP.prod = PP.cli = PP.listas = null; PP.pag = {}; }
  else if (PP.cambios && Date.now() - (PP.ts || 0) > 20000 && !PP.cargando.cambios) PP.cambios = null;
}
function pPantalla(fn) {
  pFrescura();
  if (!pHTTP()) return ph('Precios', 'Precios', '', '') + card('', emptyState('Este módulo necesita el servidor', 'Funciona en la versión con base de datos (Cloudflare).'));
  return fn();
}
function pPaginar(k, total, porPag) {
  const n = Math.max(1, Math.ceil(total / porPag)), p = Math.min(PP.pag[k] || 0, n - 1); PP.pag[k] = p;
  return {desde: p * porPag, hasta: p * porPag + porPag, html: n > 1 ? `<div class="btnrow p-pag"><button type="button" class="btn sm" data-act="pPag" data-k="${k}" data-d="-1" ${p === 0 ? 'disabled' : ''}>Anterior</button><span class="hint">Página ${p + 1} de ${n}</span><button type="button" class="btn sm" data-act="pPag" data-k="${k}" data-d="1" ${p >= n - 1 ? 'disabled' : ''}>Siguiente</button></div>` : ''};
}
const pLineaHTML = l => `<li><span>${ptxt(l.que)}${l.que ? ': ' : ''}${ptxt(l.campo)}</span> <s class="muted">${ptxt(l.antes)}</s> → <b>${ptxt(l.despues)}</b></li>`;
const pChip = c => c.estado === 'PENDIENTE' ? '<span class="chip c-warn">Cambio de precio pendiente de aprobar</span>' : c.estado === 'RECHAZADO' ? '<span class="chip c-crit">Rechazado</span>' : '<span class="chip c-ok">Aprobado</span>';

/* ---------- Administración / Dueño: precios por lista (A y B), contado y crédito, todo POR BULTO ---------- */
const P_MOD = {contado: 'de contado', credito: 'a crédito'};
const pCentsATxt = c => N2.format(c / 100);
const pBs = c => { const t = S.tasaInfo && S.tasaInfo.valor; return t ? 'Bs ' + N2.format(c / 100 * t) : ''; };
const pCargarListas = () => pCargar('listas', async () => { const r = await pApi('GET', '/listas'); PP.listas = r.productos; PP.lm = {listas: r.listas, estados: r.estados}; });
function pCelda(p, lista, mod) {
  const x = (p.listas || {})[lista]; if (!x) return '<td class="r muted">—</td>';
  const c = mod === 'contado' ? x.contado_cents : x.credito_cents, cam = pUltimo('L:' + p.id_producto + ':' + lista + ':' + mod);
  const pend = cam && cam.estado === 'PENDIENTE', rech = cam && cam.estado === 'RECHAZADO';
  const nuevo = pend && cam.lineas[0] ? cam.lineas[0].despues.replace(' por bulto', '') : '';
  return `<td class="r p-cel"><button type="button" class="p-cbtn" data-act="pEditar" data-id="${p.id_producto}" data-l="${lista}" data-m="${mod}" aria-label="Cambiar precio ${P_MOD[mod]} por bulto de ${pNom(p)}, lista ${lista}"><b>US$ ${pCentsATxt(c)}</b><span class="p-bs">${pBs(c)}</span>${pend ? `<span class="chip c-warn">Pendiente de aprobar: ${ptxt(nuevo)}</span>` : ''}${rech ? `<span class="chip c-crit" title="${ptxt(cam.motivo || '')}">Rechazado${cam.motivo ? ': ' + ptxt(cam.motivo.slice(0, 40)) : ''}</span>` : ''}</button></td>`;
}
const pEstadosDe = n => (((PP.lm && PP.lm.listas) || []).find(l => l.nombre === n) || {}).estados || [];
const pTxtEstados = n => { const e = pEstadosDe(n); return e.length ? e.join(', ') : 'ningún estado'; };
function scrPrecios() {
  return pPantalla(() => {
    if (!PP.listas || !PP.lm) { pCargarListas(); return card('', emptyState('Cargando…', 'Un momento.')); }
    if (!PP.cambios) pCargarCambios();
    const t = S.tasaInfo && S.tasaInfo.valor, ls = PP.lm.listas, sel = ls.find(l => l.nombre === PP.sel) ? PP.sel : (ls[0] && ls[0].nombre), sinPrecios = PP.lm.estados.filter(e => !e.lista).length;
    return `${ph('Precios', 'Precios por lista')}
    
    <div class="p-tabs" role="tablist">${ls.map(l => `<button type="button" role="tab" class="btn sm ${l.nombre === sel ? 'pri' : ''}" aria-selected="${l.nombre === sel}" data-act="pLista" data-n="${ptxt(l.nombre)}">Lista ${ptxt(l.nombre)}</button>`).join('')}<button type="button" class="btn sm" data-act="pEstados">Estados y listas${sinPrecios ? ' <span class="chip c-warn">' + sinPrecios + ' sin precios</span>' : ''}</button></div>
    <p class="hint">Estados con la lista ${ptxt(sel)}: <b>${ptxt(pTxtEstados(sel))}</b> · ${t ? 'Bs: referencia a tasa BCV de hoy (Bs ' + N2.format(t) + ' por US$)' : 'Sin tasa BCV hoy'}</p>
    ${card('', `<div class="tw"><table class="p-listas"><thead><tr><th>Producto</th><th class="r">Contado · por bulto</th><th class="r">Crédito · por bulto</th></tr></thead><tbody>
      ${PP.listas.filter(p => (p.listas || {})[sel]).map(p => `<tr><td><b>${pNom(p)}</b></td>${pCelda(p, sel, 'contado')}${pCelda(p, sel, 'credito')}</tr>`).join('')}</tbody></table></div>`)}`;
  });
}
/* Estados y listas: cada estado usa UNA lista; varios pueden compartirla. Solo el Dueño cambia la asignación. */
function pEstadosModal() {
  const dueno = pDueno(), ls = PP.lm.listas;
  modal('Estados y listas de precios', `
    <div class="p-est"><table class="p-listas"><thead><tr><th>Estado</th><th>Zona</th><th>Lista</th><th></th></tr></thead><tbody>${PP.lm.estados.map(e => `<tr><td><b>${ptxt(e.estado)}</b></td><td>${ptxt(e.zona)}</td>
      <td><select data-estado="${ptxt(e.estado)}" aria-label="Lista de ${ptxt(e.estado)}" ${dueno ? '' : 'disabled'}><option value="" ${e.lista ? '' : 'selected'}>Sin precios</option>${ls.map(l => `<option value="${ptxt(l.nombre)}" ${l.nombre === e.lista ? 'selected' : ''}>Lista ${ptxt(l.nombre)}</option>`).join('')}</select></td>
      <td>${dueno ? `<button type="button" class="btn sm" data-act="pPropios" data-e="${ptxt(e.estado)}" ${e.lista && /^Propia/.test(e.lista) ? 'disabled' : ''}>Precios propios</button>` : ''}</td></tr>`).join('')}</tbody></table></div>

  prApi('GET', ruta).then(r => { PR[destino] = r; }).catch(e => { console.error(e); PR[destino] = {error: e.message}; }).finally(() => { PR.cargando[k] = false; render(); });
}
const prRefrescar = (...ks) => { for (const k of ks) PR[k] = null; render(); };
function prEspera(tit, k, ruta, dest) {
  if (PR.rol !== S.rol) { PR.rol = S.rol; PR.tab = PR.turno = PR.proc = PR.inv = PR.aj = PR.z = PR.sals = PR.por = PR.dif = PR.libres = PR.mot = null; }
  if (!window.__EM_HTTP) return ph('Producción', tit, '', '') + card('', emptyState('Este módulo necesita el servidor', 'Funciona en la versión con base de datos.'));
  if (!PR[dest]) { prCargar(k, ruta, dest); return ph('Producción', tit, '', '') + card('', emptyState('Cargando…', 'Un momento.')); }
  if (PR[dest].error) return ph('Producción', tit, '', '') + card('', emptyState('No se pudo cargar', prT(PR[dest].error)));
  return null;
}
const prSem = z => z.semaforo.color === 'verde' ? '<span class="chip c-ok">Llegó a la meta</span>' : z.semaforo.color === 'ambar' ? '<span class="chip c-warn">Cerca de la meta</span>' : '<span class="chip">No llegó</span>';
const prBarra = (kg, meta) => `<div class="pr-bar" role="img" aria-label="${prN(kg)} de ${prN(meta)} kg"><span class="${kg >= meta ? 'ok' : ''}" style="width:${Math.min(100, meta > 0 ? kg / meta * 100 : 0)}%"></span></div>`;

    ${Z.salidas_armando.length ? card('Salidas armadas', salidas) : ''}
    ${(Z.salidas_despachadas || []).length ? card('Últimas salidas despachadas', `<ul class="pr-lin">${Z.salidas_despachadas.map(s => `<li><span><b>${prT(s.nro)}</b> · ${prKg(s.kilos)}</span><span class="muted">${prT([s.vehiculo, s.chofer].filter(Boolean).join(' · ') || 'Sin vehículo ni chofer')}</span></li>`).join('')}</ul>`) : ''}
    ${card('Pedidos por despachar', Z.pedidos.length ? filas + (mover && !Z.pausada ? `<div class="pr-pie"><span id="pr-ks">Sale en esta salida: <b>${prKg(kSel)}</b>${Z.meta_kg > 0 && kSel > 0 && kSel < Z.meta_kg ? ' · menos de la meta: pedirá el motivo' : ''}</span><button type="button" class="btn pri" data-act="prArmar" ${kSel > 0 ? '' : 'disabled'}>Armar salida con lo marcado</button></div>` : '') : emptyState('Sin pedidos pendientes', 'Esta zona no tiene nada por despachar.'))}`;

function prKilosSel(Z) {
  let k = 0; for (const p of Z.pedidos) { const s = PR.sel[p.id_pedido]; if (!s) continue; for (const l of p.lineas) { const n = (s.l || {})[l.id_linea] ?? l.libre; k += Math.min(n, l.libre) * l.kg_por_bulto; } }
  return Math.round(k * 1000) / 1000;
}

  modal('Armar salida', `<div class="form"><p>Salen <b>${prKg(k)}</b> de la zona ${prT(Z.zona)}.${dividen ? ' Algún pedido sale en dos partes.' : ''}</p>${bajo || dividen ? `<label class="fld">Motivo (obligatorio)<input type="text" id="pr-mot" maxlength="200" placeholder="${bajo ? 'Por qué sale antes de llegar a la meta' : 'Por qué se divide el pedido'}"></label>` : ''}
