<style>
/* Layout: cabecera de marca + menú lateral (PC) / barra inferior (móvil) + área de trabajo por pantallas.
   Marca: azul marino (estructura), naranja (acción/atención), verde (correcto/flujo cumplido). */
:root{
  --bg:#F2F5F9; --surface:#FFFFFF; --surface-2:#E9EEF4; --line:#D5DDE7; --line-2:#BFCBD9;
  --fg:#12233A; --muted:#536379;
  --band:#14365F; --band-2:#0F2B4D; --band-ink:#FFFFFF; --band-muted:#B9C9DC;
  --pri:#14365F; --pri-ink:#FFFFFF; --link:#1D5592;
  --orange:#E8892B; --orange-ink:#2A1606; --green:#2E7D5B;
  --sel-bg:#E3ECF7;
  --ok:#256B4D; --ok-bg:#E1F0E8; --warn:#8A5300; --warn-bg:#FBEBD2; --crit:#B42318; --crit-bg:#FBE4E1; --info:#1D5592; --info-bg:#E1EBF6;
  --bar:#14365F; --bar-soft:#9DB3CC; --bar-hi:#E8892B; --track:#E6EBF1;
  --paper:#FDFDFB; --paper-ink:#1B2633; --paper-line:#C9D1DB;
  --shadow:0 1px 2px rgba(18,35,58,.06),0 4px 14px rgba(18,35,58,.05);
  --f-display:'Barlow Semi Condensed','Arial Narrow',system-ui,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1420; --surface:#122033; --surface-2:#182A41; --line:#243952; --line-2:#33506F;
  --fg:#E4EBF3; --muted:#9AABC0;
  --band:#0E2441; --band-2:#0A1B33; --band-ink:#FFFFFF; --band-muted:#9FB4CD;
  --pri:#86B4E8; --pri-ink:#0B1420; --link:#93BDEE;
  --orange:#F0A157; --orange-ink:#2A1606; --green:#5DBB8E;
  --sel-bg:#1B3456;
  --ok:#6CC79A; --ok-bg:#133626; --warn:#F2B562; --warn-bg:#3A2A10; --crit:#F48B80; --crit-bg:#401B18; --info:#93BDEE; --info-bg:#15304E;
  --bar:#86B4E8; --bar-soft:#3E5A7C; --bar-hi:#F0A157; --track:#1C2F47;
  --shadow:none; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0B1420; --surface:#122033; --surface-2:#182A41; --line:#243952; --line-2:#33506F;
  --fg:#E4EBF3; --muted:#9AABC0;
  --band:#0E2441; --band-2:#0A1B33; --band-ink:#FFFFFF; --band-muted:#9FB4CD;
  --pri:#86B4E8; --pri-ink:#0B1420; --link:#93BDEE;
  --orange:#F0A157; --orange-ink:#2A1606; --green:#5DBB8E;
  --sel-bg:#1B3456;
  --ok:#6CC79A; --ok-bg:#133626; --warn:#F2B562; --warn-bg:#3A2A10; --crit:#F48B80; --crit-bg:#401B18; --info:#93BDEE; --info-bg:#15304E;
  --bar:#86B4E8; --bar-soft:#3E5A7C; --bar-hi:#F0A157; --track:#1C2F47;
  --shadow:none; color-scheme:dark;
}

/* ===== Base ===== */
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2,h3{font-family:var(--f-display);font-weight:600;line-height:1.15;margin:0;text-wrap:balance;letter-spacing:.005em}
h1{font-size:30px} h2{font-size:20px} h3{font-size:17px}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono);font-size:.92em;letter-spacing:-.01em}
.num,td,.stat-v,.money{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.ic{flex:none;display:inline-block;vertical-align:middle}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* ===== Cabecera ===== */
.top{background:var(--band);color:var(--band-ink);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand-mark{width:38px;height:38px;border-radius:9px;background:var(--orange);color:#14365F;display:grid;place-items:center;flex:none}
.brand-t{font-family:var(--f-display);font-weight:700;font-size:21px;line-height:1;letter-spacing:.01em}
.brand-s{font-size:12px;color:var(--band-muted);margin-top:3px}
.modsw{display:flex;background:var(--band-2);border-radius:10px;padding:3px;gap:3px}
.modsw button{border:0;background:transparent;color:var(--band-muted);padding:8px 14px;border-radius:8px;font-weight:600;min-height:40px;display:flex;align-items:center;gap:7px}
.modsw button[aria-pressed="true"]{background:#FFFFFF;color:#14365F}
.modsw button:disabled{opacity:.4;cursor:not-allowed}
.hctl{display:flex;align-items:center;gap:8px}
.hctl label{font-size:12px;color:var(--band-muted);line-height:1.2}
.hctl input,.hctl select{background:var(--band-2);color:var(--band-ink);border:1px solid rgba(255,255,255,.18);border-radius:8px;min-height:40px;padding:6px 10px}
.hctl input{width:96px;font-variant-numeric:tabular-nums;font-weight:600}
.hctl-tasa{background:var(--band-2);border:1px solid rgba(255,255,255,.18);border-radius:8px;min-height:40px;padding:4px 10px;color:var(--band-ink)}
.hctl-tasa .tl{font-size:12px;color:var(--band-muted);line-height:1.2}
.hctl-tasa .tv{font-variant-numeric:tabular-nums;font-weight:700;font-size:16px}
.hctl-tasa .tf{font-size:11px;color:var(--band-muted);white-space:nowrap}
.hctl-tasa .tf.warn{color:#F2B72E;font-weight:700}
.hctl select option{color:#12233A;background:#fff}
@media (max-width:640px){
  .top{gap:10px}
  .brand{flex:1 1 100%}
  .modsw{flex:1 1 100%}
  .modsw button{flex:1;justify-content:center}
  .hctl{flex:1 1 calc(50% - 6px);min-width:0}
  .hctl input,.hctl select{width:100%;min-width:0}
}

/* ===== Estructura ===== */
.shell{display:grid;grid-template-columns:minmax(0,1fr)}
.side{display:none}
.btn-menu{display:none;width:40px;height:40px;padding:0;margin-right:8px;border:0;border-radius:8px;background:transparent;color:inherit;cursor:pointer;align-items:center;justify-content:center;flex:none}
.btn-menu:hover{background:rgba(255,255,255,.18)}
@media (min-width:1024px){.btn-menu{display:inline-flex}}
main{min-width:0;padding-block:20px 112px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:1024px){
  .shell{grid-template-columns:252px minmax(0,1fr)}
  .side{display:block;position:sticky;top:0;align-self:start;height:calc(100vh - var(--toph,79px));overflow:auto;background:var(--surface);border-right:1px solid var(--line);padding:14px 10px 24px}
  main{padding-block:26px 48px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
  .bottom{display:none!important}
  body.sin-menu .shell{grid-template-columns:minmax(0,1fr)}
  body.sin-menu .side{display:none}
}
.wrap{max-width:1360px;margin:0 auto;display:flex;flex-direction:column;gap:18px}

/* Navegación */
.nav-g{margin-bottom:6px}.nav-g.ses{display:flex;flex-wrap:wrap;gap:2px;border-top:1px solid var(--line);margin-top:8px;padding-top:4px}.nav-g.ses .nav-gt{width:100%;padding-top:4px;padding-bottom:2px}.nav-g.ses a{flex:1 1 auto;min-width:0}
.nav-gt{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:6px 10px 2px;font-weight:600}
.nav a{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:8px;color:var(--fg);text-decoration:none;font-weight:500;min-height:34px}
.nav a:hover{background:var(--surface-2)}
.nav a[aria-current="page"]{background:var(--sel-bg);color:var(--fg);font-weight:600;box-shadow:inset 3px 0 0 var(--orange)}
.nav a .ic{color:var(--muted)}
.nav a[aria-current="page"] .ic{color:var(--pri)}
.nav .badge{margin-left:auto}
.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--crit);color:var(--surface);font-size:11.5px;font-weight:600}
.badge.w{background:var(--orange);color:var(--orange-ink)}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.bottom a,.bottom button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:60px;font-size:11.5px;color:var(--muted);text-decoration:none;border:0;background:none;position:relative;padding:6px 2px;text-align:center;line-height:1.15}
.bottom a[aria-current="page"]{color:var(--pri);font-weight:600}
.bottom a[aria-current="page"]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--orange)}
.bottom .badge{position:absolute;top:5px;left:calc(50% + 6px);height:17px;min-width:17px;font-size:10.5px}
.drawer{position:fixed;inset:0;z-index:40;background:rgba(6,14,26,.5);display:flex;justify-content:flex-start}
.drawer-p{background:var(--surface);width:min(320px,86vw);height:100%;overflow:auto;padding:14px 10px calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(10px,env(safe-area-inset-left,0px))}
.drawer-h{display:flex;justify-content:space-between;align-items:center;padding:4px 6px 10px}

/* ===== Encabezado de pantalla ===== */
.ph{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between}
.ph-t{min-width:0;max-width:760px}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600;margin-bottom:4px}
.lead{color:var(--muted);margin-top:6px;max-width:68ch}
.ph-a{display:flex;flex-wrap:wrap;gap:8px}

/* ===== Tarjetas y grillas ===== */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:8px 12px;padding:16px 18px 0}
.card-h .sub{color:var(--muted);font-size:13.5px;margin-top:3px}
.card-b{padding:14px 18px 18px;min-width:0}
.card.flat{box-shadow:none;background:var(--surface-2);border-color:transparent}
.cols{display:grid;gap:18px;grid-template-columns:minmax(0,1fr);align-items:start}
@media (min-width:1100px){
  .cols.c2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .cols.c32{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}
  .cols.c23{grid-template-columns:minmax(0,2fr) minmax(0,3fr)}
}
.stack{display:flex;flex-direction:column;gap:18px;min-width:0}
.tiles{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
@media (max-width:420px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.stat{padding:12px}.stat-v,.stat-v:has(.money){font-size:19px}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0;position:relative}
.stat-l{font-size:12.5px;color:var(--muted);font-weight:500}
.stat-v{font-family:var(--f-display);font-size:27px;font-weight:600;line-height:1.1;margin-top:4px;overflow-wrap:anywhere}
.stat-s{font-size:12.5px;color:var(--muted);margin-top:4px}
.stat.t-crit{border-color:color-mix(in srgb,var(--crit) 45%,var(--line));box-shadow:inset 0 3px 0 var(--crit)}
.stat.t-warn{border-color:color-mix(in srgb,var(--orange) 55%,var(--line));box-shadow:inset 0 3px 0 var(--orange)}
.stat.t-ok{box-shadow:inset 0 3px 0 var(--green)}
.stat .money .usd{font-size:inherit;white-space:nowrap}
.stat-v:has(.money){font-size:23px}

/* Dinero USD + Bs */
.money{display:inline-flex;flex-direction:column;line-height:1.2}
.money .usd{font-weight:600}
.money .bs{font-size:12px;color:var(--muted);font-weight:400;font-family:var(--f-body)}
.stat-v .money .bs{font-size:12.5px;margin-top:3px}

/* Chips */
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap;line-height:1.6}
.c-ok{background:var(--ok-bg);color:var(--ok)} .c-warn{background:var(--warn-bg);color:var(--warn)} .c-crit{background:var(--crit-bg);color:var(--crit)} .c-info{background:var(--info-bg);color:var(--info)} .c-n{background:var(--surface-2);color:var(--muted)}
.c-ask{background:var(--orange);color:var(--orange-ink)}

/* Tablas */
.desp-m{display:none}.desp-n{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:4px}.desp-n .btnrow{margin-top:6px;flex-wrap:wrap}
@media (max-width:640px){.desp-t{display:none}.desp-m{display:grid;gap:10px}}
@media (max-width:420px){.bottom a,.bottom button{font-size:10px;letter-spacing:-.2px;padding:6px 0}}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -18px;padding:0 18px}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line-2);white-space:nowrap}
td{padding:10px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:color-mix(in srgb,var(--surface-2) 55%,transparent)}
th.r,td.r{text-align:right}
td.r .money{align-items:flex-end}
td.r{white-space:nowrap}
td:first-child{min-width:120px}
.money .usd,.money .bs{white-space:nowrap}
.empty-row{text-align:center;color:var(--muted);padding:22px}
tr.hl td{background:color-mix(in srgb,var(--orange) 9%,transparent)}
.tsum td{font-weight:600;border-top:1px solid var(--line-2)}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface);color:var(--fg);font-weight:600;font-size:14.5px;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.acc{background:var(--orange);border-color:var(--orange);color:var(--orange-ink)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13.5px}
.btn.xl{min-height:58px;font-size:17px;width:100%}
.btn.ghost{background:transparent;border-color:transparent;color:var(--link)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
.lnk{color:var(--link);text-decoration:underline;text-underline-offset:2px;background:none;border:0;padding:0;font-weight:500}

/* Formularios */
.form{display:flex;flex-direction:column;gap:16px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld>span:first-child,.fld .lbl,.fld{font-weight:500;font-size:14px}
.fld small,.hint{font-size:12.5px;color:var(--muted);font-weight:400}
input[type=text],input[type=number],input[type=date],input:not([type]),select,textarea{width:100%;min-height:46px;padding:8px 12px;border:1px solid var(--line-2);border-radius:9px;background:var(--surface);color:var(--fg);font-size:16px}
textarea{min-height:70px;resize:vertical}
input.big{font-size:22px;font-weight:600;min-height:56px}
fieldset{border:0;padding:0;margin:0;min-width:0;display:flex;flex-direction:column;gap:8px}
legend{font-weight:600;font-size:14px;padding:0;margin-bottom:8px}
.row2,.row3{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
@media (min-width:560px){.row2{grid-template-columns:repeat(2,minmax(0,1fr))}.row3{grid-template-columns:repeat(3,minmax(0,1fr))}}
.opts{display:grid;gap:8px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:700px){.opts.o4{grid-template-columns:repeat(4,minmax(0,1fr))}}
.opt{min-height:60px;border:2px solid var(--line);border-radius:11px;background:var(--surface);font-weight:600;font-size:15.5px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px;text-align:center}
.opt small{font-weight:400;color:var(--muted);font-size:12.5px}
.opt[aria-pressed="true"]{border-color:var(--pri);background:var(--sel-bg)}
.opt.q-R[aria-pressed="true"]{border-color:var(--crit);background:var(--crit-bg)}
.stepper{display:grid;grid-template-columns:52px minmax(0,1fr) 52px;gap:6px}
.stepper button{min-height:46px;border:1px solid var(--line-2);border-radius:9px;background:var(--surface-2);font-size:22px;font-weight:600}
.stepper input{text-align:center;font-weight:600;font-size:18px}
.samples{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(92px,1fr))}
.samples input{text-align:center;font-weight:600}
.samples .fld>span{font-size:12.5px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:9px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--surface);padding:7px 13px;min-height:38px;font-weight:600;font-size:13.5px;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line-2)}
.seg button[aria-pressed="true"]{background:var(--sel-bg);color:var(--fg)}
.toggle{display:flex;align-items:center;gap:10px;font-weight:500}
.toggle input{width:22px;height:22px;min-height:0;accent-color:var(--pri)}
.err{background:var(--crit-bg);color:var(--crit);border-radius:9px;padding:10px 12px;font-size:14px;font-weight:500;display:flex;gap:8px;align-items:flex-start}
.okmsg{background:var(--ok-bg);color:var(--ok);border-radius:9px;padding:10px 12px;font-size:14px;font-weight:500;display:flex;gap:8px;align-items:flex-start}

/* Datos clave/valor */
.kv{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
@media (max-width:520px){.kv{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.kv dd{font-size:16px}}
.kv>div{background:var(--surface-2);border-radius:9px;padding:10px 12px;min-width:0}
.kv dt{font-size:12px;color:var(--muted);font-weight:500}
.kv dd{margin:2px 0 0;font-weight:600;font-size:17px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kv dd small{font-size:12px;font-weight:400;color:var(--muted);display:block}
.kv>div.hl{background:var(--sel-bg)}

/* Flujo de estados */
.flow{display:flex;flex-wrap:wrap;gap:4px 0;list-style:none;padding:0;margin:0}
.flow li{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.flow li:not(:last-child)::after{content:"";display:block;width:16px;height:2px;background:var(--line-2);margin:0 6px}
.flow li.done:not(:last-child)::after{background:var(--green)}
.flow .dot{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;font-size:11px;font-weight:600;background:var(--surface)}
.flow li.done{color:var(--fg)}
.flow li.done .dot{background:var(--green);border-color:var(--green);color:var(--surface)}
.flow li.cur{color:var(--fg);font-weight:600}
.flow li.cur .dot{background:var(--orange);border-color:var(--orange);color:var(--orange-ink)}
.flow.big li{font-size:14px}
.flow.big .dot{width:28px;height:28px;font-size:13px}
.flow.big li:not(:last-child)::after{width:28px}

/* Listas */
.list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column}
.list>li{padding:12px 0;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:space-between}
.list>li:last-child{border-bottom:0}
.list .l-main{min-width:0;flex:1 1 220px}
.list .l-t{font-weight:600}
.list .l-s{font-size:13px;color:var(--muted)}
.alerts{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.alerts li{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:9px;background:var(--surface-2);font-size:14px}
.alerts li.crit{background:var(--crit-bg)} .alerts li.warn{background:var(--warn-bg)} .alerts li.ok{background:var(--ok-bg)}
.alerts li .ic{margin-top:2px}
.alerts li.crit .ic{color:var(--crit)} .alerts li.warn .ic{color:var(--warn)} .alerts li.ok .ic{color:var(--ok)}
.alerts li>div{flex:1;min-width:0}
.alerts b{font-weight:600}

/* Barras horizontales */
.hb{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.hb li{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13.5px}
.hb-l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb-t{height:14px;background:var(--track);border-radius:4px;overflow:hidden}
.hb-f{display:block;height:100%;background:var(--bar);border-radius:0 4px 4px 0}
.hb li.hi .hb-f{background:var(--bar-hi)}
.hb li.lo .hb-f{background:var(--bar-soft)}
.hb-v{font-variant-numeric:tabular-nums;font-weight:600;text-align:right;min-width:64px}
@media (max-width:520px){.hb li{grid-template-columns:minmax(0,1fr) auto}.hb-l{grid-column:1/-1;white-space:normal}.hb-t{grid-column:1}}

/* Columnas */
.cc{position:relative;padding-top:18px}
.cc-area{position:relative;height:160px;display:flex;align-items:flex-end;gap:5px;border-bottom:1px solid var(--line-2)}
.cc-grid{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none}
.cc-grid span{border-top:1px dashed var(--line);height:0}
.cc-col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;position:relative;min-width:0}
.cc-bar{width:100%;max-width:30px;background:var(--bar);border-radius:4px 4px 0 0;min-height:2px}
.cc-col.hi .cc-bar{background:var(--bar-hi)}
.cc-col.z .cc-bar{background:var(--bar-soft)}
.cc-val{position:absolute;left:50%;font-size:11.5px;font-weight:600;white-space:nowrap;transform:translate(-50%,-100%);padding-bottom:3px}
.cc-col:last-child .cc-val{left:auto;right:0;transform:translateY(-100%)}
.cc-col:first-child .cc-val{left:0;transform:translateY(-100%)}
.cc-x{display:flex;gap:5px;margin-top:6px}
.cc-x span{flex:1;text-align:center;font-size:11px;color:var(--muted);min-width:0;overflow:hidden}
.cc-scale{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--muted);margin-top:8px}

/* Medidor stock vs mínimo */
.meters{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:12px}
.meters li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;font-size:14px}
.meter{grid-column:1/-1;height:10px;border-radius:5px;background:var(--track);position:relative}
.meter-f{height:100%;border-radius:5px;background:var(--bar)}
.meter-f.low{background:var(--crit)}
.meter-min{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--fg);opacity:.55}

/* Barra apilada (antigüedad) */
.stackbar{display:flex;height:30px;border-radius:6px;overflow:hidden;gap:2px;background:var(--surface)}
.stackbar span{display:block;height:100%;min-width:3px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:13px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.s-v1{background:var(--crit)} .s-v2{background:color-mix(in srgb,var(--crit) 60%,var(--surface))} .s-h{background:var(--orange)} .s-w{background:color-mix(in srgb,var(--orange) 55%,var(--surface))} .s-30{background:var(--bar)} .s-l{background:var(--bar-soft)}

/* Calendario */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dh{font-size:11.5px;color:var(--muted);text-align:center;font-weight:600;padding:4px 0;text-transform:uppercase;letter-spacing:.05em}
.cal button{min-height:64px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:5px 6px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0;font-size:12px}
.cal button .d{font-weight:600;font-size:13px}
.cal button .a{font-weight:600;font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.cal button.o{visibility:hidden}
.cal button.today{border:2px solid var(--pri)}
.cal button.v{background:var(--crit-bg);border-color:transparent}
.cal button.v .a{color:var(--crit)}
.cal button.p{background:var(--warn-bg);border-color:transparent}
.cal button.p .a{color:var(--warn)}
.cal button.f{background:var(--info-bg);border-color:transparent}
.cal button.f .a{color:var(--info)}
.cal button[aria-pressed="true"]{outline:2px solid var(--orange);outline-offset:1px}
.cal button .a.n{font-weight:400}
@media (max-width:520px){.cal button{min-height:52px;padding:4px 3px}.cal button .a{font-size:10.5px;text-overflow:clip}.cal button .a.n{display:none}}

/* Árbol de partidas */
.tree details{border-left:2px solid var(--line);margin-left:6px;padding-left:12px}
.tree>details{border-left:0;margin-left:0;padding-left:0}
.tree summary{cursor:pointer;padding:6px 0;font-weight:600;list-style:none;display:flex;gap:8px;align-items:center}
.tree summary::-webkit-details-marker{display:none}
.tree summary::before{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s;flex:none;margin-right:2px}
.tree details[open]>summary::before{transform:rotate(45deg)}
.leaf{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;padding:7px 0 7px 4px;border-bottom:1px dashed var(--line);font-size:14px}
.leaf .lt{flex:1 1 200px;min-width:0}
.leaf.sel{background:var(--sel-bg);border-radius:6px;padding-left:8px}

/* Kanban en proceso */
.kanban{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.kcol{background:var(--surface-2);border-radius:12px;padding:12px;min-width:0}
.kcol h3{font-size:15px;display:flex;justify-content:space-between;margin-bottom:10px}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin-bottom:8px;font-size:13.5px}
.kcard b{font-family:var(--f-mono);font-weight:500}

/* Bultos */
.bultos{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.bulto{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface);position:relative;overflow:hidden}
.bulto::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:repeating-linear-gradient(180deg,var(--fg) 0 2px,transparent 2px 4px,var(--fg) 4px 5px,transparent 5px 8px);opacity:.75}
.bulto .bid{font-family:var(--f-mono);font-weight:500;padding-left:6px}
.bulto .bw{font-family:var(--f-display);font-size:24px;font-weight:600;padding-left:6px}
.bulto .bs{font-size:12.5px;color:var(--muted);padding-left:6px}
.tbd{border:2px dashed var(--orange);border-radius:12px;padding:18px;background:color-mix(in srgb,var(--orange) 6%,var(--surface))}

/* Flota */
.fleet{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.veh{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface);display:flex;gap:12px;align-items:flex-start}
.veh .ic{color:var(--pri)}

/* Acciones rápidas */
.quick{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.quick a{display:flex;align-items:center;gap:12px;min-height:64px;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);color:var(--fg);text-decoration:none;font-weight:600}
.quick a:hover{border-color:var(--pri)}
.quick a .qi{width:38px;height:38px;border-radius:9px;display:grid;place-items:center;background:var(--sel-bg);color:var(--pri);flex:none}
.quick a.main .qi{background:var(--orange);color:var(--orange-ink)}

/* Vacío */
.empty{text-align:center;padding:26px 16px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:6px}
.empty .ic{color:var(--line-2)}
.empty-t{font-weight:600;color:var(--fg)}

/* Procedimientos */
.proc{border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.proc+.proc{margin-top:10px}
.proc>summary{padding:14px 16px;cursor:pointer;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;list-style:none}
.proc>summary::-webkit-details-marker{display:none}
.proc>summary h3{flex:1 1 240px}
.proc .pb{padding:0 16px 16px;display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.proc .pb{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}}
.proc ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.proc ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.proc h4{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 6px}

/* Documento imprimible (nota, recibo) */
.doc{background:var(--paper);color:var(--paper-ink);border:1px solid var(--paper-line);border-radius:6px;padding:22px;font-size:14px}
.doc h3{font-size:20px;color:var(--paper-ink)}
.doc table th{color:#5B6878;border-color:var(--paper-line)}
.doc table td{border-color:#E3E7EC}
.doc tbody tr:hover td{background:transparent}
.doc .dh{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;border-bottom:2px solid var(--paper-ink);padding-bottom:10px;margin-bottom:12px}
.doc .firmas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;margin-top:34px}
.doc .firmas div{border-top:1px solid var(--paper-ink);padding-top:6px;font-size:12.5px;text-align:center}
.doc .meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px 18px;font-size:13.5px;margin-bottom:12px}
.doc .meta b{display:block;font-size:11.5px;color:#5B6878;text-transform:uppercase;letter-spacing:.05em;font-weight:600}

/* Modal, aviso, tooltip */
.modal{position:fixed;inset:0;z-index:50;background:rgba(6,14,26,.55);display:grid;place-items:center;padding:16px}
.mbox{background:var(--surface);border-radius:14px;width:100%;max-width:760px;max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.mbox-h{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.mbox-b{padding:18px}
.iconbtn{width:44px;height:44px;border-radius:9px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(440px,calc(100vw - 32px));pointer-events:none}
@media (min-width:1024px){#toast{bottom:24px;left:auto;right:24px;transform:none;align-items:flex-end}}
.toast{background:var(--fg);color:var(--bg);padding:11px 16px;border-radius:10px;font-size:14px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.25);display:flex;gap:10px;align-items:flex-start;animation:tin .2s ease-out}
.toast .ic{color:var(--green)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#tip{position:fixed;z-index:70;pointer-events:none;background:var(--fg);color:var(--bg);font-size:12.5px;font-weight:500;padding:6px 9px;border-radius:7px;max-width:260px;box-shadow:0 6px 18px rgba(0,0,0,.2)}
.ask{display:inline-flex;align-items:center;gap:5px;background:var(--orange);color:var(--orange-ink);font-weight:700;font-size:12px;letter-spacing:.04em;padding:3px 9px;border-radius:6px}
.note{border-left:3px solid var(--orange);background:var(--surface-2);padding:12px 14px;border-radius:0 9px 9px 0;font-size:14px}
.note b{font-weight:600}
.consult{background:var(--sel-bg);border-radius:12px;padding:16px 18px}
.consult h3{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.consult ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.score{display:inline-grid;place-items:center;width:44px;height:30px;border-radius:7px;font-weight:700;font-variant-numeric:tabular-nums}
.sc-hi{background:var(--ok-bg);color:var(--ok)} .sc-md{background:var(--warn-bg);color:var(--warn)} .sc-lo{background:var(--crit-bg);color:var(--crit)}
.denied{max-width:520px;margin:40px auto}

/* ===== Portada: mapa de procesos ===== */
.brand{color:inherit;text-decoration:none}
.pm-io{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
@media (min-width:760px){.pm-io{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:stretch}}
.io{display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:12px;background:var(--surface);border:1px solid var(--line);min-width:0}
.io .ic{color:var(--muted)}
.io.in{box-shadow:inset 5px 0 0 var(--green)} .io.out{box-shadow:inset 5px 0 0 var(--orange)}
.io p{font-size:13.5px;color:var(--muted)} .io b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--fg)}
.io-arrow{display:grid;place-items:center;color:var(--orange);transform:rotate(90deg)}
@media (min-width:760px){.io-arrow{transform:none}}
.pm-block{border-radius:14px;border:1.5px solid var(--line);background:var(--surface);overflow:hidden}
.pm-bh{background:#14365F;color:#FFFFFF;padding:11px 16px;font-family:var(--f-display);font-weight:700;font-size:16px;letter-spacing:.06em;text-transform:uppercase;display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:space-between;align-items:center}
.pm-bh small{font-family:var(--f-body);font-weight:500;font-size:12.5px;letter-spacing:0;text-transform:none;opacity:.85}
.pm-block.adm .pm-bh{background:#2E7D5B}
.pm-block.new{border:2px dashed var(--orange)} .pm-block.new .pm-bh{background:#E8892B;color:#2A1606}
.pm-bb{padding:16px}
.pm-flow{display:flex;flex-direction:column;gap:4px;align-items:stretch}
.pm-arrow{align-self:center;color:var(--orange);display:grid;transform:rotate(90deg);padding:2px 0}
@media (min-width:1200px){.pm-flow{flex-direction:row;gap:6px}.pm-flow>.pm-card{flex:1 1 0}.pm-arrow{transform:none;padding:0}}
.pm-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.pm-card{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);text-decoration:none;min-width:0;position:relative}
a.pm-card{border-color:color-mix(in srgb,var(--pri) 40%,var(--line))}
a.pm-card:hover{border-color:var(--pri);box-shadow:0 4px 16px rgba(18,35,58,.12)}
.pm-card.off{opacity:.6;background:var(--surface-2);border-style:dashed;cursor:not-allowed}
.pm-h{display:flex;gap:10px;align-items:center;padding-right:24px}
.pm-h h3{font-size:16.5px}
.pm-n{width:30px;height:30px;border-radius:50%;background:#E8892B;color:#2A1606;display:grid;place-items:center;font-weight:700;flex:none}
.pm-i{width:32px;height:32px;border-radius:9px;background:var(--ok-bg);color:var(--ok);display:grid;place-items:center;flex:none}
.pm-block.new .pm-i{background:var(--warn-bg);color:var(--warn)}
.pm-card.off .pm-n,.pm-card.off .pm-i{background:var(--line);color:var(--muted)}
.pm-area{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--info)}
.pm-card ul{margin:0;padding-left:18px;font-size:13.5px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.pm-chips{display:flex;flex-wrap:wrap;gap:6px}
.pm-chips .chip{white-space:normal}
.pm-foot{margin-top:auto;padding-top:4px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:space-between}
.pm-lock{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:flex-start;margin-top:auto}
.pm-card>.badge{position:absolute;top:12px;right:12px}
.pm-go{font-size:13px;font-weight:600;color:var(--link);display:inline-flex;gap:4px;align-items:center}
.pm-ctrl{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center;padding:18px 20px;border-radius:14px;background:#14365F;color:#FFFFFF;text-decoration:none;border-top:5px solid #E8892B}
.pm-ctrl h2{color:#FFFFFF} .pm-ctrl p{color:#C9D6E6;font-size:14px}
.pm-ctrl>div{flex:1 1 240px}
.pm-ctrl.off{opacity:.6;cursor:not-allowed;border-top-color:#8A97A8}
.rolebox{display:flex;flex-direction:column;gap:12px}
.rolebar{display:flex;flex-wrap:wrap;gap:8px}
.rolebar button{min-height:44px;padding:6px 14px;border-radius:999px;border:1.5px solid var(--line-2);background:var(--surface);font-weight:600;font-size:14px}
.rolebar button[aria-pressed="true"]{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.lvl-legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
/* Matriz de permisos */
.msel{min-height:34px!important;font-size:13px!important;padding:3px 6px!important;width:auto!important;border-radius:7px!important;font-weight:600}
.msel.l0{color:var(--muted)} .msel.l1{background:var(--info-bg);color:var(--info);border-color:transparent} .msel.l2{background:var(--ok-bg);color:var(--ok);border-color:transparent} .msel.l3{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.perm-note{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:10px;background:var(--info-bg);color:var(--info);font-size:14px;font-weight:500}
button.locked{opacity:.5;cursor:not-allowed}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* ---- Entrada por módulo, rol y estados ---- */
body.entry .side, body.entry .bottom { display:none !important; }
body.entry .shell { grid-template-columns: 1fr; }
.who { display:flex; align-items:center; gap:8px; flex-wrap:wrap; color:var(--band-ink); }
.who-t { font-size:13.5px; line-height:1.25; }
.who .btn.ghost { color:var(--band-ink); border-color:rgba(255,255,255,.35); background:transparent; }
.doors { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:18px; margin-bottom:18px; }
.door { display:flex; flex-direction:column; gap:8px; padding:26px 24px; border-radius:16px; background:var(--surface); border:2px solid var(--line-2); color:var(--fg); text-decoration:none; min-width:0; }
.door:hover, .door:focus-visible { border-color:var(--band); box-shadow:0 6px 22px rgba(20,54,95,.15); }
.door-i { color:var(--band); }

.tiles:has(> :nth-child(7):last-child){grid-template-columns:repeat(12,minmax(0,1fr))}
.tiles:has(> :nth-child(7):last-child) > *{grid-column:span 3}

/* ---------- Constantes de personal y quincenas (las usa la capa de datos y las pantallas) ---------- */
const AREAS = ['Producción', 'Empaque', 'Línea salsera', 'Almacén', 'Logística', 'Administración y ventas'];
const AREA_MAP = {'Freído y procesamiento': 'Producción', 'Almacén y recepción': 'Almacén', 'Logística (choferes y ayudantes)': 'Logística'};
const NOM_POL = {nomRecargo: 0, nomLey: 0, nomJornada: 8};
const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const qKey = d => d.slice(0, 7) + (+d.slice(8, 10) <= 15 ? '-1' : '-2');
const qRange = k => { const [y, m, h] = k.split('-'), last = new Date(+y, +m, 0).getDate(); return h === '1' ? [`${y}-${m}-01`, `${y}-${m}-15`] : [`${y}-${m}-16`, `${y}-${m}-${last}`]; };
const qLabel = k => { const [y, m, h] = k.split('-'); return `${h === '1' ? '1ª' : '2ª'} quincena de ${MESES[+m - 1]} ${y}`; };
const qMove = (k, d) => { const [y, m, h] = k.split('-').map(Number); let i = (y * 12 + (m - 1)) * 2 + (h - 1) + d; const hh = ((i % 2) + 2) % 2 + 1; i = Math.floor(i / 2); return `${Math.floor(i / 12)}-${String(i % 12 + 1).padStart(2, '0')}-${hh}`; };

   k = clave de la etapa · ru = roles que registran en ella (además de quien tenga nivel «aprobar») · u = unidades permitidas
   og = qué se elige como origen · decl = la entrada de la etapa no se puede medir sola: se declara en cada registro

    } catch (e) { if (!loaded) errs.forEach(fn => fn(e)); }

    async update(c, id, d) { track(await api('PATCH', '/c/' + encodeURIComponent(c) + '/' + encodeURIComponent(id), d)); applyLocal({op: 'update', c, id, d}); emit(c); },
    async del(c, id) { track(await api('DELETE', '/c/' + encodeURIComponent(c) + '/' + encodeURIComponent(id))); applyLocal({op: 'del', c, id}); emit(c); },
    async get(c, id) { try { return await api('GET', '/c/' + encodeURIComponent(c) + '/' + encodeURIComponent(id)); } catch (e) { if (e.code === 'invalid_argument') return null; throw e; } },
    async list(c) { return api('GET', '/c/' + encodeURIComponent(c)); },

    async acquire(name, ttl) { return api('POST', '/lock', {name, holder: HOLDER, ttl}); },

function makeDbBackend(db) {

    kind: 'db',

    set: (c, id, d) => ref(c, id).set({...d, id}),

    async get(c, id) { const s = await ref(c, id).get(); return s.exists ? {...s.data(), id} : null; },
    async where(c, f, v) { const s = await db.collection(c).where(f, '==', v).get(); return s.docs.map(row); },
    async list(c) { const s = await db.collection(c).get(); return s.docs.map(row); },

/* ---------- Mermas de ejemplo (HIST_V = 3): coherentes con los lotes, compras y empaques sembrados ----------
   Generador propio con semilla fija: no altera el resto de la historia. Los ids son estables (MR-H0001...), así que
   se pueden añadir a una base ya sembrada sin duplicar. Proveedor P2 (papa de menor calidad) pierde más. */
function buildMermasHist(hist) {
  const Z = SEED_SRC, res = [], put = (id, d) => res.push(['mermas', id, d]);
  const delta = Math.round((D(todayISO()) - D(SEED_HOY)) / 864e5), sd = s => s ? addDays(s, delta) : s, hoy = todayISO();
  let a = 20261112;
  const rnd = () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const rr = (lo, hi) => lo + (hi - lo) * rnd();
  const cm = {}, recK = {};
  Z.compras.forEach(c => { if (c.id && c.kgRec) cm[c.id] = {pu: c.pu, qf: c.qf, kgRec: c.kgRec, rec: c.rec}; });
  hist.forEach(([c, id, d]) => { if (c === 'recepciones') recK[id] = d.kgRec; });
  hist.forEach(([c, id, d]) => { if (c === 'compras' && d.fam === 'MP' && d.recId && recK[d.recId]) cm[id] = {pu: d.pu, qf: d.qf, kgRec: recK[d.recId], rec: d.recId}; });

}

async function migraTerminos() {

async function migraInventario() {
  const prods = await B.list('productos');
  for (const p of prods) if ((p.tipo === 'mp' || p.tipo === 'pres' || p.tipo === 'sstock') && p.min > 0 && p.max == null) await W.update('productos', p.id, {max: Math.round(p.min * 4)});

}

function recCalc() {
  const f = S.recForm, nom = (+f.sacos || 0) * (+f.kgSaco || 0);
  const r = {nom};
  if (f.tipo === 'papa') { r.rec = +f.kgRec || 0; }
  else {
    const m = f.muestras.map(Number).filter(x => x > 0);
    r.n = m.length; r.prom = m.length ? sum(m) / m.length : 0;
    r.desv = m.length > 1 ? Math.sqrt(sum(m, x => (x - r.prom) ** 2) / (m.length - 1)) : 0;
    r.cv = r.prom ? r.desv / r.prom * 100 : 0;
    r.rec = r.prom * (+f.sacos || 0);
    r.dSaco = r.prom - (+f.kgSaco || 0);
  }
  r.diff = r.rec - (+f.kgFact || 0);
  r.diffPct = +f.kgFact ? r.diff / f.kgFact * 100 : 0;
  return r;
}
function cxpList() {
  return S.compras.filter(c => c.cond === 'Crédito' && c.saldo > 0.005 && ['compra', 'almacen', 'registrada'].includes(c.estado) && c.vence)
    .map(c => ({...c, due: c.abono ? Math.min(c.abono, c.saldo) : c.saldo, d: dias(c.vence)})).sort((a, b) => a.d - b.d);
}
function cxpBuckets() {
  const L = cxpList(); const b = {venc:0, hoy:0, sem:0, d30:0, mas:0, total:0, nVenc:0};
  L.forEach(c => { b.total += c.saldo; if (c.d < 0) {b.venc += c.due; b.nVenc++;} else if (c.d === 0) b.hoy += c.due; else if (c.d <= 6) b.sem += c.due; else if (c.d <= 30) b.d30 += c.due; else b.mas += c.due;
    if (c.abono && c.saldo > c.due) b.d30 += c.saldo - c.due; });
  return b;
}
function cajaResumen() {
  const gastos = sum(S.gastos.filter(g => !g.repuesto), g => g.monto);
  const prest = sum(S.prestamos, p => p.monto / p.cuotas * (p.cuotas - p.pagadas));
  const esperado = S.pol.fondo - gastos - prest;
  const sinJust = S.gastos.filter(g => !g.repuesto && !g.just.trim());
  const incomp = S.gastos.filter(g => !g.repuesto && (!g.num || !g.rif));
  return {gastos, prest, esperado, sinJust, incomp, disponible: esperado, pctDisp: esperado / S.pol.fondo * 100};
}
function provStats(fam = 'Todas') {
  const efect = S.compras.filter(c => ['compra', 'almacen', 'registrada'].includes(c.estado) && (fam === 'Todas' || c.fam === fam));
  const famTotal = sum(efect, total);
  const ids = [...new Set(efect.map(c => c.prov))];
  const lotes = S.lotes.filter(l => l.granel);
  const costoUtilAll = [];
  const rows = ids.map(id => {
    const p = prov(id), cs = efect.filter(c => c.prov === id), t = sum(cs, total);
    const kgC = cs.filter(c => c.kgRec != null);
    const merma = kgC.length ? (sum(kgC, c => c.qf) - sum(kgC, c => c.kgRec)) / sum(kgC, c => c.qf) * 100 : null;
    const punt = sum(cs, c => (c.entReal <= c.entProm ? 1 : 0)) / cs.length * 100;
    const last = cs[cs.length - 1];
    const varP = p.hist ? (last.pu - p.hist) / p.hist * 100 : null;
    const cats = [...new Set(cs.map(c => c.cat))];
    const catTot = sum(efect.filter(c => cats.includes(c.cat)), total);
    const dep = catTot ? t / catTot * 100 : 0;
    const ls = lotes.filter(l => l.prov === id);
    const rend = ls.length ? sum(ls, l => l.granel) / sum(ls, l => l.cruda) * 100 : null;
    let costoUtil = null;
    if (ls.length) { const pag = sum(ls, l => lotCosto(l) || 0); costoUtil = pag / sum(ls, l => l.granel); costoUtilAll.push(costoUtil); }
    return {id, p, n: cs.length, t, share: famTotal ? t / famTotal * 100 : 0, merma, punt, varP, rech: p.rechazo ?? null, plazo: p.dias, plazoT: p.plazo, dep, cats, rend, costoUtil, pend: sum(cs.filter(c => c.cond === 'Crédito'), c => c.saldo)};
  });
  const minCU = Math.min(...costoUtilAll);
  rows.forEach(r => {
    const parts = [[r.punt, 20]];
    if (r.merma != null) parts.push([Math.max(0, 100 - r.merma * 20), 20]);
    if (r.rech != null) parts.push([Math.max(0, 100 - r.rech * 12), 20]);
    if (r.varP != null) parts.push([Math.max(0, Math.min(100, 100 - r.varP * 8)), 15]);
    parts.push([Math.min(100, (r.plazo || 0) / 25 * 100), 10]);
    if (r.costoUtil != null) parts.push([minCU / r.costoUtil * 100, 15]);
    r.score = Math.round(sum(parts, x => x[0] * x[1]) / sum(parts, x => x[1]));
    r.rec = r.score >= 80 ? 'Mantener' : r.score >= 65 ? 'Negociar' : 'Sustituir o buscar alterno';
    r.recTone = r.score >= 80 ? 'ok' : r.score >= 65 ? 'warn' : 'crit';
  });
  return {rows: rows.sort((a, b) => b.t - a.t), famTotal, efect};
}
function lotCosto(l) { const c = S.compras.find(x => x.id === l.compra); return c && c.kgRec ? total(c) * (l.cruda / c.kgRec) : null; }

function recCalcHTML() {
  const f = S.recForm, r = recCalc(), tol = S.pol.tolRec;
  const a = Math.abs(r.diffPct), tone = a <= tol ? 'ok' : a <= tol * 2 ? 'warn' : 'crit';
  const msg = !f.kgFact ? '' : a <= tol ? chip('Dentro de la tolerancia (' + tol + ' %)', 'ok') : chip('Diferencia mayor a ' + tol + ' %: se informa a Administración', tone);
  return `<dl class="kv">
    <div><dt>Kg según sacos</dt><dd>${kg(r.nom)}<small>${N0.format(f.sacos || 0)} × ${N2.format(f.kgSaco || 0)} kg</small></dd></div>
    ${f.tipo === 'insumo' ? `
      <div><dt>Promedio por saco</dt><dd>${kg(r.prom, 2)}<small>${r.n} sacos pesados</small></dd></div>
      <div><dt>Desviación estándar</dt><dd>± ${N2.format(r.desv)} kg<small>Variación ${pct(r.cv)}</small></dd></div>
      <div><dt>Diferencia por saco</dt><dd>${(r.dSaco >= 0 ? '+' : '') + N2.format(r.dSaco)} kg<small>vs ${N2.format(f.kgSaco || 0)} kg nominal</small></dd></div>
      <div class="hl"><dt>Kg estimados (promedio × sacos)</dt><dd>${kg(r.rec, 1)}</dd></div>`
    : `<div class="hl"><dt>Kg recibidos (balanza)</dt><dd>${kg(r.rec)}</dd></div>`}
    <div><dt>Kg facturados</dt><dd>${kg(+f.kgFact || 0)}</dd></div>
    <div class="hl"><dt>Diferencia vs facturado</dt><dd>${(r.diff >= 0 ? '+' : '') + N1.format(r.diff)} kg<small>${(r.diffPct >= 0 ? '+' : '') + pct(r.diffPct)}</small></dd></div>
  </dl><p style="margin-top:10px">${msg}</p>`;
}

function prCheck() {
  const f = S.prForm, P = S.pol, e = emp(f.emp), errs = [];

  if (!diasOk.includes(dia)) errs.push(`La fecha de entrega debe caer en los días ${P.diasPrestamo}.`);

  if (+f.monto > P.tope) errs.push(`El monto supera el tope de ${usd(P.tope)}.`);
  if (+f.cuotas < 1 || +f.cuotas > P.cuotasMax) errs.push(`Las cuotas deben estar entre 1 y ${P.cuotasMax}.`);

  if (P.unActivo && S.prestamos.some(p => p.emp === f.emp && p.pagadas < p.cuotas)) errs.push(`${e.n} ya tiene un préstamo activo.`);

  return errs;
}

const qActual = () => qKey(HOY_ISO);

function nomEmp(e, a, q) {
  const P = S.pol, jor = +P.nomJornada || 8, t = +e.tarifa || 0, hr = e.pago === 'hora' ? t : t / jor, A = a || {};
  const base = e.pago === 'hora' ? (+A.horas || 0) * t : (+A.dias || 0) * t;
  const extra = (+A.extra || 0) * hr * (1 + (+P.nomRecargo || 0) / 100), bonos = +A.bonos || 0, ley = (base + extra) * (+P.nomLey || 0) / 100;
  const desc = q === qActual() ? sum(S.prestamos.filter(p => p.emp === e.id && p.pagadas < p.cuotas), p => p.monto / p.cuotas * p.tasa) : (+A.desc || 0);
  return {base, extra, bonos, ley, desc, neto: base + extra + bonos - ley - desc};
}
function nomRows(q) {
  return (DATA.empleadosAll || []).filter(e => asisOf(q, e.id) || (q === qActual() && !e.arch)).map(e => ({e, a: asisOf(q, e.id), ...nomEmp(e, asisOf(q, e.id), q)}));
}
function nomPorArea(q) {

  return Object.values(m).sort((a, b) => AREAS.indexOf(a.area) - AREAS.indexOf(b.area));
}

function applyPerms() {
  let n = 0;
  document.querySelectorAll('#main [data-act], #main [data-act-change]').forEach(el => {
    const a = el.dataset.act || el.dataset.actChange, req = ACT_REQ[a];
    const sinNivel = req && lvl(req[0]) < req[1], soloLectura = !Layer.canWrite && WRITE_ACTS.has(a);
    if (!sinNivel && !soloLectura) return;
    el.disabled = true; el.classList.add('locked');
    el.title = sinNivel ? `Requiere permiso de ${LV[req[1]].toLowerCase()}` : 'Solo lectura: no puedes guardar cambios';
    if (/^(BUTTON|A)$/.test(el.tagName)) el.insertAdjacentHTML('afterbegin', ic('lock', 16));
    if (sinNivel) n++;
  });
  if (n && S.route !== 'mapa') {
    const L = lvl(S.route), h = document.querySelector('#main .ph');
    h && h.insertAdjacentHTML('afterend', `<p class="perm-note">${ic('lock')}<span>Como <b>${ROLES[S.rol]}</b> tu permiso aquí es <b>${LV[L].toLowerCase()}</b>. Los botones con candado los usa otro rol.</span></p>`);
  }
}

  if (!(p.cant > 0)) return `<p class="hint">Escribe cuánto se perdió y aquí verás cuánto cuesta y qué parte de la etapa representa.</p>`;
  return `<dl class="kv"><div><dt>Equivale a</dt><dd>${kg(p.kgv, 1)}</dd></div><div class="hl"><dt>Costo de la merma</dt><dd>${money(p.usd)}</dd></div><div><dt>De lo que entró a la etapa</dt><dd>${p.pct == null ? '—' : pct(p.pct)}</dd></div></dl>
    <p style="margin-top:8px">${p.pct == null ? chip('Sin base para comparar con la tolerancia', 'n') : chip(p.sem.l + ' (tolerancia ' + pct(mrTol(p.e.k)) + ')', p.sem.t)}${p.cost ? '' : ' ' + chip('Costo por definir', 'warn')}</p>`;
}

  const f = S.mrForm, {e, og} = fx, ets = mrEtapasMias(), cs = mrCausas();
  const apr = lvl('mermas') >= 3;
  return card('Registrar merma', `<div class="form cp-c2" id="mr-form"><div>
    <label class="fld">Etapa donde se perdió<select id="mr-et" class="big" data-k="mrForm.etapa" data-act-change="mrEtapa">${ets.map(x => `<option value="${x.k}" ${x.k === f.etapa ? 'selected' : ''}>${x.t}</option>`).join('')}</select><small>${e.hint}</small></label>

/* ---------- Tolerancias (se ven en Políticas y en la pantalla de mermas; las edita quien aprueba mermas) ---------- */
function mrTolCard(enPol) {
  const ed = lvl('mermas') >= 3, P = S.pol;
  const inp = (k, l, h) => `<label class="fld">${l}<input id="mr-tol-${k}" type="number" inputmode="decimal" step="0.1" min="0" data-k="pol.${k}" value="${P[k] ?? ''}" ${ed ? '' : 'disabled'}><small>${h}</small></label>`;
  const body = `<div class="form"><div class="mr-tolg">${MR_ET.filter(e => !(enPol && e.k === 'recepcion')).map(e => e.k === 'recepcion' ? inp('tolRec', e.t, 'Es la tolerancia de peso de Recepción') : inp('mr_' + e.k, e.t, 'Máx. % de lo que entra a la etapa')).join('')}</div>
    <div class="row2">${inp('mrAlerta', 'Margen de alerta (%)', 'Hasta cuánto por encima de la tolerancia es «alerta»; más allá es «fuera»')}${inp('mrCostoSalsa', 'Costo de la salsa (US$/kg)', 'Supuesto para valorar mermas de la línea salsera')}</div>
    ${enPol ? '' : ''}
    ${ed ? `<button type="button" class="btn pri" data-act="guardarTolMerma">${ic('check')}Guardar tolerancias de merma</button>` : `<p class="hint">${ic('lock', 16)} Solo el Dueño y el Jefe de producción cambian las tolerancias.</p>`}</div>`;
  return card('Tolerancias de merma por proceso', body, {});
}
function mrCausasCard() {
  const ed = lvl('mermas') >= 3;
  return card('Causas de merma', `<ul class="chips" style="display:flex;flex-wrap:wrap;gap:8px;list-style:none;padding:0;margin:0 0 10px">${mrCausas().map(c => `<li class="chip c-n">${esc(c)}${ed ? ` <button type="button" class="btn sm ghost" data-act="delCausa" data-v="${esc(c)}" aria-label="Quitar la causa ${esc(c)}">${ic('x', 14)}</button>` : ''}</li>`).join('')}</ul>

}

/* ---------- Pantalla ---------- */

  const recientes = (S.mermas || []).slice(0, 12);
  return `${ph('Producción · control', 'Mermas por proceso', 'Lo que se pierde en cada etapa, desde que llega la papa hasta que se entrega al cliente: cuánto, por qué, cuánto cuesta y si pasa la tolerancia.')}

  </div>

  <div class="cols c2">
    ${mrFormCard()}
    ${lvl('mermas') >= 3 && pend.length ? card('Pendientes de aprobación', `<ul class="list">${pend.map(m => `<li><div class="l-main"><p class="l-t"><span class="mono">${m.id}</span> · ${(mrEt(m.etapa) || {t: m.etapa}).t}</p><p class="l-s">${N1.format(m.cant)} ${m.un === 'und' ? 'und' : 'kg'} · ${m.causa} · ${m.quien} · ${usd(m.usd)}${m.obs ? ' · ' + m.obs : ''}</p></div><button type="button" class="btn sm pri" data-act="aprobarMerma" data-id="${m.id}">Aprobar</button></li>`).join('')}</ul>`, {sub: 'Mientras esperan, ya cuentan en los reportes'}) : card('Cómo se mide', `<ul class="list"><li><div class="l-main"><p class="l-t">Merma % de una etapa</p><p class="l-s">Perdido ÷ lo que entró a esa etapa.</p></div></li><li><div class="l-main"><p class="l-t">Merma acumulada del lote</p><p class="l-s">Qué parte de la papa se perdió en total, de Recepción a Despacho.</p></div></li><li><div class="l-main"><p class="l-t">Rendimiento neto</p><p class="l-s">Rendimiento medido al cerrar el lote, menos lo perdido después de pesar la papa frita (sazonado, quebrado, empaque, almacén y despacho).</p></div></li><li><div class="l-main"><p class="l-t">Costo</p><p class="l-s">Kg perdidos × costo promedio de ese kg (papa: lo pagado por el lote).</p></div></li></ul>`)}
  </div>
  ${card('Merma por etapa', table([
    {h:'Etapa', f:x => `<b>${x.t}</b>`},

    {h:'Salió', r:1, f:x => x.ent > 0 ? kg(x.ent - x.kg) : '—'},
    {h:'Merma', r:1, f:x => x.pct == null ? '—' : `<b>${pct(x.pct)}</b>`},
    {h:'Tolerancia', r:1, f:x => pct(x.tol)},
    {h:'Estado', f:x => chip(x.sem.l, x.sem.t)},
    {h:'Costo', r:1, f:x => x.usd ? money(x.usd) : '—'}], st, {foot: `<tr class="tsum"><td colspan="7">Costo total de mermas</td><td class="r">${money(usdT)}</td></tr>`, rowCls: x => x.sem.t === 'crit' ? 'hl' : ''}), {})}
  <div class="cols c2">
    ${card('Causas principales (Pareto)', par.length ? `${hbars(par, v => sum(ca, x => x.usd) ? usd(v) : kg(v))}<p class="hint" style="margin-top:8px">Las ${Math.min(3, par.length)} primeras causas explican ${pct(caT ? sum(ca.slice(0, 3), c => sum(ca, x => x.usd) ? c.usd : c.kg) / caT * 100 : 0, 0)} del costo.</p>` : emptyState('Sin mermas en 30 días', 'Cuando se registren, aquí se ve por qué se pierde más.'), {sub: 'Ordenadas por costo en US$'})}
    ${card('Lotes con más merma acumulada', table([
      {h:'Lote', f:m => `<span class="mono">${m.l.id}</span><br><span class="muted">${prov(m.l.prov).nombre.replace(' (ejemplo)', '')}</span>`},
      {h:'Merma acum.', r:1, f:m => `<b>${pct(m.acum)}</b>`},
      {h:'Rend. medido', r:1, f:m => pct(m.rMed)},
      {h:'Rend. neto', r:1, f:m => pct(m.rNet)},
      {h:'Rend. perdido', r:1, f:m => N1.format(m.rPot - m.rNet) + ' pts'},
      {h:'Costo', r:1, f:m => money(m.usd)}], lotes, {empty: 'Todavía no hay lotes cerrados con mermas.'}), {})}
  </div>
  <div class="cols c2">
    ${card('Mermas por proveedor', table([
      {h:'Proveedor', f:r => prov(r[0]).nombre.replace(' (ejemplo)', '')},
      {h:'Perdido', r:1, f:r => kg(r[1].kg, 0)},
      {h:'De lo facturado', r:1, f:r => r[1].pct == null ? '—' : `<b>${pct(r[1].pct)}</b>`},
      {h:'Costo', r:1, f:r => money(r[1].usd)}], pv, {empty: 'Sin mermas de materia prima en 30 días.'}), {})}
    ${card('Registros recientes', table([
      {h:'Cuándo', f:m => fd(m.fecha) + `<br><span class="mono muted">${m.id}</span>`},
      {h:'Etapa', f:m => `${(mrEt(m.etapa) || {t: m.etapa}).t}<br><span class="muted">${m.lote || m.rec || m.ref || '—'}</span>`},
      {h:'Cantidad', r:1, f:m => N1.format(m.cant) + (m.un === 'und' ? ' und' : ' kg')},
      {h:'Causa', f:m => `${m.causa}<br><span class="muted">${m.quien}</span>`},
      {h:'Costo', r:1, f:m => money(m.usd)},
      {h:'Estado', f:est}], recientes, {empty: 'Todavía no hay mermas registradas.'}), {})}
  </div>
  <div class="cols c2">${mrTolCard(false)}${mrCausasCard()}</div>`;
}

/* ---------- Acciones de mermas ---------- */
const MR_ACT = {
  mrEtapa: el => { S.mrForm.etapa = el.value; S.mrErr = ''; mrReset(); render(); },
  mrUn: el => { S.mrForm.un = el.dataset.v; S.mrForm.cant = ''; render(); },
  mrIr: el => { if (!mrPuede(el.dataset.v)) return; S.mrForm.etapa = el.dataset.v; S.mrErr = ''; mrReset(); enter('mermas'); },
  regMerma: () => {
    const f = S.mrForm, p = mrParse();
    if (!p || !mrPuede(f.etapa)) return toast('Tu rol no registra mermas en esa etapa.', 'warn');
    let err = '';
    if (!(p.cant > 0)) err = 'Escribe cuánto se perdió.';
    else if (p.e.og.req && !f.og) err = 'Elige ' + p.e.og.l.toLowerCase() + '.';
    else if (f.un === 'und' && !f.pres) err = 'Elige la presentación de las unidades.';
    else if (p.e.decl && !(+f.ent > 0)) err = 'Indica cuántos kg entraron a la etapa.';
    else if (!f.causa) err = 'Elige la causa.';
    else if (p.pct != null && p.pct > 100) err = 'No se puede perder más de lo que entró a la etapa.';
    S.mrErr = err; if (err) return render();
    const r = p.rec ? one('recepciones', p.rec) : null;
    let mov = null;
    if (f.etapa === 'almmp' && r && r.sk) mov = {almacen: 'MP', item: r.sk, cant: p.kgv};
    if (f.etapa === 'almpt' && f.un === 'und' && f.pres) mov = {almacen: 'PT', item: f.pres, cant: p.cant};
    const body = {etapa: f.etapa, lote: p.lote, rec: p.rec, ref: p.ref, prod: r ? r.item : (p.e.item || ''), pres: f.un === 'und' ? f.pres : '', cant: p.cant, un: f.un, causa: f.causa, obs: f.obs, usd: p.usd, ent: p.e.decl ? +f.ent : 0, apr: lvl('mermas') >= 3, mov};
    run('mr', () => Svc.regMerma(body), id => { const t = p.e.t; mrReset(); return `Merma ${id} registrada en ${t}: ${N1.format(p.kgv)} kg, ${usd(p.usd)}.${body.apr ? '' : ' Queda pendiente de aprobación.'}`; });
  },
  aprobarMerma: el => run('mra:' + el.dataset.id, () => Svc.aprobarMerma(el.dataset.id), 'Merma aprobada.'),
  guardarTolMerma: () => run('pol', async () => { await Svc.guardarPol(S.pol); S.polDirty = false; }, 'Tolerancias de merma guardadas. Ya se aplican en los semáforos y alertas.'),
  addCausa: () => { const n = (S.mrNuevaCausa || '').trim(); if (!n) return toast('Escribe el nombre de la causa.', 'warn'); S.mrNuevaCausa = ''; run('causa', () => Svc.addCausa(n), 'Causa agregada.'); },
  delCausa: el => { const n = el.dataset.v; if (mrCausas().length <= 1) return toast('Debe quedar al menos una causa.', 'warn'); run('causa', () => Svc.delCausa(n), 'Causa quitada de la lista.'); }
};

/* =====================================================================
   Gráficas de barras (Chart.js) · UN solo componente para toda la aplicación
   · cpPanel(pantalla) arma el bloque de gráficas de una pantalla: control de periodo + tarjetas.
   · Cada gráfica es una definición en CH (qué mide, de dónde sale, a qué pantalla pertenece).
   · Tres formas: 'serie' (barras por día/semana/mes, periodo actual contra el anterior),
     'cat' (por proveedor, vendedor, producto…, actual contra anterior) y 'snap' (foto de hoy).
   · Todo se calcula desde lo guardado (Store/DATA/S); nada de esto se guarda.
   · Cada gráfica trae su tabla accesible y su estado vacío. Cada rol ve solo las de su área (lvl).
   ===================================================================== */
const CP = {per: 'dia', off: 0};
const CP_N = {dia: 7, sem: 4, mes: 2}, CP_NAME = {dia: 'Diario', sem: 'Semanal', mes: 'Mensual'};
const pad2 = n => String(n).padStart(2, '0');
const isoOf = d => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
const mondayOf = s => addDays(s, -((D(s).getDay() + 6) % 7));
const monthB = (s, k) => { const d = D(s); d.setDate(1); d.setMonth(d.getMonth() + k); return {a: isoOf(d), z: isoOf(new Date(d.getFullYear(), d.getMonth() + 1, 0))}; };
const cpDay = s => D(s).toLocaleDateString('es-VE', {weekday: 'short', day: '2-digit'}).replace(/[.,]/g, '');
const cpMes = s => D(s).toLocaleDateString('es-VE', {month: 'short', year: '2-digit'}).replace('.', '');
const cpRng = b => b.a === b.z ? fd(b.a) : fd(b.a) + ' a ' + fd(b.z);
/* Ventanas: n barras del periodo actual y n del anterior, alineadas por posición */
function cpWin(per, off) {
  const n = CP_N[per], cur = [], prev = [];
  for (let i = 0; i < n; i++) {
    let c, p;
    if (per === 'dia') { const e = addDays(HOY_ISO, off * n), a = addDays(e, i - (n - 1)), b = addDays(a, -n); c = {a, z: a, l: cpDay(a)}; p = {a: b, z: b, l: cpDay(b)}; }
    else if (per === 'sem') { const m = mondayOf(addDays(HOY_ISO, off * n * 7)), a = addDays(m, (i - (n - 1)) * 7), b = addDays(a, -7 * n); c = {a, z: addDays(a, 6), l: 'sem ' + fd(a)}; p = {a: b, z: addDays(b, 6), l: 'sem ' + fd(b)}; }
    else { const c0 = monthB(HOY_ISO, off * n + i - (n - 1)), p0 = monthB(HOY_ISO, off * n + i - (n - 1) - n); c = {...c0, l: cpMes(c0.a)}; p = {...p0, l: cpMes(p0.a)}; }
    cur.push(c); prev.push(p);
  }
  return {cur, prev, ca: cur[0].a, cz: cur[n - 1].z, pa: prev[0].a, pz: prev[n - 1].z};
}
const inR = (f, a, z) => f >= a && f <= z;
/* Fuentes de datos: se leen de lo guardado, en cada dibujo */
function cpSrc() {
  const G = Store.c.gestion || {}, vh = G.ventas_hist && G.ventas_hist.dias && G.ventas_hist.dias.length ? G.ventas_hist : null, tot = c => (+c.pu || 0) * (+c.qf || 0);
  const s = {
    vh, nh: nomHist(),
    compras: rows('compras').map(c => ({f: c.fecha, fam: c.fam, cond: c.cond, prov: c.prov, cat: c.cat, v: tot(c)})),
    lotes: rows('lotes').filter(l => l.estado === 'Cerrado' && l.granel).map(l => ({f: l.fecha, kg: l.granel, cr: l.cruda, ac: l.aceite || 0})),
    recs: rows('recepciones').filter(r => r.kgRec != null && r.qf).map(r => ({f: r.fecha, prov: r.prov, qf: r.qf, kr: r.kgRec})),
    pagos: rows('pagos').map(p => ({f: p.fecha, v: p.monto})),
    gastos: rows('caja_gastos').map(g => ({f: g.fecha, v: g.monto, cat: g.cat})),
    repos: rows('caja_reposiciones').map(r => ({f: r.fecha, v: r.monto})),
    mer: mrEv(),
    desp: rows('despachos').map(n => ({f: n.fecha, veh: n.veh, tipo: n.tipo, und: sum((n.items || []).filter(i => i.u === 'und'), i => i.c)}))
  };
  const all = [...(vh ? [vh.dias[0][0]] : []), ...s.compras.map(x => x.f), ...s.lotes.map(x => x.f), ...s.pagos.map(x => x.f), ...s.gastos.map(x => x.f), ...s.mer.map(x => x.f)].filter(Boolean).sort();
  s.min = all[0] || null; s.any = !!(s.min || s.desp.length);
  return s;
}
const cpSum = (arr, a, z, f = x => x.v) => sum(arr.filter(x => inR(x.f, a, z)), f);
const cpGroup = (arr, a, z, key, f = x => x.v) => { const m = {}; arr.filter(x => inR(x.f, a, z)).forEach(x => { const k = key(x); if (k != null) m[k] = (m[k] || 0) + (+f(x) || 0); }); return m; };
const vhRows = (vh, a, z) => vh.dias.filter(d => inR(d[0], a, z));
const vhBy = (vh, a, z, idx, names) => { const m = {}; names.forEach(n => { m[n] = 0; }); vhRows(vh, a, z).forEach(d => d[idx].forEach((v, i) => { m[names[i]] += v; })); return m; };
const pctOf = (x, y) => y > 0 ? x / y * 100 : null;
const provN = id => esc((DATA.proveedores.find(p => p.id === id) || {nombre: id}).nombre).replace(' (ejemplo)', '');

function cpLotesProv() {
  const m = {}; S.lotes.filter(l => l.granel && (c => c && c.kgRec)(S.compras.find(x => x.id === l.compra))).forEach(l => { const o = (m[l.prov] ||= {cr: 0, gr: 0, cost: 0}); o.cr += l.cruda; o.gr += l.granel; o.cost += lotCosto(l) || 0; });
  return m;
}
/* Mapa → barras ordenadas (la forma de foto más común) */
function cpTop(u, m, lim, k, vert) {
  const e = Object.entries(m).filter(x => x[1] > 0).sort((a, b) => b[1] - a[1]).slice(0, lim);
  return {u, vert: !!vert, labels: e.map(x => x[0]), ds: [{k, v: e.map(x => x[1]), tone: 'cur'}]};
}

let softT = null;

/* Mientras alguien elige un archivo no se redibuja la pantalla: el botón se destruiría y la foto elegida se perdería. */
document.addEventListener('click', e => { const f = e.target.closest && e.target.closest('input[type=file]'); if (f) { S.filePick = Date.now(); } }, true);

function doSoft() {
  if (S.filePick && Date.now() - S.filePick < 120000) { S.pendingRender = true; setTimeout(softRender, 3000); return; }
  const a = document.activeElement;

function go(route) {

/* Un clic sobre la barra de desplazamiento del fondo NO debe cerrar la ventana: solo cierra el clic fuera, en la zona sin barra */

const ENT = {
  cli: {col: 'clientes', scr: 'clientes', t: 'cliente'},

  contacto: 'Contacto', entrega: 'Plazo de entrega (días)', cond: 'Condición', dias: 'Días de plazo', n: 'Nombre', kgSaco: 'Kg por saco', min: 'Mínimo', g: 'Gramos', ventaDia: 'Venta diaria', cedula: 'Cédula', cargo: 'Cargo', area: 'Área', pago: 'Pago', tarifa: 'Tarifa'};
const entKind = (col, id) => col === 'proveedores' ? 'prov' : col === 'clientes' ? 'cli' : col === 'empleados' ? 'emp' : /^INS-/.test(id) || /^MP-/.test(id) ? 'ins' : /^PRES-/.test(id) ? 'pres' : 'sal';
const entNom = d => d ? (d.nombre || d.n || d.k || d.cod || '') : '';
const ESTADOS_VE = ['Amazonas', 'Anzoátegui', 'Apure', 'Aragua', 'Barinas', 'Bolívar', 'Carabobo', 'Cojedes', 'Delta Amacuro', 'Distrito Capital', 'Falcón', 'Guárico', 'Lara', 'Mérida', 'Miranda', 'Monagas', 'Nueva Esparta', 'Portuguesa', 'Sucre', 'Táchira', 'Trujillo', 'Vargas', 'Yaracuy', 'Zulia'];
const entFields = kind => {
  const vend = (DATA.vendedores || []).map(v => v[0]);
  if (kind === 'cli') return [
    {k: 'nombre', l: 'Nombre del cliente', req: 1}, {k: 'rif', l: 'RIF', req: 1, ph: 'J-00000000-0'}, {k: 'tel', l: 'Teléfono (WhatsApp)', t: 'tel', ph: '0414-0000000'},
    {k: 'vend', l: 'Vendedor asignado', sel: ['', ...vend]}, {k: 'precio', l: 'Tipo de precio', sel: ['B', 'FULL'], sens: 1}, {k: 'credito', l: 'Crédito (días)', t: 'number', sens: 1},
    {k: 'ubic', l: 'Estado donde está (ubicación)', sel: [['', 'Elige el estado'], ...ESTADOS_VE]},
    {k: 'estado', l: 'Situación del cliente', sel: ['activo', 'inactivo']}];
  if (kind === 'prov') return [
    {k: 'nombre', l: 'Nombre', req: 1}, {k: 'rif', l: 'RIF', req: 1, ph: 'J-00000000-0'}, {k: 'rubro', l: 'Rubro o categoría'},
    {k: 'tipo', l: 'Qué vende', sel: [['papa', 'Papa (materia prima)'], ['insumo', 'Insumos'], ['general', 'Compras generales']]}, {k: 'contacto', l: 'Contacto (persona o teléfono)'}, {k: 'entrega', l: 'Plazo de entrega (días)', t: 'number'},
    {k: 'cond', l: 'Condición de pago', sel: ['Contado', 'Crédito'], sens: 1, rr: 1}, {k: 'dias', l: 'Días de plazo', t: 'number', sens: 1, solo: f => f.cond === 'Crédito'}];
  if (kind === 'ins') return [{k: 'n', l: 'Nombre', req: 1}, {k: 'kgSaco', l: 'Kg por saco', t: 'number'}, {k: 'min', l: 'Mínimo de existencia', t: 'number'}];

  return [{k: 'n', l: 'Nombre', req: 1}, {k: 'min', l: 'Mínimo (und)', t: 'number'}];

const entLoad = (kind, id) => {
  const d = one(ENT[kind].col, id) || {};
  if (kind === 'cli') return {nombre: d.nombre || '', rif: d.rif || '', tel: d.tel || '', vend: d.vend || '', precio: d.precio || 'B', credito: d.credito ?? 30, ubic: d.ubic || '', estado: d.estado || 'activo'};

const entNew = kind => kind === 'cli' ? {nombre: '', rif: '', tel: '', vend: '', precio: 'B', credito: 30, ubic: '', estado: 'activo'} : kind === 'prov' ? {nombre: '', rif: '', rubro: '', tipo: 'insumo', contacto: '', entrega: 3, cond: 'Contado', dias: 30} : {};

/* Registro de cambios: quién (rol), qué y cuándo */
Object.assign(Svc, {
  async audit(ent, ref, nom, accion, cambios = {}) {
    const ts = Date.now();
    await W.set('auditoria', 'AU-' + ts.toString(36) + Math.random().toString(36).slice(2, 5), {ts, rol: ROLES[S.rol] || S.rol, ent, ref, nom: nom || ref, accion, cambios});
  },
  async saveEnt(kind, id, f) {
    const E = ENT[kind], flds = entFields(kind);
    if (lvl(E.scr) < 2) throw fail('Tu rol no puede modificar ' + E.t + 's.');
    const prev = id ? entLoad(kind, id) : null, ch = {};
    flds.forEach(x => { const a = prev ? prev[x.k] : undefined, b = x.t === 'number' ? +f[x.k] || 0 : (f[x.k] ?? '').toString().trim(); if (prev && String(a ?? '') !== String(b ?? '')) ch[x.k] = [a ?? '', b]; });
    const sens = flds.filter(x => x.sens && ch[x.k]);
    if (sens.length && S.rol !== 'dueno') throw fail('Solo el Dueño cambia ' + sens.map(x => x.l.toLowerCase()).join(' y ') + '.');
    const v = {}; flds.forEach(x => { v[x.k] = x.t === 'number' ? Math.max(0, +f[x.k] || 0) : (f[x.k] ?? '').toString().trim(); });
    if (kind === 'cli') {
      if (!id && S.rol !== 'dueno') { v.precio = 'B'; v.credito = 30; }
      const dup = rows('clientes').find(c => c.id !== id && (c.nombre || '').trim().toLowerCase() === v.nombre.toLowerCase());
      if (dup) throw fail('Ya existe un cliente con ese nombre.');
      const nom0 = prev && prev.nombre;
      if (!id) { id = await nextId('CL', 3, 'CL', '-'); await W.set('clientes', id, {...v, orden: Date.now()}); await Svc.audit('cli', id, v.nombre, 'agregó', {}); }
      else {
        await W.update('clientes', id, v);
        if (nom0 && nom0 !== v.nombre) {
          for (const gid of ['cxc', 'cobros', 'inactivos']) { const d = one('gestion', gid); if (d && d.items && d.items.some(c => c.cli === nom0)) await W.update('gestion', gid, {items: d.items.map(c => c.cli === nom0 ? {...c, cli: v.nombre} : c)}); }
          const m = {...((one('ajustes', 'tel_clientes') || {}).map || {})}; if (m[nom0]) { m[v.nombre] = m[nom0]; delete m[nom0]; await W.set('ajustes', 'tel_clientes', {map: m}); }
        }
        if (Object.keys(ch).length) await Svc.audit('cli', id, v.nombre, 'modificó', ch);
      }
      if (v.tel && (!prev || prev.tel !== v.tel)) await Svc.setTel(v.nombre, v.tel);
      return id;
    }
    if (kind === 'prov') {
      const cred = v.cond === 'Crédito', d = {nombre: v.nombre, rif: v.rif, rubro: v.rubro || 'Sin rubro', tipo: v.tipo, contacto: v.contacto, entrega: v.entrega, cond: v.cond, plazo: cred ? v.dias + ' días' : 'Contado', dias: cred ? v.dias : 0};
      await W.update('proveedores', id, d); if (Object.keys(ch).length) await Svc.audit('prov', id, v.nombre, 'modificó', ch); return id;
    }
    if (kind === 'ins') {
      const d = one('productos', id), par = rows('productos').find(p => p.tipo === 'mp' && p.k === d.sk);
      await W.update('productos', id, {n: v.n, kgSaco: v.kgSaco}); if (par) await W.update('productos', par.id, {min: v.min});
    } else await W.update('productos', id, kind === 'pres' ? {n: v.n, g: v.g, min: v.min, ventaDia: v.ventaDia} : {n: v.n, min: v.min});
    if (Object.keys(ch).length) await Svc.audit(kind, id, v.n, 'modificó', ch);
    return id;
  }
});
/* Envolturas: el alta y el archivo de lo que ya existía también dejan rastro */
(() => {
  const ar = Svc.archivar; Svc.archivar = async (col, id, on) => { const d = one(col, id); await ar(col, id, on); await Svc.audit(entKind(col, id), id, entNom(d), on ? 'archivó' : 'restauró'); };
  const ap = Svc.addProv; Svc.addProv = async f => { const id = await ap(f); await Svc.audit('prov', id, f.nombre, 'agregó'); return id; };
  const ai = Svc.addInsumo; Svc.addInsumo = async f => { await ai(f); await Svc.audit('ins', '', f.n, 'agregó'); };
  const apr = Svc.addPres; Svc.addPres = async f => { await apr(f); await Svc.audit('pres', 'PRES-' + f.cod, f.n, 'agregó'); };
  const asa = Svc.addSalsa; Svc.addSalsa = async f => { await asa(f); await Svc.audit('sal', '', f.n, 'agregó'); };
  const se = Svc.saveEmp; Svc.saveEmp = async f => {
    const prev = f.id ? one('empleados', f.id) : null;
    if (prev && S.rol !== 'dueno' && (+prev.tarifa !== +f.tarifa || (prev.pago || 'dia') !== f.pago)) throw fail('Solo el Dueño cambia las tarifas de pago.');
    const id = await se(f), ch = {};
    if (prev) { [['n', f.n], ['cedula', f.cedula], ['cargo', f.cargo], ['area', f.area], ['tel', f.tel], ['pago', f.pago], ['tarifa', +f.tarifa]].forEach(([k, b]) => { const a = prev[k]; if (String(a ?? '').trim() !== String(b ?? '').trim()) ch[k] = [a ?? '', b]; }); }
    await Svc.audit('emp', id, f.n, prev ? 'modificó' : 'agregó', ch); return id;
  };
})();

    const v = DATA.flota.find(x => x.id === f.veh), body = {...f, veh: v ? v.id : '', chofer: v ? v.chofer : ''};
    run('nota', () => Svc.nota(body), id => { Object.assign(S.notaForm, {dest: '', rif: '', desc: '', cant: '', lote: ''}); return `Nota ${id} creada.`; });
  },
  notaEstado: el => { const n = S.notas.find(x => x.id === el.dataset.id); if (!n) return; const nx = n.estado === 'Cargando' ? 'En ruta' : 'Entregada'; run('ne:' + n.id, () => Svc.notaEstado(n.id, nx), `${n.id}: ${nx.toLowerCase()}.`); },
  /* políticas, roles y módulos, tasa */
  guardarPol: () => run('pol', async () => { await Svc.guardarPol(S.pol); S.polDirty = false; }, 'Políticas guardadas. Ya se aplican en caja chica, préstamos y cuentas por pagar.'),
  resetPol: () => run('pol', async () => { S.pol = clone(DATA.politicas); await Svc.guardarPol(S.pol); S.polDirty = false; }, 'Valores de ejemplo restaurados.'),
  perm: el => { if (S.rol !== 'dueno') return; (S.perm[el.dataset.s] ||= {})[el.dataset.r] = +el.value; saveMatriz(); renderAll(); },
  modsToggle: el => {
