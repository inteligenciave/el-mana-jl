<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mi cuenta · El Maná JL</title>
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#C92121">
<link rel="icon" href="/favicon.ico" sizes="any"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>/* Sugerencias desplegables de las barras de búsqueda (todo el sistema) */
.bq-lista{position:fixed;z-index:2000;margin:0;padding:4px;list-style:none;overflow:auto;background:var(--surface);color:var(--fg);border:1px solid var(--line-2);border-radius:10px;box-shadow:0 10px 28px rgba(0,0,0,.22);overscroll-behavior:contain}
.bq-lista[hidden]{display:none}
.bq-lista li{display:flex;flex-direction:column;gap:1px;padding:8px 10px;min-height:44px;justify-content:center;border-radius:7px;cursor:pointer}
.bq-lista li b{font-weight:600;font-size:14px;overflow-wrap:anywhere}
.bq-lista li span{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.bq-lista li:hover,.bq-lista li.on{background:var(--sel-bg)}
.bq-lista li.on{box-shadow:inset 3px 0 0 var(--pri)}
.bq-estado{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
input[data-bq]{min-width:0}

/* Portal del cliente · marca: rojo #C92121, amarillo #F2B72E, blanco y gris casi negro. Verde y ámbar solo como semáforo. Móvil primero. */
:root{
  --rojo:#C92121;--rojo-osc:#A51B1B;--rojo-cl:#FBE9E9;--amar:#F2B72E;--amar-cl:#FFF4D6;--amar-osc:#5A4300;
  --tinta:#1F1F1F;--gris:#5E5E5E;--linea:#E2DCDC;--fondo:#F6F4F4;--blanco:#FFFFFF;
  --ok:#256B4D;--ok-bg:#E1F0E8;--err:#9C1C17;--err-bg:#FBE4E1;
  --surface:#FFFFFF;--fg:#1F1F1F;--line-2:#CFC8C8;--sel-bg:#FFF4D6;--muted:#5E5E5E;--pri:#C92121;
  --f:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--fondo);color:var(--tinta);font:16px/1.45 var(--f);min-height:100vh;padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--amar);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.cab{background:var(--rojo);color:#fff;position:sticky;top:0;z-index:20}
.cab-i{max-width:980px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.cab img{width:40px;height:40px;border-radius:50%;background:#fff;flex:none}
.cab b{display:block;font-size:17px;line-height:1.15}
.cab small{display:block;font-size:13px;opacity:.95;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:62vw}
.cab .salir{margin-left:auto;background:transparent;border:1px solid rgba(255,255,255,.7);color:#fff;border-radius:8px;min-height:40px;padding:0 12px;font-size:14px}
.cab-nav{display:none}
main{max-width:980px;margin:0 auto;padding:16px}
.card{background:var(--blanco);border:1px solid var(--linea);border-radius:14px;padding:16px;margin-bottom:14px}
.card h2{font-size:18px;margin-bottom:10px}
.grande{font-size:34px;font-weight:800;line-height:1.1;letter-spacing:-.01em}
.sub{color:var(--gris);font-size:14px}
.fila{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sep{justify-content:space-between}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;border:2px solid var(--rojo);background:var(--rojo);color:#fff;font-weight:700;text-decoration:none}
.btn:hover:not(:disabled){background:var(--rojo-osc);border-color:var(--rojo-osc)}
.btn.am{background:var(--amar);border-color:var(--amar);color:#2B2100}
.btn.am:hover:not(:disabled){background:#E5A91C;border-color:#E5A91C}
.btn.lin{background:#fff;color:var(--rojo)}
.btn.lin:hover:not(:disabled){background:var(--rojo-cl)}
.btn.sm{min-height:44px;padding:0 14px;font-size:15px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.full{width:100%}
.acciones{display:grid;gap:10px;grid-template-columns:1fr}
@media(min-width:640px){.acciones{grid-template-columns:repeat(3,1fr)}}
.fld{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:15px}
.fld small{font-weight:400;color:var(--gris)}
.fld input,.fld select,.fld textarea{min-height:48px;border:1.5px solid var(--line-2);border-radius:10px;padding:0 12px;background:#fff;font-weight:400;width:100%}
.fld textarea{padding:10px 12px;min-height:84px;resize:vertical}
.form{display:grid;gap:14px}
@media(min-width:640px){.form.dos{grid-template-columns:1fr 1fr}.form .ancho{grid-column:1/-1}}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700;white-space:nowrap}
.c-ok{background:var(--ok-bg);color:#1E5E41}
.c-esp{background:var(--amar-cl);color:var(--amar-osc)}
.c-mal{background:var(--err-bg);color:var(--err)}
.c-n{background:#ECE8E8;color:var(--tinta)}
.aviso{border-radius:10px;padding:10px 12px;font-size:15px;margin:10px 0;border:1px solid}
.aviso.i{background:var(--amar-cl);border-color:var(--amar);color:var(--tinta)}
.aviso.e{background:var(--err-bg);border-color:var(--err);color:var(--err);font-weight:600}
.aviso.v{background:var(--ok-bg);border-color:var(--ok);color:#1E5E41}
.barra{height:10px;border-radius:99px;background:#ECE8E8;overflow:hidden;margin:8px 0 4px}
.barra i{display:block;height:100%;background:var(--ok)}
.barra.w i{background:var(--amar)}.barra.c i{background:var(--err)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin:12px 0 0}
.kv dt{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--gris);font-weight:700}
.kv dd{margin:0;font-weight:700;font-size:17px}
/* navegación */
.tabs{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--linea);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px);z-index:30}
.tabs button{border:0;background:none;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12.5px;font-weight:600;color:var(--gris);position:relative}
.tabs button svg{width:24px;height:24px}
.tabs button[aria-current="page"]{color:var(--rojo);box-shadow:inset 0 3px 0 var(--rojo)}
.pt{position:absolute;top:6px;right:calc(50% - 22px);background:var(--rojo);color:#fff;border-radius:99px;min-width:18px;height:18px;font-size:11px;display:grid;place-items:center;padding:0 5px}
@media(min-width:900px){
  body{padding-bottom:24px}
  .tabs{position:static;border:0;background:transparent;max-width:980px;margin:0 auto;padding:10px 16px 0;display:flex;gap:6px}
  .tabs button{flex-direction:row;min-height:48px;padding:0 18px;border:1.5px solid var(--linea);border-radius:12px;background:#fff;font-size:15px;gap:8px}
  .tabs button[aria-current="page"]{background:var(--rojo);color:#fff;border-color:var(--rojo);box-shadow:none}
  .pt{position:static;background:var(--amar);color:#2B2100}
}
/* pedido */
.bq-f{margin-bottom:10px}
.cats{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.cats button{min-height:44px;padding:0 16px;border-radius:99px;border:1.5px solid var(--line-2);background:#fff;font-weight:600}
.cats button[aria-pressed="true"]{background:var(--rojo);border-color:var(--rojo);color:#fff}
.prods{display:grid;gap:10px;grid-template-columns:1fr}
@media(min-width:700px){.prods{grid-template-columns:1fr 1fr}}
.prod{display:grid;grid-template-columns:52px minmax(0,1fr);gap:4px 12px;align-items:center;background:#fff;border:1.5px solid var(--linea);border-radius:14px;padding:12px}
.prod.on{border-color:var(--amar);box-shadow:0 0 0 2px var(--amar)}
.prod.sin{background:#F1EEEE}
.foto{grid-row:1/3;width:52px;height:52px;border-radius:12px;background:var(--amar);color:#2B2100;font-weight:800;display:grid;place-items:center;font-size:17px;overflow:hidden}
.fnom{font-size:8px;line-height:1.1;text-align:center;padding:2px;font-weight:700;word-break:break-word}
.foto img{width:100%;height:100%;object-fit:contain;background:#fff}
.prod b{font-size:15.5px;line-height:1.2}
.prod .p{font-size:14px;color:var(--gris)}
.prod .p strong{color:var(--tinta);font-size:16px}
.cant{grid-column:1/-1;display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:4px}
.step{display:flex;gap:6px;align-items:center}
.step button{width:48px;height:48px;border-radius:12px;border:1.5px solid var(--line-2);background:#fff;font-size:24px;font-weight:700;line-height:1}
.step button:hover:not(:disabled){background:var(--amar);border-color:var(--amar)}
.step button:disabled{opacity:.35}
.step input{width:72px;height:48px;text-align:center;border:1.5px solid var(--line-2);border-radius:12px;font-weight:700;font-size:17px}
.resumen{position:sticky;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:15;background:#fff;border:2px solid var(--rojo);border-radius:14px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 6px 20px rgba(0,0,0,.15);margin-top:12px}
@media(min-width:900px){.resumen{bottom:12px}}
.resumen b{font-size:18px}
/* listas */
.lista{display:grid;gap:10px}
.item{border:1px solid var(--linea);border-radius:12px;padding:12px;background:#fff;display:grid;gap:6px}
.item .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.item .num{font-weight:800}
.item .mini{font-size:14px;color:var(--gris)}
.item .monto{font-weight:800;font-size:18px;text-align:right}
.item button.ver{justify-self:start}
.seg{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;padding-bottom:2px}
.seg button{flex:none;min-height:44px;padding:0 14px;border-radius:99px;border:1.5px solid var(--line-2);background:#fff;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--tinta);border-color:var(--tinta);color:#fff}
.vacio{text-align:center;color:var(--gris);padding:22px 8px}
/* tabla en pantalla ancha */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--linea);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--gris)}
td.r,th.r{text-align:right}
@media(max-width:699px){.solo-ancho{display:none}}
@media(min-width:700px){.solo-movil{display:none}}
/* hoja */
.vel{position:fixed;inset:0;background:rgba(31,31,31,.55);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.hoja{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
@media(min-width:700px){.vel{align-items:center}.hoja{border-radius:18px}}
.hoja h2{font-size:20px;margin-bottom:10px}
.hoja .x{float:right;width:44px;height:44px;border:0;background:#F1EEEE;border-radius:50%;font-size:22px}
.tot{border-top:2px solid var(--tinta);margin-top:8px;padding-top:8px;display:grid;gap:4px}
.tot p{display:flex;justify-content:space-between;gap:10px}
.tot .g{font-size:20px;font-weight:800}
/* entrada */
.entrada{max-width:520px;margin:8vh auto 0;padding:0 16px}
.entrada .card{padding:22px}
.entrada img{width:84px;height:84px;border-radius:50%;display:block;margin:0 auto 12px;background:#fff}
.entrada h1{font-size:24px;text-align:center;margin-bottom:6px}
.entrada p.sub{text-align:center;margin-bottom:16px}
#toast{position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:80;display:grid;gap:8px;justify-items:center;pointer-events:none}
.tt{background:var(--tinta);color:#fff;border-radius:12px;padding:12px 16px;max-width:560px;font-weight:600;pointer-events:auto}
.tt.e{background:var(--err)}
@media(min-width:900px){#toast{bottom:20px}}
@media print{.tabs,.cab .salir,.resumen{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:640px){.seg{display:grid;grid-template-columns:1fr 1fr;overflow:visible}.seg button{flex:none;padding:0 8px;font-size:14px}}

.comp-prev{display:flex;gap:12px;align-items:center;margin-top:8px}.comp-prev img{width:96px;max-height:120px;object-fit:cover;border-radius:8px;border:1px solid var(--linea)}.comp-prev>div{display:grid;gap:6px;justify-items:start}
/* COMPACTO (pedido del dueño): en computador, menos espacio en blanco. El celular queda igual. */
@media (min-width:900px){
body{font-size:14px;line-height:1.4;padding-bottom:16px}
.cab-i{padding:5px 16px}.cab img{width:34px;height:34px}.cab b{font-size:16px}.cab small{font-size:12.5px}
.cab .salir{min-height:34px;padding:0 12px}
main{padding:10px 16px}
.card{padding:10px 14px;margin-bottom:8px;border-radius:12px}
.card h2{font-size:16px;margin-bottom:6px}
.grande{font-size:28px}
.btn{min-height:38px;padding:0 14px;font-size:14px}
.btn.sm{min-height:34px;padding:0 12px;font-size:14px}
.acciones{gap:8px}.form{gap:8px}
}

<body><div id="app"></div><div id="toast" aria-live="polite"></div>
<noscript><p style="padding:20px">Para ver tu cuenta necesitas activar JavaScript.</p></noscript>
<script>
/* BORRADOR: guarda lo que la persona está escribiendo (y la pestaña/pantalla donde estaba) para recuperarlo si la página se actualiza.
   Solo este navegador (localStorage), por pantalla y por rol, 24 h. Nunca guarda contraseñas, PIN, claves, cuentas ni tarjetas.
   Si localStorage falla, la pantalla funciona igual. Va ANTES de todo lo demás en la página.
   API: Borrador.registrar(clave, getEstado, setEstado)  estado propio de una pantalla (carrito, filtros...) que vive en JS
        Borrador.tab(ruta[, i])   pestaña abierta        Borrador.exito()  «se guardó bien»: borra lo que ya se envió
        Borrador.limpiar()        borra todo (cambiar rol / salir)    Borrador.sesion()  devuelve al rol/módulo donde estaba
        Borrador.config({ctx, aviso, raices, sesion}) lo usa el portal del cliente */
(function () {
"use strict";
const PRE = 'elmana:borr:', VIDA = 24 * 36e5, DEB = 400, VENTANA = 20000, MAXV = 5000;
let cfg = {ctx: null, aviso: null, raices: null, interno: !!document.getElementById('main')};
const regs = {}, aplicadoReg = new Set(), pend = {}, nrest = {}, ventana = {};
let ctxAct = null, modalAbierto = false, restaurando = false, aplicando = false, avisado = false, propio = false, ultimo = null, sesCache = '', tFlush = 0, tObs = 0;

/* ---------- almacenamiento (todo con try/catch) ---------- */
const ls = {
  get(k) { try { const t = localStorage.getItem(k); return t ? JSON.parse(t) : null; } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { /* sin almacenamiento */ } },
  claves() { const r = []; try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.indexOf(PRE) === 0) r.push(k); } } catch (e) { /* nada */ } return r; }
};
function leer(ctx) { const d = ls.get(PRE + 'd:' + ctx); if (!d) return null; if (!d.ts || Date.now() - d.ts > VIDA) { ls.del(PRE + 'd:' + ctx); return null; } return d; }
function escribir(ctx, d) {
  if (!d.f || !Object.keys(d.f).length) delete d.f;
  if (d.r && !Object.keys(d.r).length) delete d.r;
  if (!d.f && !d.r && d.tab == null) { ls.del(PRE + 'd:' + ctx); return; }
  d.ts = Date.now(); ls.set(PRE + 'd:' + ctx, d);
}
function purgar() { ls.claves().forEach(k => { const d = ls.get(k); if (!d || !d.ts || Date.now() - d.ts > VIDA) ls.del(k); }); }

/* ---------- contexto: pantalla + rol ---------- */
function ctxDe(ruta) {
  try {
    if (cfg.ctx) return cfg.ctx(ruta);
    if (typeof S === 'undefined' || !S || S.entry !== 'in') return null;
    if (typeof Boot !== 'undefined' && Boot.state !== 'ready') return null;
    return 'i:' + S.rol + ':' + (ruta || S.route);
  } catch (e) { return null; }
}
const raices = () => cfg.raices || (cfg.interno ? ['#main', '#modal', '#top'] : ['#app']);
const ambito = el => { const r = raices(); for (let i = 0; i < r.length; i++) { const n = document.querySelector(r[i]); if (n && n.contains(el)) return r[i] === '#modal' ? 'o' : r[i] === '#top' ? 't' : 'm'; } return null; };

/* ---------- qué campos se pueden guardar ---------- */
const SECRETO = /pass|contras|clave|(^|[^a-z])pin([^a-z]|$)|token|cuenta|(^|[^a-z])cta([^a-z]|$)|tarjeta|card|cvv|cvc|iban|secret|swift|routing|c[oó]digo.?seg/i;
function guardable(el) {
  if (!el || !el.tagName) return false;
  const t = el.tagName;
  if (t !== 'INPUT' && t !== 'SELECT' && t !== 'TEXTAREA') return false;
  const ty = (el.type || '').toLowerCase();
  if (/^(password|file|hidden|button|submit|reset|image)$/.test(ty)) return false;
  if (el.hasAttribute('data-nodraft') || el.closest('[data-nodraft]') || el.hasAttribute('data-act-change') || el.disabled || el.readOnly) return false;
  const marca = [el.id, el.name, el.getAttribute('data-k'), el.getAttribute('autocomplete'), el.getAttribute('placeholder'), el.getAttribute('aria-label')].join(' ');
  if (SECRETO.test(marca) || /^cc-/.test(el.getAttribute('autocomplete') || '')) return false;
  if (ty === 'tel' || ty === 'text' || ty === 'number' || ty === '') { if (/^\D*(\d[\s.-]?){12,}\D*$/.test(el.value || '')) return false; }
  return true;
}
const base = el => el.id || el.name || el.getAttribute('data-k') || '';
function claveDe(el, orden) {
  const a = ambito(el); if (!a) return null;
  let b = base(el);
  if (!b) { const l = el.closest('label'); b = '~' + (el.getAttribute('aria-label') || el.getAttribute('placeholder') || (l && l.textContent.trim().slice(0, 24)) || el.getAttribute('data-act') || el.tagName.toLowerCase() + (el.type || '')); if (orden) { orden[a + b] = (orden[a + b] || 0) + 1; b += '#' + orden[a + b]; } else b += '#?'; }
  return a + ':' + b;
}
function valorDe(el) {
  const ty = (el.type || '').toLowerCase();
  if (ty === 'checkbox') return {v: !!el.checked, b: !!el.defaultChecked};
  if (ty === 'radio') return el.checked ? {v: el.value, b: null} : null;
  if (el.tagName === 'SELECT') { const d = [...el.options].find(o => o.defaultSelected) || el.options[0]; return {v: el.value, b: d ? d.value : ''}; }
  return {v: String(el.value).slice(0, MAXV), b: el.defaultValue};
}
const esDefecto = (el, x) => { const ty = (el.type || '').toLowerCase(); return ty === 'radio' ? !el.checked : x.v === x.b; };
function campos() { /* [{el, key}] de lo que hay ahora en pantalla */
  const orden = {}, r = [];
  raices().forEach(sel => document.querySelectorAll(sel + ' input,' + sel + ' select,' + sel + ' textarea').forEach(el => { if (guardable(el)) { const k = claveDe(el, orden); if (k) r.push({el, key: k}); } }));
  return r;
}

/* ---------- guardar ---------- */
const dueno = new WeakMap(); /* a qué pantalla pertenece cada campo: un «change» tardío (al cambiar de pantalla) no debe caer en la nueva */
function anotar(el, esChange) {
  if (restaurando || !el || !el.isConnected || !guardable(el)) return;
  const ctx = (esChange && dueno.get(el)) || ctxDe(); if (!ctx) return;
  dueno.set(el, ctx);
  const orden = {}; /* el orden solo importa para campos sin id: se calcula con todo lo que hay en pantalla */
  const hit = campos().find(c => c.el === el); const key = hit ? hit.key : claveDe(el, orden); if (!key) return;
  const ty = (el.type || '').toLowerCase(), v = valorDe(el); if (!v) { if (ty === 'radio') return; return; }
  (pend[ctx] = pend[ctx] || {})[ty === 'radio' ? key : key] = {x: v, radio: ty === 'radio', def: ty === 'radio' ? false : esDefecto(el, v)};
  programar();
}
function programar() { clearTimeout(tFlush); tFlush = setTimeout(flush, DEB); }
function flush() {
  clearTimeout(tFlush);
  try {
    Object.keys(pend).forEach(ctx => {
      const d = leer(ctx) || {f: {}}; d.f = d.f || {};
      Object.keys(pend[ctx]).forEach(k => { const p = pend[ctx][k]; if (p.def) delete d.f[k]; else d.f[k] = p.x; });
      escribir(ctx, d); delete pend[ctx];
    });
    const grupos = {};

/* Buscador común de TODO el sistema: normalización, coincidencia y lista de sugerencias desplegable.

  /* ---- lienzo de páginas ---- */
  function Lienzo() {

    const col = (a, st) => a.map(x => x.toFixed(3)).join(' ') + (st ? ' RG' : ' rg');
    const cmdRect = (x, y, w, h, relleno, borde) => { const o = ['q']; if (relleno) o.push(col(relleno)); if (borde) o.push(col(borde, 1) + ' 0.6 w'); o.push(`${f2(x)} ${f2(H - y - h)} ${f2(w)} ${f2(h)} re ${relleno && borde ? 'B' : relleno ? 'f' : 'S'}`, 'Q'); return o; };

      /* y = línea base (desde arriba); al = 'l' | 'r' | 'c' alrededor de x */

  function armar(paginas, logo, titulo) {
    const objs = []; const add = s => { objs.push(s); return objs.length; };
    const catalogo = add(''), arbol = add(''), f1 = add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>'), f2o = add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
    let im = 0; if (logo) im = add({stream: logo.bytes, dic: `/Type /XObject /Subtype /Image /Width ${logo.w} /Height ${logo.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode`});

      const flujo = cont.join('\n'), cs = add({stream: flujo, dic: ''});
      const pg = add(`<< /Type /Page /Parent ${arbol} 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /Font << /F1 ${f1} 0 R /F2 ${f2o} 0 R >>${im ? ` /XObject << /Im1 ${im} 0 R >>` : ''} >> /Contents ${cs} 0 R >>`);

  /* ---- el documento ---- */
  function generar(d, logo) {
    const L = Lienzo(), T = d.totales || {}, E = d.empresa || {}, cli = d.cliente || {}, envio = d.envio || {};
    const lineas = d.lineas || [], pedido = d.kind === 'pedido';
    const nPag = () => L.pags.length;

    };

    let yA = y + 10, yB = y + 10; const xB = M + colW + 12;
    yA = campo(M + 8, yA, 'Cliente', cli.razon, colW - 16) + 3; yA = campo(M + 8, yA, 'RIF', cli.rif, colW - 16) + 3;
    if (cli.vendedor) yA = campo(M + 8, yA, 'Vendedor', cli.vendedor, colW - 16) + 3;
    const ub = [envio.estado && 'Estado: ' + envio.estado, envio.zona && 'Zona: ' + envio.zona, envio.direccion && 'Dirección: ' + envio.direccion].filter(Boolean).join('  ·  ');
    yA = campo(M + 8, yA, 'Ubicación de envío', ub || 'Falta completar la zona y la dirección de entrega', colW - 16) + 3;
    yB = campo(xB + 8, yB, 'Tasa BCV del día de emisión', d.tasa ? `${N(d.tasa.valor, 4)} Bs por $ 1  (${fecha(d.tasa.fecha)})` : 'Sin tasa guardada para esa fecha', colW - 16) + 3;
    yB = campo(xB + 8, yB, 'Condición de pago', [d.condicion, d.plazo].filter(Boolean).join(' · ') + (d.vence ? ' · vence el ' + fecha(d.vence) : ''), colW - 16) + 3;
    const bk = d.banco ? [d.banco.nombre, d.banco.cuenta && 'Cuenta ' + d.banco.cuenta, d.banco.titular && 'Titular: ' + d.banco.titular].filter(Boolean).join(' · ') : 'No se eligió un banco';
    yB = campo(xB + 8, yB, 'Cuenta bancaria para el pago', bk, colW - 16) + 3;
    const alto = Math.max(yA, yB) - filaTop + 2;

    y = filaTop + alto + 14;
    /* tabla */
    const cols = [{h: 'Producto', x: M + 6, w: 214, al: 'l'}, {h: 'Bultos', x: M + 290, al: 'r'}, {h: 'Kilos', x: M + 352, al: 'r'}, {h: 'Precio x bulto', x: M + 432, al: 'r'}, {h: 'Total $', x: W - M - 6, al: 'r'}];
    const cabTabla = () => { L.rect(M, y, W - 2 * M, 18, RED); for (const c of cols) L.texto(c.h, c.x, y + 12.5, 8.5, {b: 1, al: c.al, color: [1, 1, 1]}); y += 18; };
    cabTabla();

      L.texto(usd(l.precio_bulto), cols[3].x, y + 12, 9, {al: 'r'}); L.texto(usd(l.total), cols[4].x, y + 12, 9, {al: 'r', b: 1});

    y += 12; const tx = W - M - 230, tw = 230, fila = (rot, val, o = {}) => { L.texto(rot, tx + 8, y + 11, o.sz || 9.5, {b: o.b, color: o.color}); L.texto(val, tx + tw - 8, y + 11, o.sz || 9.5, {al: 'r', b: o.b, color: o.color}); y += o.h || 16; };
    const y0 = y;
    L.texto('Bultos: ' + N(T.bultos, 0), M, y + 11, 9.5, {b: 1}); L.texto('Kilos totales: ' + (T.kilos != null ? N(T.kilos, 2) + ' kg' : '—'), M, y + 27, 9.5, {b: 1});
    fila('Subtotal', usd(T.subtotal)); if (T.descuento) fila('Descuento' + (T.descuento_pct ? ' ' + N(T.descuento_pct, 2) + ' %' : ''), '- ' + usd(T.descuento));
    fila('IVA', usd(T.iva)); L.rect(tx, y - 1, tw, 24, RED); y += 1; fila('TOTAL $', usd(T.total), {b: 1, color: [1, 1, 1], sz: 11, h: 24});
    fila('Total en Bs' + (d.tasa ? ' (tasa ' + N(d.tasa.valor, 2) + ')' : ''), T.total_bs != null ? bs(T.total_bs) : '—', {b: 1});
    L.linea(tx, y0 - 2, tx + tw, y0 - 2, YEL, 1.5);
    y += 6;
    if (d.observaciones) { for (const ln of envolver('Observaciones: ' + d.observaciones, 8.5, 0, W - 2 * M)) { L.texto(ln, M, y + 10, 8.5, {color: GRY}); y += 11; } y += 4; }
    if (d.aviso) { const ls = envolver(d.aviso, 8.5, 0, W - 2 * M - 16); L.rect(M, y, W - 2 * M, ls.length * 11 + 8, [1, 0.97, 0.85], YEL); ls.forEach((t, k) => L.texto(t, M + 8, y + 13 + k * 11, 8.5)); y += ls.length * 11 + 14; }

    const yfi = Math.max(y + 34, H - 100);

    L.texto(pedido ? 'Vendedor' : 'Despachado por', M, yfi + 11, 8.5, {color: GRY}); L.texto('Recibido conforme', W - M - 170, yfi + 11, 8.5, {color: GRY});
    const total = nPag();
    /* pie con número de página en cada hoja */
    const pie = [];
    for (let i = 0; i < total; i++) { L.pags[i].push(`BT ${RED.map(v => v.toFixed(3)).join(' ')} rg /F1 7.5 Tf ${M} ${f2(24)} Td (${esc(bytesTxt(d.titulo + ' ' + d.numero + ' · ' + (E.razon || 'El Maná JL')))}) Tj ET`);
      const pg = 'Página ' + (i + 1) + ' de ' + total; L.pags[i].push(`BT 0.42 0.42 0.42 rg /F1 7.5 Tf ${f2(W - M - ancho(pg, 7.5))} ${f2(24)} Td (${esc(bytesTxt(pg))}) Tj ET`); }

  }

  /* Logo: cualquier imagen (data URL o ruta del mismo sitio) → JPEG RGB sobre fondo blanco, para incrustarlo sin librerías */
  function cargarLogo(src) {
    return new Promise(res => {

      im.onload = () => {
        try {

  }

  async function descargar(d, logoSrc) {
    const bytes = generar(d, await cargarLogo(logoSrc)); bajar(bytes, d.archivo || 'Documento.pdf'); return bytes;
  }
  return {generar, descargar, cargarLogo};
})();

<script>
/* Entregas en el PORTAL DEL CLIENTE: por factura, cuenta regresiva, descuento vigente, «cuánto pagar hoy» ($ y Bs) y el botón «No recibí esto».
   Autocontenido: no depende de la app del equipo. Uso desde cualquier página del portal:
     EntregasPortal.montar(document.getElementById('x'), {token: 'CODIGO_PERSONAL'});   // pide /api/c/entregas/estado con la cabecera x-token
     EntregasPortal.html(estado)  → solo el HTML de las tarjetas (si el portal ya tiene `estado` de /api/c/entregas/estado)
   Rutas: GET /api/c/entregas/estado · POST /api/c/entregas/no-recibi {id_documento, nota} · POST /api/c/entregas/llegada {id_documento, foto, mini, bultos_recibidos}. */
const EntregasPortal = (() => {
  const N2 = new Intl.NumberFormat('es-VE', {minimumFractionDigits: 2, maximumFractionDigits: 2});
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
  const usd = x => x == null ? '—' : '$ ' + N2.format(x), bs = x => x == null ? '—' : 'Bs ' + N2.format(x);
  const fecha = s => { const d = new Date(String(s).slice(0, 10) + 'T12:00:00'); return isNaN(d) ? '—' : d.toLocaleDateString('es-VE', {day: '2-digit', month: '2-digit', year: 'numeric'}); };
  const fechaHora = ts => new Date(ts).toLocaleString('es-VE', {day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit'});
  const MS = 864e5;
  const cuenta = ms => { if (ms == null) return '—'; if (ms <= 0) return '0 min'; const d = Math.floor(ms / MS), h = Math.floor(ms % MS / 36e5), m = Math.floor(ms % 36e5 / 6e4), s = Math.floor(ms % 6e4 / 1e3); return d > 0 ? `${d} d ${String(h).padStart(2, '0')} h ${String(m).padStart(2, '0')} min` : `${h} h ${String(m).padStart(2, '0')} min ${String(s).padStart(2, '0')} s`; };
  let st = {token: null, el: null, estado: null, desfase: 0, timer: null, err: null, ll: {}, vistos: {}};

  /* Compresión de la foto en el navegador: lado mayor 1000 px, JPEG calidad 0.6. Si aun así pasa del tope, baja la calidad y luego el tamaño. */
  const TOPE = 400000, MAX_ORIGINAL = 40 * 1048576;
  async function abrir(file) {
    if (typeof createImageBitmap === 'function') { try { return await createImageBitmap(file, {imageOrientation: 'from-image'}); } catch (e) { /* se prueba con <img> */ } }
    const url = URL.createObjectURL(file);
    try { return await new Promise((ok, mal) => { const im = new Image(); im.onload = () => ok(im); im.onerror = () => mal(new Error('x')); im.src = url; }); } finally { setTimeout(() => URL.revokeObjectURL(url), 5000); }
  }
  function dibujar(img, lado, q) {
    const w0 = img.naturalWidth || img.width, h0 = img.naturalHeight || img.height, k = Math.min(1, lado / Math.max(w0, h0));
    const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w0 * k)); c.height = Math.max(1, Math.round(h0 * k));
    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', q).split(',')[1];
  }
  async function comprimir(file) {
    if (!file || (file.type && !/^image\//i.test(file.type))) throw new Error(/pdf/i.test(file.type) ? 'Los PDF no se pueden subir. Toma una foto o una captura de pantalla del comprobante.' : 'Ese archivo no es una imagen. Elige una foto o una captura de pantalla.');
    if (file.size > MAX_ORIGINAL) throw new Error('La imagen es demasiado pesada. Elige una de menos de 40 MB.');
    let img; try { img = await abrir(file); } catch (e) { throw new Error(/hei[cf]/i.test(file.type + ' ' + file.name) ? 'Esa foto está en formato HEIC y este aparato no la puede abrir. Toma una captura de pantalla de la foto o cambia la cámara a «Más compatible» (JPG).' : 'No se pudo leer esa imagen. Prueba con una foto JPG o PNG o una captura de pantalla.'); }
    let lado = 1000, q = 0.6, foto = dibujar(img, lado, q);
    while (foto.length > TOPE && q > 0.31) { q = Math.round((q - 0.1) * 10) / 10; foto = dibujar(img, lado, q); }
    while (foto.length > TOPE && lado > 640) { lado -= 120; foto = dibujar(img, lado, q); }

  }

  const CSS = `.ep{display:grid;gap:12px;font-family:inherit}.ep *{box-sizing:border-box}
  .ep-c{background:#fff;color:#1b1b1b;border:1px solid #ddd;border-radius:14px;padding:14px;display:grid;gap:8px}
  .ep-h{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}.ep-h b{font-size:17px}.ep-h span{color:#666;font-size:13px}
  .ep-chip{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600;background:#eee;color:#333}

  function tarjeta(d) {
    const t = d.temporizador, p = d.pagar, tasa = st.estado.tasa;
    let estado, cd = '';
    if (!d.entrega) { estado = '<span class="ep-chip ep-warn">Entrega sin verificar</span>'; cd = '<p class="ep-m">Tu plazo de pago empieza con la primera foto de la entrega: la tuya o la de Despachos.</p>'; }
    else if (t.pausada) { estado = '<span class="ep-chip ep-warn">Plazo en pausa</span>'; cd = '<p class="ep-m">Avisaste que no recibiste esto. Mientras Cobranza lo revisa, tu plazo no corre.</p>'; }
    else if (t.tramo === 3) { estado = '<span class="ep-chip ep-crit">Vencida</span>'; cd = `<p class="ep-m">Pasaron ${t.dias} días desde la entrega${t.dias_vencida ? ` (${t.dias_vencida} después del plazo)` : ''}.${t.recargo_pct != null ? ` Recargo por mora: ${N2.format(t.recargo_pct)} %.` : ''}</p>`; }
    else {
      estado = `<span class="ep-chip ${t.descuento_pct != null ? 'ep-ok' : ''}">${t.tramo === 1 ? 'Primer plazo' : 'Segundo plazo'}</span>`;
      cd = `<div class="ep-cd" data-vence="${t.vence_ts}">${cuenta(t.restante_ms)}<small>${t.descuento_pct != null ? `para pagar con ${N2.format(t.descuento_pct)} % de descuento` : 'que le quedan a este plazo'} · entregada el ${fechaHora(d.entrega.fecha_hora)}</small></div>`;
    }
    const mostrarPago = d.entrega || p.normal_usd != null;
    const pago = mostrarPago ? `<div class="ep-pay"><span>${p.descuento_aplicado ? 'Pagando hoy con el descuento' : p.recargo_aplicado ? 'Pagando hoy (con recargo por mora)' : 'Saldo a pagar'}</span><b>${usd(p.hoy_usd)}</b>${p.hoy_bs != null ? `<span>${bs(p.hoy_bs)} · tasa BCV ${N2.format(tasa.valor)} del ${fecha(tasa.fecha)}${tasa.es_de_hoy ? '' : ' (última publicada)'}</span>` : '<span>Equivalente en bolívares no disponible por ahora.</span>'}${p.descuento_aplicado ? `<span>Ahorras ${usd((p.normal_usd - p.hoy_usd))} frente a pagar sin descuento (${usd(p.normal_usd)}).</span>` : ''}</div>` : '';
    const rec = d.reclamo ? '<p class="ep-m">Ya avisaste que no lo recibiste. Estamos revisando.</p>' : d.puede_reclamar ? `<button type="button" class="ep-btn" data-ep="reclamar" data-id="${d.id_documento}">No recibí esto</button>` : '<p class="ep-m">Este documento ya tuvo reclamos: comunícate con Cobranza.</p>';
    const ll = d.llegada ? `<p class="ep-m">${d.llegada.coincide === false ? `Avisaste que recibiste <b>${d.llegada.bultos_recibidos}</b>${d.bultos_despachados != null ? ' de ' + d.bultos_despachados : ''} bultos. No coincide con lo despachado: Ventas y Cobranza lo revisan.` : `Avisaste que recibiste <b>${d.llegada.bultos_recibidos}</b> ${d.llegada.bultos_recibidos === 1 ? 'bulto' : 'bultos'}. Gracias.`}</p>`
      : `<div class="ep-ll" data-ll="${d.id_documento}"><button type="button" class="ep-btn" data-ep="llegada" data-id="${d.id_documento}">Ya llegó mi pedido</button></div>`;
    return `<article class="ep-c" data-doc="${d.id_documento}"><div class="ep-h"><b>${d.tipo === 'NOTA_ENTREGA' ? 'Nota de entrega' : 'Factura'} ${esc(d.nro)}</b><span>Emitida ${fecha(d.fecha_emision)} · ${usd(d.total)}</span></div><div>${estado}</div>${cd}${pago}${ll}<div data-form="${d.id_documento}">${rec}</div></article>`;
  }
  const html = estado => estado.documentos.length ? `<div class="ep">${estado.documentos.map(d => tarjeta(d)).join('')}</div>` : '<div class="ep"><p class="ep-vacio">No tienes facturas ni notas pendientes de pago.</p></div>';

  async function api(metodo, ruta, cuerpo) {
    const r = await fetch('/api/c/entregas' + ruta, {method: metodo, headers: {'content-type': 'application/json', 'x-token': st.token}, body: cuerpo ? JSON.stringify(cuerpo) : undefined});
    let j = {}; try { j = await r.json(); } catch (e) { /* sin cuerpo */ }
    if (!r.ok) { const e = new Error(j.error || 'No se pudo completar la operación.'); e.status = r.status; throw e; }
    return j;
  }
  async function cargar(silencioso) {
    try { st.estado = await api('GET', '/estado'); st.desfase = st.estado.ahora - Date.now(); st.err = null; } catch (e) { st.err = e; }
    if (silencioso && st.el && st.el.querySelector('[data-ll] input, [data-form] textarea, [data-form] input')) return;   // no borrar una foto o un texto a medio llenar
    pintar();
  }
  function pintar() {
    if (!st.el) return;
    st.el.innerHTML = st.err ? `<div class="ep"><p class="ep-e" role="alert">${esc(st.err.message)}</p></div>` : html(st.estado);
  }
  function tic() {
    if (!st.el || !st.estado) return;
    const ahora = Date.now() + st.desfase; let vencido = false;
    st.el.querySelectorAll('[data-vence]').forEach(e => { const ms = +e.dataset.vence - ahora; if (ms <= 0 && !st.vistos[e.dataset.vence]) { vencido = true; st.vistos[e.dataset.vence] = 1; } const n = e.firstChild; if (n && n.nodeType === 3) n.nodeValue = cuenta(ms); });
    if (vencido) { cargar(true); }
  }
  function formulario(id) {
    const c = st.el.querySelector(`[data-form="${id}"]`); if (!c) return;
    c.innerHTML = `<div class="ep-f"><label>¿Qué pasó? (opcional)<textarea maxlength="300" data-ep-nota placeholder="Por ejemplo: no llegó el pedido"></textarea></label><p class="ep-m">Tu plazo de pago se pone en pausa hasta que Cobranza lo revise.</p><p class="ep-e" data-ep-err role="alert" hidden></p>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="ep-btn p" data-ep="enviar" data-id="${id}">Enviar aviso</button><button type="button" class="ep-btn" data-ep="cancelar">Cancelar</button></div></div>`;
    c.querySelector('textarea').focus();
  }
  async function enviar(id, btn) {
    const c = st.el.querySelector(`[data-form="${id}"]`), e = c.querySelector('[data-ep-err]'); e.hidden = true; btn.disabled = true;
    try { const r = await api('POST', '/no-recibi', {id_documento: id, nota: c.querySelector('[data-ep-nota]').value}); await cargar(); const n = st.el.querySelector(`[data-form="${id}"]`); if (n) n.insertAdjacentHTML('afterbegin', `<p class="ep-m" role="status">${esc(r.mensaje)}</p>`); }
    catch (er) { e.textContent = er.message; e.hidden = false; btn.disabled = false; }
  }
  function formLlegada(id) {
    const c = st.el.querySelector(`[data-ll="${id}"]`); if (!c) return; st.ll[id] = {foto: null, mini: null};
    c.innerHTML = `<label>Foto de cuando llegó el pedido<input type="file" accept="image/*" data-ep-file="${id}"></label><div data-ep-prev="${id}"></div>
      <label>Total de bultos que recibiste<input type="text" inputmode="numeric" maxlength="6" autocomplete="off" data-ep-bultos placeholder="0"></label><p class="ep-e" data-ep-lerr role="alert" hidden></p>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="ep-btn p" data-ep="llegada-enviar" data-id="${id}">Enviar</button><button type="button" class="ep-btn" data-ep="llegada-cancelar" data-id="${id}">Cancelar</button></div>`;
  }
  async function elegirFoto(id, input) {
    const c = st.el.querySelector(`[data-ll="${id}"]`), pv = c.querySelector(`[data-ep-prev="${id}"]`), er = c.querySelector('[data-ep-lerr]'); er.hidden = true; st.ll[id].foto = null;
    if (!input.files || !input.files[0]) { pv.innerHTML = ''; return; }
    pv.innerHTML = '<p class="ep-m">Preparando la foto…</p>';
    try { const r = await comprimir(input.files[0]); st.ll[id] = {foto: r.foto, mini: r.mini}; pv.innerHTML = `<img class="ep-prev" alt="Tu foto" src="data:image/jpeg;base64,${r.foto}"><p class="ep-m">Lista (${r.kb} KB).</p>`; }
    catch (e) { pv.innerHTML = ''; input.value = ''; er.textContent = e.message; er.hidden = false; }
  }
  async function enviarLlegada(id, btn) {
    const c = st.el.querySelector(`[data-ll="${id}"]`), er = c.querySelector('[data-ep-lerr]'), f = st.ll[id] || {}, n = c.querySelector('[data-ep-bultos]').value.trim(); er.hidden = true;
    if (!f.foto) { er.textContent = 'Toma o elige la foto de cuando llegó el pedido.'; er.hidden = false; return; }
    if (!/^\d{1,6}$/.test(n)) { er.textContent = 'Escribe cuántos bultos recibiste en total (un número entero, 0 o más).'; er.hidden = false; return; }
    btn.disabled = true;
    try { const r = await api('POST', '/llegada', {id_documento: id, foto: f.foto, mini: f.mini, bultos_recibidos: +n}); delete st.ll[id]; await cargar(); const a = st.el.querySelector(`[data-doc="${id}"]`); if (a) a.insertAdjacentHTML('beforeend', `<p class="ep-m" role="status"><b>${esc(r.mensaje)}</b></p>`); }
    catch (x) { er.textContent = x.message; er.hidden = false; btn.disabled = false; }
  }
  function montar(el, {token}) {
    st.token = token; st.el = el; el.innerHTML = '<div class="ep"><p class="ep-vacio">Cargando…</p></div>';
    if (!document.getElementById('ep-css')) { const s = document.createElement('style'); s.id = 'ep-css'; s.textContent = CSS; document.head.appendChild(s); }
    el.addEventListener('click', ev => {
      const b = ev.target.closest('[data-ep]'); if (!b) return;
      if (b.dataset.ep === 'reclamar') formulario(+b.dataset.id);
      else if (b.dataset.ep === 'cancelar') pintar();
      else if (b.dataset.ep === 'enviar') enviar(+b.dataset.id, b);
      else if (b.dataset.ep === 'llegada') formLlegada(+b.dataset.id);
      else if (b.dataset.ep === 'llegada-cancelar') pintar();
      else if (b.dataset.ep === 'llegada-enviar') enviarLlegada(+b.dataset.id, b);
    });
    el.addEventListener('change', ev => { const i = ev.target.closest('[data-ep-file]'); if (i) elegirFoto(+i.dataset.epFile, i); });
    clearInterval(st.timer); st.timer = setInterval(tic, 1000);
    return cargar();
  }
  return {montar, html, cuenta, recargar: cargar, comprimir, CSS};
})();

<script>
/* Portal del cliente (página pública /cliente.html). Habla SOLO con /api/c/portal/*; el código personal viaja en la cabecera x-token.

(function () {

window.esc = esc; /* lo usa el buscador común */

  camion: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 6h11v10H2z"/><path d="M13 9h4l4 4v3h-8"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/></svg>',
  moneda: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.5 9.5c0-1 1.2-1.5 2.5-1.5s2.5.6 2.5 1.7c0 2.3-5 1.2-5 3.6 0 1.1 1.2 1.7 2.5 1.7s2.5-.6 2.5-1.5"/></svg>'
};

const S = {tok: '', vista: 'inicio', cuenta: null, perfil: null, cat: null, cart: {}, q: '', categoria: 'Todos', sub: 'docs', cargando: true, errLogin: '', enviando: false, hoja: null, pago: {banco: '', referencia: '', monto: '', fecha: '', nota: '', comp: null, compKb: 0, compOcupado: false, err: '', ok: ''}, nota: ''};

/* ---------- Servidor ---------- */
async function api(m, p, b) {
  const r = await fetch('/api/c/portal' + p, {method: m, headers: {'content-type': 'application/json', 'x-token': S.tok}, body: b ? JSON.stringify(b) : undefined});
  let j = {}; try { j = await r.json(); } catch (e) { /* sin cuerpo */ }
  if (!r.ok) { const e = new Error(j.error || 'No se pudo completar. Inténtalo de nuevo.'); e.status = r.status; e.info = j; throw e; }

}
/* Las imágenes internas necesitan el código personal en la cabecera: se bajan con fetch y se muestran desde memoria */
const PIXEL = 'data:image/gif;base64,R0lGODlhAQABAAAAACwAAAAAAQABAAA=', IMG_CACHE = new Map();
function imgsPendientes() {
  document.querySelectorAll('img[data-psrc]').forEach(im => {
    const u = im.getAttribute('data-psrc'); im.removeAttribute('data-psrc');
    const hit = IMG_CACHE.get(u); if (typeof hit === 'string') { im.src = hit; return; }
    const pr = hit || fetch(u, {headers: {'x-token': S.tok}}).then(r => r.ok ? r.blob() : Promise.reject(new Error('x'))).then(b => URL.createObjectURL(b));

let imgT = 0;
new MutationObserver(() => { if (!imgT) imgT = setTimeout(() => { imgT = 0; imgsPendientes(); }, 30); }).observe(document.body, {childList: true, subtree: true});

async function cargar() {

    S.perfil = yo; S.cat = cat; S.cuenta = cu; S.errLogin = '';
    for (const id of Object.keys(S.cart)) { const p = cat.find(x => x.id_producto === +id); if (!p || p.sin_inventario) delete S.cart[id]; else S.cart[id] = Math.min(S.cart[id], p.disponible); }
  } catch (e) {
    if (e.status === 401 || e.status === 429) { S.tok = ''; S.errLogin = e.message; try { sessionStorage.removeItem('em_ct'); } catch (x) { /* sin almacenamiento */ } } else S.errLogin = e.message;

}

function aviso(t, mal) { if (!mal && window.Borrador) Borrador.exito(); const d = document.createElement('div'); d.className = 'tt' + (mal ? ' e' : ''); d.textContent = t; $('#toast').appendChild(d); setTimeout(() => d.remove(), mal ? 7000 : 4500); }

/* ---------- Carrito ---------- */
const prod = id => (S.cat || []).find(p => p.id_producto === +id);

function totalConIva() { let t = 0; for (const {p, q} of lineasCarrito()) t += q * p.precio * (1 + (p.iva ?? 16) / 100); return Math.round(t * 100) / 100; }

  const p = prod(id); if (!p) return; n = Math.max(0, Math.min(p.disponible, Math.floor(+n || 0)));

  return `<section class="card"><p class="sub">Hola, <b>${esc(y.cliente.nombre)}</b></p><h2 class="sr">Resumen</h2>

    ${bs ? `<p class="sub">Aproximadamente ${bsf(bs)} (tasa BCV del ${fdl(y.tasa.fecha)}: ${N2.format(y.tasa.valor)}). Es solo una guía.</p>` : ''}
    ${y.deuda_desde ? `<p class="sub">Debes desde el ${fdl(y.deuda_desde)} (hace ${y.dias_desde} ${y.dias_desde === 1 ? 'día' : 'días'}).</p>` : '<p class="sub">No tienes facturas ni notas por pagar.</p>'}

  if (S.bancos && S.bancos.bancos.length ? !P.id_banco : !P.banco.trim()) { P.err = 'Elige el banco.'; return pintar(); }
  if (!P.referencia.trim()) { P.err = 'Escribe el número de referencia.'; return pintar(); }
  if (!(monto > 0)) { P.err = 'Escribe el monto en bolívares. Ejemplo: 1250,50'; return pintar(); }
  S.enviando = true; pintar();
  try {
    const r = await api('POST', '/pagos', {banco: P.banco, id_banco: P.id_banco || undefined, referencia: P.referencia, monto_bs: monto, fecha_pago: P.fecha, nota: P.nota, comprobante: P.comp || undefined});
    Object.assign(P, {banco: '', id_banco: '', referencia: '', monto: '', fecha: '', nota: '', comp: null, compKb: 0, err: '', ok: `${r.codigo}: ${r.mensaje}`}); S.enviando = false; await refrescarCuenta(); pintar();
  } catch (e) { S.enviando = false; P.err = e.message; pintar(); }
}

/* ---------- Eventos ---------- */
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-a]'); if (!b) return; const a = b.dataset.a, id = b.dataset.id;
  if (a === 'ir') { S.vista = b.dataset.v; S.pago.ok = ''; pintar(); window.scrollTo(0, 0); }
  else if (a === 'cat') { S.categoria = b.dataset.v; pintar(); }
  else if (a === 'sub') { S.sub = b.dataset.v; pintar(); }
  else if (a === 'mas') ponerCant(id, (S.cart[id] || 0) + 1);
  else if (a === 'menos') ponerCant(id, (S.cart[id] || 0) - 1);
  else if (a === 'revisar') hojaPedido();
  else if (a === 'enviar-pedido') enviarPedido();
  else if (a === 'cerrar') cerrarHoja();
  else if (a === 'quitar-comp') { S.pago.comp = null; S.pago.compKb = 0; pintar(); }
  else if (a === 'doc') verDoc(id);
  else if (a === 'pdfdoc') bajarPdf('/documentos/' + id + '/pdf');
  else if (a === 'pdfped') bajarPdf('/pedidos-venta/' + id + '/pdf');
  else if (a === 'cancelar') { if (!confirm('¿Cancelar este pedido?')) return; try { await api('POST', '/pedidos/' + id + '/cancelar'); await refrescarCuenta(); pintar(); aviso('Pedido cancelado.'); } catch (er) { aviso(er.message, 1); } }
  else if (a === 'salir') { S.tok = ''; S.perfil = null; S.cuenta = null; S.cart = {}; try { sessionStorage.removeItem('em_ct'); } catch (x) { /* nada */ } history.replaceState(null, '', location.pathname); pintar(); }
});
document.addEventListener('input', e => { const t = e.target; if (t.classList && t.classList.contains('qin')) { const l = t.value.replace(/\D/g, ''); if (l !== t.value) t.value = l; ponerCant(t.dataset.id, l === '' ? 0 : +l); } });
document.addEventListener('change', async e => {
  if (e.target.id !== 'f-comp') return; const P = S.pago, f = e.target.files && e.target.files[0]; if (!f) return;
  const f2 = document.getElementById('f-pago'); if (f2) Object.assign(P, {banco: f2.elements.banco ? f2.elements.banco.value : P.banco, id_banco: f2.elements.id_banco ? f2.elements.id_banco.value : P.id_banco, referencia: f2.elements.referencia.value, monto: f2.elements.monto.value, fecha: f2.elements.fecha.value, nota: f2.elements.nota.value});
  P.err = ''; P.ok = ''; P.compOcupado = true; P.comp = null; pintar();
  try { const r = await EntregasPortal.comprimir(f); P.comp = r.foto; P.compKb = r.kb; } catch (er) { P.err = er.message; }
  P.compOcupado = false; pintar();
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'f-codigo') { S.tok = $('#codigo').value.trim(); try { sessionStorage.setItem('em_ct', S.tok); } catch (x) { /* nada */ } history.replaceState(null, '', location.pathname + '#' + S.tok); cargar(); }
  else if (e.target.id === 'f-pago') enviarPago(e.target);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') cerrarHoja(); });
document.addEventListener('click', e => { if (e.target.id === 'vel') cerrarHoja(); });

S.tok = leerCodigo(); try { if (!S.tok) S.tok = sessionStorage.getItem('em_ct') || ''; } catch (x) { /* nada */ }
/* Borrador: lo que la persona estaba escribiendo y dónde estaba (solo en este navegador, 24 h; el código personal nunca se guarda) */
try {
  if (window.Borrador) {
    const hh = s => { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36); };
    Borrador.config({ctx: () => S.tok ? 'p:' + hh(S.tok) + ':' + S.vista : null, aviso: t => aviso(t)});
    Borrador.registrar('portal', () => ({vista: S.vista, cat: S.categoria, sub: S.sub, q: S.q, nota: S.nota, cart: S.cart, pago: {banco: S.pago.banco, id_banco: S.pago.id_banco, referencia: S.pago.referencia, monto: S.pago.monto, fecha: S.pago.fecha, nota: S.pago.nota}}),
      v => { if (!v) return; S.vista = v.vista || S.vista; S.categoria = v.cat || S.categoria; S.sub = v.sub || S.sub; S.q = v.q || ''; S.nota = v.nota || ''; Object.assign(S.cart, v.cart || {}); Object.assign(S.pago, v.pago || {}); if (S.perfil) pintar(); },
      () => S.tok ? 'p:' + hh(S.tok) + ':*' : null);
  }
} catch (e) { /* sin borrador */ }
if (S.tok) cargar(); else { S.cargando = false; pintar(); }
})();

</script></body></html>
